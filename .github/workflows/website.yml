# Builds btx-community.com and publishes it.
#
# Pull request: check the content and build the site, so a broken link or a missing
# translation shows up in the review, not on the live page.
# Merge to main: build again and force-push the result as a single commit to the branch
# "site-build". The server pulls that branch itself every two minutes (deploy/sync.sh);
# GitHub holds no credentials to the server.
#
# The push uses the organisation's GitHub App "BTX Community site publisher" (client ID in the
# variable SITE_PUBLISHER_CLIENT_ID, private key in the secret SITE_PUBLISHER_KEY, both in the
# environment "site-publish"). A ruleset lets only this app write site-build, and the
# environment releases the key only to jobs running on main, so nothing reaches the live site
# without passing review on main.
#
# Only first-party actions (github.com/actions) are used, pinned to a commit SHA (version in
# the comment).

name: Website

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install the build dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --disable-pip-version-check -r site/requirements.txt

      - name: Run the tests
        run: |
          .venv/bin/python -m unittest discover -s site/tests
          node --test site/tests/*.test.js

      - name: Build the site
        run: .venv/bin/python site/build.py --out _site

  publish:
    name: Publish to site-build
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: site-publish
    concurrency:
      group: website-publish
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build the site
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --disable-pip-version-check -r site/requirements.txt
          .venv/bin/python site/build.py --out _site

      - name: Get a token of the publisher app
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.SITE_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.SITE_PUBLISHER_KEY }}
          permission-contents: write

      - name: Push the build to site-build
        env:
          TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          cd _site
          git init -q -b site-build
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Build of ${GITHUB_SHA}"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" \
              push --force "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:site-build
