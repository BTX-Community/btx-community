  fr: "Minage sur cartes AMD grand public"
- en: "An exact INT8 MatMul path for consumer Radeon cards, so they can mine."
  fr: >-
    Un chemin MatMul INT8 exact pour les cartes Radeon grand public, pour qu'elles puissent miner.
- en: >-
    The node's AMD (HIP) path admits six datacenter Instinct chips: gfx908, gfx90a, gfx940, gfx941,
    gfx942 and gfx950 (MI100 to MI350). It is built automatically when a HIP clang and an AMD GPU
    are found. Consumer Radeon cards (RDNA, gfx10 to gfx12) are used neither to mine nor to
    validate; the source calls them verification-only until cross-vendor golden vectors qualify
    them.
  fr: >-
    Le chemin AMD (HIP) du nœud admet six puces Instinct de centre de données : gfx908, gfx90a,
    gfx940, gfx941, gfx942 et gfx950 (MI100 à MI350) ; il se compile tout seul quand un clang HIP et
    un GPU AMD sont trouvés. Les Radeon grand public (RDNA, gfx10 à gfx12) ne servent ni à miner ni
    à valider ; le code les dit verification-only tant que des vecteurs golden inter-fabricants ne
    les qualifient pas.
- en: >-
    An exact INT8 path on RDNA that matches the CPU reference bit for bit, and the golden vectors
    that show it. Whether such a path is admitted is the maintainer's decision.
  fr: >-
    Un chemin INT8 exact sur RDNA qui corresponde bit à bit à la référence CPU, et les vecteurs
    golden qui le montrent. L'admission d'un tel chemin est la décision du mainteneur.
- en: "How the node admits a GPU (developers)"
  fr: "Comment le nœud admet un GPU (développeurs)"
- en: "The HIP backend sources (developers)"
  fr: "Les sources du backend HIP (développeurs)"
- en: "Evidence as an issue on btxchain/btx; no lane of this hub covers AMD yet."
  fr: >-
    Les éléments de preuve en issue sur btxchain/btx ; aucun chantier de ce hub ne couvre encore
    AMD.
- en: "Testing on Apple Silicon"
  fr: "Tests sur Apple Silicon"
- en: >-
    Run the node's Metal self-test on more Apple chips and report the results, so the Metal path is
    known to work beyond one device class.
  fr: >-
    Faire tourner l'autotest Metal du nœud sur d'autres puces Apple et en rapporter les résultats,
    pour savoir que le chemin Metal fonctionne au-delà d'une classe d'appareil.
- en: >-
    Metal is built by default on Apple. A Metal device is admitted after the node's exactness
    self-tests, through Metal 4 INT8 tensor ops or, for the current epoch's replay, an exact
    integer-ALU path. A golden row, where one exists, is compared; without one the self-test decides
    (the manifest has one row, for an M4-class device). The release has no macOS binaries.
  fr: >-
    Metal est compilé par défaut sur Apple. Un appareil Metal est admis après les autotests
    d'exactitude du nœud, via les opérations tensorielles INT8 de Metal 4 ou, pour rejouer l'époque
    actuelle, un chemin exact en ALU entière. Là où une ligne golden existe, elle est comparée ;
    sinon l'autotest décide (le manifeste en a une, pour la classe M4). La version n'a pas de
    binaires macOS.
- en: "Self-test reports from other Apple chips."
  fr: "Des rapports d'autotest d'autres puces Apple."
- en: "Building on macOS (developers)"
  fr: "Compiler sous macOS (développeurs)"
- en: "The cross-device lane: I-XDEV pack"
  fr: "Le chantier inter-appareils : paquet I-XDEV"
- en: "The I-XDEV lane, which replays blocks across devices; it has no owner yet."
  fr: >-
    Le chantier I-XDEV, qui rejoue les blocs sur différents appareils ; il n'a pas encore de
    responsable.
- en: "Explorers, monitoring and light wallets"
  fr: "Explorateurs, surveillance et portefeuilles légers"
- en: >-
    More independent views of the chain, alerts when something goes wrong, and wallets for people
    who do not run a node all the time.
  fr: >-
    Davantage de vues indépendantes sur la chaîne, des alertes quand quelque chose ne va pas, et des
    portefeuilles pour qui ne fait pas tourner un nœud en permanence.
- en: >-
    Several explorers and a status page are on the links page; the status page publishes its figures
    as JSON. btx-cli lightwatch is a watch-only light client: it reads compact block filters from a
    node it trusts (started with -blockfilterindex=1) and signs nothing. The node also reads and
    writes a browser-wallet recovery format.
  fr: >-
    Plusieurs explorateurs et une page d'état figurent sur la page des liens ; la page d'état publie
    ses chiffres en JSON. btx-cli lightwatch est un client léger en lecture seule : il lit les
    filtres de blocs compacts d'un nœud de confiance (démarré avec -blockfilterindex=1) et ne signe
    rien. Le nœud lit et écrit aussi un format de récupération pour portefeuilles de navigateur.
- en: >-
    Explorers and monitors run by more independent operators, alerting, and light wallets that can
    also sign.
  fr: >-
    Des explorateurs et des moniteurs tenus par davantage d'opérateurs indépendants, des alertes, et
    des portefeuilles légers qui puissent aussi signer.
- en: "Explorers and the status page in the link list"
  fr: "Explorateurs et page d'état dans la liste de liens"
- en: "The status page's JSON"
  fr: "Le JSON de la page d'état"
- en: "Browser wallet and node wallet formats (developers)"
  fr: "Formats des portefeuilles de navigateur et de nœud (développeurs)"
- en: "The community chats on the links page."
  fr: "Les chats de la communauté sur la page des liens."
