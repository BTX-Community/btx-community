- en: Open for edits
  fr: Ouverte aux modifications
- en: The bootstrap window and the 1,000,000 BTX deployment reward
  fr: La fenêtre d'amorçage et la récompense de déploiement de 1 000 000 BTX
- en: >-
    The first question most newcomers ask, answered from chain data: what the first 50,000 blocks
    produced, under which consensus rules, and what public data can and cannot show.
  fr: >-
    La première question de la plupart des nouveaux venus, traitée à partir des données de la chaîne
