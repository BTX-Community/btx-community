  fr: "Recompilateurs Guix"
- en: "templates out, blocks back"
  fr: "modèles à l'aller, blocs au retour"
- en: >-
    A full node hands out block templates; miners and pools send solved blocks back
    (getblocktemplate, then a stratum job, then submitblock).
  fr: >-
    Un nœud complet distribue des modèles de bloc ; mineurs et pools renvoient les blocs résolus
    (getblocktemplate, puis une tâche stratum, puis submitblock).
- en: "blocks and transactions"
  fr: "blocs et transactions"
- en: >-
    Blocks and transactions travel between peers. A node that keeps every block serves the whole
    chain; a trusted mirror still checks bodies, transactions, scripts and state itself, and for the
    MatMul work it relies on its signers.
  fr: >-
    Blocs et transactions circulent entre pairs. Un nœud qui garde chaque bloc sert toute la chaîne
    ; un miroir de confiance vérifie toujours lui-même le contenu des blocs, les transactions, les
    scripts et l'état, et pour le travail MatMul il s'appuie sur ses signataires.
- en: "swap offers over the same peer links"
  fr: "offres d'échange par les mêmes liens entre pairs"
- en: >-
    A node started with -swapnet=1 finds other SwapNet nodes over the peer connections it already
    has: no new port, seed list or hosted service. SwapNet is off by default.
  fr: >-
    Un nœud démarré avec -swapnet=1 trouve d'autres nœuds SwapNet par les connexions entre pairs
    qu'il a déjà : pas de nouveau port, pas de liste de seeds, pas de service hébergé. SwapNet est
    désactivé par défaut.
- en: "peer addresses only"
  fr: "adresses de pairs uniquement"
- en: >-
    A discovery relay (-matmulvalidation=relay) is the mode meant for public DNS seeds and addnode
    hosts. It only hands out peer addresses: it serves no blocks, is no authority on the chain and
    never asks for or serves signatures.
  fr: >-
    Un relais de découverte (-matmulvalidation=relay) est le mode prévu pour les seeds DNS publics
    et les hôtes addnode. Il ne distribue que des adresses de pairs : il ne sert aucun bloc, ne fait
    pas autorité sur la chaîne et ne demande ni ne sert jamais de signatures.
- en: "signed attestations"
  fr: "attestations signées"
- en: >-
    A signer signs each block whose MatMul work it replayed (messages getmmattest and mmattest). On
    mainnet a trusted mirror by default accepts that work only with signatures from at least two
    keys it pinned itself; any peer may pass them on. A node that checks blocks itself never uses
    them in place of its own check.
  fr: >-
    Un signataire signe chaque bloc dont il a rejoué le travail MatMul (messages getmmattest et
    mmattest). Sur le mainnet, par défaut, un miroir de confiance n'accepte ce travail qu'avec les
    signatures d'au moins deux clés qu'il a épinglées ; tout pair peut les relayer. Un nœud qui
    vérifie lui-même les blocs ne les met jamais à la place de sa propre vérification.
- en: "a signed starting point"
  fr: "un point de départ signé"
- en: >-
    A snapshot saves a new node most of the sync: a signed copy of a node's data, or a UTXO snapshot
    at a height compiled into btxd (loadtxoutset). Check its SHA-256 and signature before you load
    it. A node holding an attested UTXO snapshot can also offer it to peers over the P2P network.
  fr: >-
    Un snapshot épargne à un nouveau nœud l'essentiel de la synchronisation : une copie signée des
    données d'un nœud, ou un snapshot UTXO à une hauteur compilée dans btxd (loadtxoutset). Vérifiez
    son SHA-256 et sa signature avant de le charger. Un nœud qui détient un snapshot UTXO attesté
    peut aussi le proposer à ses pairs sur le réseau P2P.
- en: "chain data from an archive node"
  fr: "données de chaîne d'un nœud d'archive"
- en: "The status page measures supply, chain height and network figures from an archive node."
  fr: >-
    La page d'état mesure l'offre, la hauteur de la chaîne et les chiffres du réseau à partir d'un
    nœud d'archive.
- en: "release archives"
  fr: "archives des versions"
- en: >-
    Release archives are published on the releases page of btxchain/btx. For v0.34.16 there are two,
    both for Linux x86_64 (one built with CUDA 13), and a SHA256SUMS file; on other platforms the
    node is built from source.
  fr: >-
    Les archives des versions sont publiées sur la page des releases de btxchain/btx. Pour v0.34.16
    il y en a deux, toutes deux pour Linux x86_64 (l'une compilée avec CUDA 13), et un fichier
    SHA256SUMS ; sur les autres plateformes, le nœud se compile depuis les sources.
- en: "tagged source to rebuild"
  fr: "code étiqueté à recompiler"
- en: >-
    A rebuilder builds a release's tagged source with contrib/guix, attests to the result and
    verifies other rebuilders' attestations. The v0.34.16 release notes say its Linux binaries need
    glibc 2.38 or newer and these scripts build against glibc 2.31, so their hashes cannot match a
    rebuild yet.
  fr: >-
    Un recompilateur compile avec contrib/guix le code étiqueté d'une version, atteste le résultat
    et vérifie les attestations des autres. Selon les notes de v0.34.16, ses binaires Linux exigent
    glibc 2.38 ou plus et ces scripts compilent contre glibc 2.31 : leurs hachages ne peuvent donc
    pas encore correspondre à une recompilation.
# developers split: the start card's two steps
- en: "Ongoing work: test coverage, the nightly CI-0 run and the lanes waiting for an owner."
  fr: >-
    Travaux en cours : couverture de tests, l'exécution nocturne de CI-0 et les chantiers en attente
    d'un responsable.
# start and links pages: fact fixes and new steps of the UX pass
- en: >-
    Unofficial demo with sample data only. SwapNet is in v0.34.16 for broader testing, off unless a
    node starts with -swapnet=1; the page connects to no node or wallet.
  fr: >-
    Démo non officielle, uniquement avec des données d'exemple. SwapNet est dans v0.34.16 pour des
    tests plus larges, désactivé sauf si un nœud démarre avec -swapnet=1 ; la page ne se connecte à
    aucun nœud ni portefeuille.
- en: "What BTX is, in a few facts with their sources."
  fr: "Ce qu'est BTX, en quelques faits avec leurs sources."
- en: "Choose a wallet from the list, after reading \"Before you buy or receive BTX\" below."
  fr: >-
    Choisissez un portefeuille dans la liste, après avoir lu « Avant d'acheter ou de recevoir des
    BTX » plus bas.
- en: "Have a spare machine? Seven ways to give BTX infrastructure, from a node to a fuzz box."
  fr: >-
    Une machine en trop ? Sept façons d'apporter de l'infrastructure à BTX, du nœud à la machine de
    fuzzing.
- en: "Community projects: things to build and run outside the node software."
  fr: >-
    Projets de la communauté : ce qu'on peut construire et faire tourner en dehors du logiciel du
    nœud.
# projects.yaml: the projects at the top of the Projects page
- en: "Build something"
  fr: "Construire quelque chose"
- en: >-
    All of it lies outside the node software. Nothing here is planned, promised or endorsed by the
    node's developers. Each card says what exists today and what is missing, with the source of
    every claim.
  fr: >-
    Tout cela se situe en dehors du logiciel du nœud. Rien ici n'est prévu, promis ni approuvé par
    les développeurs du nœud. Chaque carte dit ce qui existe aujourd'hui et ce qui manque, avec la
    source de chaque affirmation.
- en: "Anything that moves other people's coins starts on regtest or testnet."
  fr: "Tout ce qui déplace les coins d'autres personnes commence sur regtest ou testnet."
- en: "There today"
  fr: "Ce qui existe"
- en: "Missing"
  fr: "Ce qui manque"
- en: "Careful"
  fr: "Attention"
- en: "Start from"
  fr: "Point de départ"
- en: "Rather build something than run a machine? Community projects"
  fr: "Plutôt construire quelque chose que faire tourner une machine ? Projets de la communauté"
- en: "Venues for trading BTX"
  fr: "Plateformes d'échange de BTX"
- en: >-
    A place where people trade BTX against other coins, run by its own operators: an order book, or
    a front-end over SwapNet's swaps.
  fr: >-
    Un lieu où l'on échange des BTX contre d'autres coins, tenu par ses propres opérateurs : un
    carnet d'ordres, ou une interface au-dessus des swaps de SwapNet.
- en: >-
    SwapNet in the node swaps BTX with BTC or ETH between two parties; AMM pools, wrapped balances
    and partial fills are not part of it. This group's venue-structure paper compares four models
    and where the licensing line runs.
  fr: >-
    SwapNet dans le nœud échange des BTX contre des BTC ou des ETH entre deux parties ; les pools
    AMM, les soldes encapsulés et les exécutions partielles n'en font pas partie. Le document de ce
    groupe sur la structure des plateformes compare quatre modèles et situe la limite des licences.
- en: >-
    Operators, a model chosen from the paper, and legal advice where the venue will run. The paper
    is a draft for discussion, not legal advice.
  fr: >-
    Des opérateurs, un modèle choisi dans le document, et un conseil juridique là où la plateforme
    fonctionnera. Le document est un brouillon pour la discussion, pas un conseil juridique.
- en: "The venue-structure paper"
  fr: "Le document sur la structure des plateformes"
- en: "SwapNet overview (developers)"
  fr: "Présentation de SwapNet (développeurs)"
- en: "Discussion of the paper as an issue in this repository."
  fr: "Discussion du document en issue dans ce dépôt."
- en: "SwapNet wallets and tools"
  fr: "Portefeuilles et outils pour SwapNet"
- en: >-
    Software around SwapNet: a wallet that shows quotes and runs swaps, tools that run a maker's
    market, a front-end for the node's swap calls.
  fr: >-
    Des logiciels autour de SwapNet : un portefeuille qui affiche les cotations et exécute les
    swaps, des outils qui font tourner le marché d'un maker, une interface pour les appels de swap
    du nœud.
- en: >-
    A node started with -swapnet=1 finds other SwapNet nodes over its peer links and offers 33 swap
    RPC methods. v0.34.16 carries SwapNet for broader testing. There is no graphical trading panel:
    the RPC console is the interface.
  fr: >-
    Un nœud démarré avec -swapnet=1 trouve d'autres nœuds SwapNet par ses liens entre pairs et offre
    33 méthodes RPC de swap. v0.34.16 inclut SwapNet pour des tests plus larges. Il n'y a pas de
    panneau graphique d'échange : la console RPC est l'interface.
- en: >-
    Everything a non-developer would use. The package's own status page marks real-chain settlement
    and an independent audit as not executed, the ETH leg needs a deployed contract that the node's
    owner approves locally, and the release docs want external receipts before anyone calls it
    mainnet-qualified.
  fr: >-
    Tout ce qu'utiliserait quelqu'un qui n'est pas développeur. La page d'état du paquet marque le
    règlement sur de vraies chaînes et un audit indépendant comme non exécutés, le côté ETH exige un
    contrat déployé que le propriétaire du nœud approuve localement, et la documentation de version
    veut des preuves externes avant de le dire qualifié pour le mainnet.
- en: >-
    Once a taker has funded a swap, cancelling does not release it: the coins stay locked until the
    agreed refund height or time.
  fr: >-
    Une fois qu'un taker a financé un swap, l'annuler ne le libère pas : les coins restent bloqués
    jusqu'à la hauteur ou l'heure de remboursement convenue.
- en: "The 33 swap RPC methods"
  fr: "Les 33 méthodes RPC de swap"
- en: "Running SwapNet on a node"
  fr: "Faire tourner SwapNet sur un nœud"
- en: "Testing and release (developers)"
  fr: "Tests et publication (développeurs)"
