- en: >-
    A normal pull request to release-0.34.17, sent in the Thursday batch with its fork CI run: fails
    before, passes after.
  fr: >-
    Une pull request normale vers release-0.34.17, envoyée dans le lot du jeudi avec son exécution
    de CI sur le fork : échoue avant, passe après.
- en: >-
    A pull request the maintainer closed without taking it is never re-filed; it becomes an evidence
    item or is dropped.
  fr: >-
    Une pull request que le mainteneur a fermée sans la retenir n'est jamais redéposée ; elle
    devient un élément de preuve ou est abandonnée.
- en: >-
    A question counts when the verdict matches and at least one cited source is one the key names;
    11 of 12 pass.
  fr: >-
    Une réponse compte comme juste si le verdict concorde et si au moins une source citée figure
    dans le corrigé ; il faut 11 bonnes réponses sur 12 pour réussir.
- en: >-
    A runner cannot reproduce a stated test: the pull request waits, and the owner, not the runner,
    investigates.
  fr: >-
    Un runner ne parvient pas à reproduire un test indiqué : la pull request attend, et c'est le
    responsable, pas le runner, qui enquête.
- en: A second pass goes in second_pass.handle. The second pass is never the owner.
  fr: Le second relecteur s'inscrit dans second_pass.handle ; ce n'est jamais le responsable.
- en: >-
    A security-relevant finding goes through GitHub private vulnerability reporting on btxchain/btx,
    never into a public issue or a chat; the class goes on the registry without the detail.
