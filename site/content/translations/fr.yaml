  fr: Ponts et réseaux de test
- en: >-
    Experimental and not audited by us. Bridges can lose funds; do not send more than you can afford
    to lose.
  fr: >-
    Expérimentaux et non audités par nous. Les ponts peuvent perdre des fonds ; n'envoyez pas plus
    que ce que vous pouvez vous permettre de perdre.
- en: Last change 2026-07-09.
  fr: Dernière modification le 2026-07-09.
