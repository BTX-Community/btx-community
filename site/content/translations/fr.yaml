- en: "Found a crash or a security problem?"
  fr: "Vous avez trouvé un plantage ou un problème de sécurité ?"
- en: >-
    Report it privately through GitHub private vulnerability reporting on btxchain/btx, as its
    security policy asks. Never post a crash, a sanitizer report or a crashing input in a public
    issue, pull request or chat: it can show an attacker how to crash running nodes.
  fr: >-
    Signalez-le en privé via le signalement privé de vulnérabilités de GitHub sur btxchain/btx,
    comme le demande sa politique de sécurité. Ne publiez jamais un plantage, un rapport de
    sanitizer ou une entrée qui fait planter dans une issue, une pull request ou un chat publics :
    cela peut montrer à un attaquant comment faire planter des nœuds en service.
- en: "Report a vulnerability privately"
  fr: "Signaler une vulnérabilité en privé"
- en: "The security policy (SECURITY.md)"
  fr: "La politique de sécurité (SECURITY.md)"
- en: "Before you run a node at home"
  fr: "Avant de faire tourner un nœud chez soi"
- en: "Privacy"
  fr: "Vie privée"
- en: >-
    Your node shows its IP address to every peer it connects to. A node that accepts inbound
    connections also announces its own address, and peers pass it on.
  fr: >-
    Votre nœud montre son adresse IP à chaque pair auquel il se connecte. Un nœud qui accepte des
    connexions entrantes annonce aussi sa propre adresse, et les pairs la relaient.
- en: >-
    By default btxd asks your router (NAT-PMP or PCP) to open two ports: TCP 19335 for peers and TCP
    29447 for the model network, which btxd starts by itself. The model network also looks for peers
    on your local network over UDP 29448.
  fr: >-
    Par défaut, btxd demande à votre routeur (NAT-PMP ou PCP) d'ouvrir deux ports : TCP 19335 pour
    les pairs et TCP 29447 pour le réseau de modèles, que btxd lance de lui-même. Le réseau de
    modèles cherche en outre des pairs sur votre réseau local via UDP 29448.
- en: >-
    btxd also checks btx.dev for updates every 30 minutes, directly and not through -proxy, and
    sends its version, platform, architecture and rollout group. It installs newer signed releases
    by itself (autoupdateseamless=0 only reports them, autoupdatetelemetry=0 leaves out those
    details, autoupdate=0 stops the checks).
  fr: >-
    btxd interroge aussi btx.dev toutes les 30 minutes pour les mises à jour, directement et sans
    passer par -proxy, et envoie sa version, sa plateforme, son architecture et son groupe de
    déploiement. Il installe seul les versions signées plus récentes (autoupdateseamless=0 les
    signale seulement, autoupdatetelemetry=0 omet ces détails, autoupdate=0 arrête les
    vérifications).
- en: >-
    If your address matters, run the node behind Tor (-proxy, -onlynet=onion; the Tor guide advises
    onlynet=onion only once Tor runs stably) or on a rented server instead. With -proxy, or an
    -onlynet without ipv4 and ipv6, btxd keeps port 29447 closed and skips the update checks unless
    you turn them on.
  fr: >-
    Si votre adresse compte, faites tourner le nœud derrière Tor (-proxy, -onlynet=onion ; le guide
    Tor conseille onlynet=onion seulement une fois Tor stable) ou plutôt sur un serveur loué. Avec
    -proxy, ou un -onlynet sans ipv4 ni ipv6, btxd garde le port 29447 fermé et ne cherche pas de
    mises à jour, sauf si vous les activez.
- en: >-
    On a machine with coins, mining or a signer key, set modelnet=0, natpmp=0 and swapnet=0, as the
    install checklist says.
  fr: >-
    Sur une machine avec des coins, du minage ou une clé de signataire, mettez modelnet=0,
    natpmp=0 et swapnet=0, comme le dit la liste d'installation.
- en: "Reachability"
  fr: "Joignabilité"
- en: >-
    Outbound connections work by default. To accept inbound ones, TCP port 19335 must be reachable:
    mapped by NAT-PMP, forwarded on the router by hand, or offered as a Tor onion service
    (-listenonion). With -proxy, the node only listens if you also set -listen=1. Port 29447 is only
    for the model network; modelnet=0 closes it.
  fr: >-
    Les connexions sortantes fonctionnent par défaut. Pour en accepter d'entrantes, le port TCP
    19335 doit être joignable : ouvert par NAT-PMP, redirigé à la main sur le routeur, ou proposé
    comme service onion Tor (-listenonion). Avec -proxy, le nœud n'écoute que si vous ajoutez
    -listen=1. Le port 29447 ne sert qu'au réseau de modèles ; modelnet=0 le ferme.
- en: >-
    A node that only connects out stays in sync and relays to the peers it connects to, but new
    nodes cannot reach it, so it does not help them sync.
  fr: >-
    Un nœud qui ne fait que se connecter vers l'extérieur reste synchronisé et relaie vers les pairs
    auxquels il se connecte, mais les nouveaux nœuds ne peuvent pas l'atteindre : il ne les aide
    donc pas à se synchroniser.
- en: >-
    To check: btx-cli getpeerinfo shows "inbound": true for peers that connected to you, and btx-cli
    getnetworkinfo lists your node's localaddresses.
  fr: >-
    Pour vérifier : btx-cli getpeerinfo affiche "inbound": true pour les pairs qui se sont connectés
    à vous, et btx-cli getnetworkinfo liste les localaddresses de votre nœud.
- en: "Full node: the install checklist on the start page"
  fr: "Nœud complet : la liste d'installation de la page d'accueil"
- en: "Running the node with Tor (developers)"
  fr: "Faire tourner le nœud avec Tor (développeurs)"
- en: "Full node"
  fr: "Nœud complet"
- en: >-
    Relays blocks and transactions and keeps the network reachable. With a qualified GPU it checks
    the MatMul work itself. Without one, run it as a trusted mirror or it stops syncing: btxd ships
    no signer keys, so pin at least two you trust and set matmultrustedthreshold=2 (default 1). On
    mainnet it will not start with fewer unless you explicitly override that.
  fr: >-
    Relaie blocs et transactions et garde le réseau joignable. Avec un GPU qualifié, il vérifie
    lui-même le travail MatMul. Sans GPU, faites-en un miroir de confiance, sinon il ne se
    synchronise plus : btxd n'inclut aucune clé de signataire, épinglez-en au moins deux de
    confiance et mettez matmultrustedthreshold=2 (1 par défaut). Sur le mainnet, il ne démarre pas
    avec moins, sauf si vous le forcez.
- en: >-
    An always-on computer or small server with an SSD and a steady connection. A GPU is optional.
  fr: >-
    Un ordinateur ou un petit serveur toujours allumé, avec un SSD et une connexion stable. Le GPU
    est facultatif.
- en: "Before you install a node release: the checklist on the start page"
  fr: "Avant d'installer une version du nœud : la liste de la page d'accueil"
- en: "Running a node: the steps on the start page"
  fr: "Faire tourner un nœud : les étapes de la page d'accueil"
- en: "Node help for stuck heights"
  fr: "Aide pour les nœuds bloqués à une hauteur"
- en: "How a trusted mirror works (developers)"
  fr: "Fonctionnement d'un miroir de confiance (développeurs)"
- en: "The node help first; for the rest, the community chats on the links page."
  fr: >-
    D'abord l'aide aux nœuds ; pour le reste, les chats de la communauté sur la page des liens.
- en: "Archive node and snapshot publisher"
  fr: "Nœud d'archive et éditeur de snapshots"
- en: >-
    An archive node keeps every block (prune=0) and serves the whole chain to its peers; the status
    page measures the chain from archive nodes. A snapshot publisher turns a node's data into a
    signed file that saves a new node most of the sync. A sync from genesis currently stops at block
    126,978 (#272), so new nodes start from a snapshot.
  fr: >-
    Un nœud d'archive garde chaque bloc (prune=0) et sert toute la chaîne à ses pairs ; la page
    d'état mesure la chaîne sur des nœuds d'archive. Un éditeur de snapshots fait des données d'un
    nœud un fichier signé qui épargne à un nouveau nœud l'essentiel de la synchronisation. Depuis la
    genèse, la synchronisation s'arrête au bloc 126 978 (#272) : les nouveaux nœuds partent d'un
    snapshot.
- en: >-
    A server with a large disk (the whole chain, never pruned, plus room for snapshot files) and an
    upload link that can serve them.
  fr: >-
    Un serveur avec un grand disque (toute la chaîne, jamais élaguée, plus de la place pour les
    fichiers de snapshot) et un débit montant capable de les servir.
- en: "Archival node runbook (developers)"
  fr: "Runbook des nœuds d'archive (développeurs)"
- en: >-
    Its opening note still calls Epoch A a release candidate; the developers' docs index says it has
    been live on mainnet since block 185,000.
  fr: >-
    Sa note d'ouverture appelle encore Epoch A une version candidate ; l'index de la documentation
    des développeurs dit qu'elle est active sur le mainnet depuis le bloc 185 000.
- en: "No community guide yet for publishing a signed snapshot."
  fr: "Pas encore de guide de la communauté pour publier un snapshot signé."
- en: "Signed snapshots in the link list"
  fr: "Snapshots signés dans la liste de liens"
- en: "The developers' UTXO snapshot recipe"
  fr: "La recette de snapshot UTXO des développeurs"
- en: "The I-OPS lane owner, whose lane covers archive mirrors and signed snapshots."
  fr: >-
    Le ou la responsable du chantier I-OPS, qui couvre les miroirs d'archive et les snapshots
    signés.
- en: "Attestation signer"
  fr: "Signataire d'attestations"
- en: >-
    Replays the MatMul work of new blocks on a qualified GPU (ExactReplay) and signs the result.
    Trusted mirrors that pinned its key follow those signatures; a node that checks blocks itself
    never uses them in place of its own check. The developers' docs call this role a GPU archive or
    attestor.
  fr: >-
    Rejoue sur un GPU qualifié le travail MatMul des nouveaux blocs (ExactReplay) et signe le
    résultat. Les miroirs de confiance qui ont épinglé sa clé suivent ces signatures ; un nœud qui
    vérifie lui-même les blocs ne les met jamais à la place de sa propre vérification. La
    documentation des développeurs appelle ce rôle archive GPU ou attestateur.
- en: >-
    A GPU that passes btxd's self-qualification in strict-device mode, the whole chain (prune=0),
    online around the clock. The runbook reports RTX 5090 and RTX PRO 6000 passing on CUDA 13.2 with
    cuBLASLt 13.4; other cards must pass the same self-test. One signing key per machine; never on a
    miner.
  fr: >-
    Un GPU qui réussit l'autoqualification de btxd en mode strict-device, toute la chaîne (prune=0),
    en ligne jour et nuit. Le runbook indique que les RTX 5090 et RTX PRO 6000 la réussissent avec
    CUDA 13.2 et cuBLASLt 13.4 ; les autres cartes doivent réussir le même autotest. Une clé de
    signature par machine ; jamais sur un mineur.
- en: "GPU operator runbook (developers)"
  fr: "Runbook des opérateurs GPU (développeurs)"
- en: >-
    Its status lines still call Epoch A a release candidate; the developers' docs index says it has
    been live on mainnet since block 185,000.
  fr: >-
    Ses lignes d'état appellent encore Epoch A une version candidate ; l'index de la documentation
    des développeurs dit qu'elle est active sur le mainnet depuis le bloc 185 000.
- en: "Signers and trusted mirrors (developers)"
  fr: "Signataires et miroirs de confiance (développeurs)"
- en: >-
    Questions about the runbook as an issue on btxchain/btx. No lane of this hub covers signers yet.
  fr: >-
    Les questions sur le runbook, en issue sur btxchain/btx. Aucun chantier de ce hub ne couvre
    encore les signataires.
- en: "Always-on fuzz box"
  fr: "Machine de fuzzing permanente"
- en: >-
    Runs BTX's more than 270 fuzz targets day and night and keeps every input that reaches new code,
    so it finds bugs that need hours of mutation. A short CI run starts from nothing every time.
  fr: >-
    Fait tourner jour et nuit les plus de 270 cibles de fuzzing de BTX et garde chaque entrée qui
    atteint du code nouveau ; elle trouve ainsi des bugs qui demandent des heures de mutation. Une
    courte exécution de CI repart de zéro à chaque fois.
- en: >-
    A dedicated Linux machine or VM (Ubuntu 24.04): many CPU threads, about 2 GB of RAM per fuzzing
    process, 80 GB of free disk, no GPU. Nothing else on it: no node, wallet, miner or keys.
  fr: >-
    Une machine Linux ou une VM dédiée (Ubuntu 24.04) : beaucoup de threads CPU, environ 2 Go de RAM
    par processus de fuzzing, 80 Go de disque libre, pas de GPU. Rien d'autre dessus : ni nœud, ni
    portefeuille, ni mineur, ni clés.
- en: "Running a continuous BTX fuzz box"
  fr: "Faire tourner une machine de fuzzing continu pour BTX"
- en: "The I-OPS lane owner, who keeps the fuzz-box guide."
  fr: "Le ou la responsable d'I-OPS, qui tient à jour le guide de la machine de fuzzing."
- en: "CI runner"
  fr: "Exécuteur de CI"
- en: >-
    Builds and tests the newest commit of a branch every night and publishes the result, so a break
    shows up within a day. The status page's operator publishes one such run as job CI-0; it is on
    the developers page.
  fr: >-
    Compile et teste chaque nuit le dernier commit d'une branche et publie le résultat, pour qu'une
    casse se voie en un jour. L'opérateur de la page d'état publie une telle exécution comme tâche
    CI-0 ; elle figure sur la page des développeurs.
- en: >-
    A dedicated Linux server with many threads and tens of GB of free disk. The CI-0 run of 15 Nov
    took about 70 minutes on 30 threads; a coverage build tree alone takes 27 GB.
  fr: >-
    Un serveur Linux dédié avec beaucoup de threads et quelques dizaines de Go de disque libre.
    L'exécution CI-0 du 15 nov. a pris environ 70 minutes sur 30 threads ; un arbre de compilation
    avec couverture occupe à lui seul 27 Go.
- en: >-
    Until then: the I-CI pack lists the jobs, the build-and-test page has the recipes, and
    ci/README.md in the btx tree runs a CI stage locally.
  fr: >-
    En attendant : le paquet I-CI liste les tâches, la page de compilation et de tests donne les
    recettes, et ci/README.md dans l'arborescence de btx lance une étape de CI en local.
- en: "I-CI pack: the fork CI jobs"
  fr: "Paquet I-CI : les tâches de CI sur le fork"
- en: "Build and test recipes"
  fr: "Recettes de compilation et de tests"
- en: "The CI scripts in the btx tree"
  fr: "Les scripts de CI dans l'arborescence de btx"
- en: >-
    The status page's operator, who runs the nightly CI-0. The I-CI lane has no owner yet: claim it
    in the lanes file.
  fr: >-
    L'opérateur de la page d'état, qui fait tourner le CI-0 nocturne. Le chantier I-CI n'a pas
    encore de responsable : prenez-le dans le fichier des chantiers.
- en: "Sanitizer runs"
  fr: "Exécutions avec sanitizers"
- en: >-
    Builds the node with AddressSanitizer and UndefinedBehaviorSanitizer, or with ThreadSanitizer,
    and runs the tests. Memory and threading bugs that pass silently in a normal build turn into
    reports.
  fr: >-
    Compile le nœud avec AddressSanitizer et UndefinedBehaviorSanitizer, ou avec ThreadSanitizer, et
    lance les tests. Les bugs de mémoire et de threads qui passent inaperçus dans une compilation
    normale deviennent des rapports.
- en: >-
    A Linux machine with clang (clang 20 or newer for ThreadSanitizer), plenty of RAM and threads.
    Runs are several times slower: functional tests get --timeout-factor=4.
  fr: >-
    Une machine Linux avec clang (clang 20 ou plus récent pour ThreadSanitizer), beaucoup de RAM et
    de threads. Les exécutions sont plusieurs fois plus lentes : les tests fonctionnels prennent
    --timeout-factor=4.
- en: "Build and test, section 6: Sanitizers"
  fr: "Compilation et tests, section 6 : sanitizers"
- en: >-
    The I-CI lane, which holds the ASan/UBSan and TSan jobs (CI-2, CI-3). It has no owner yet: until
    someone claims it, open an issue in this repository.
  fr: >-
    Le chantier I-CI, auquel appartiennent les tâches ASan/UBSan et TSan (CI-2, CI-3). Il n'a pas
    encore de responsable : tant que personne ne le prend, ouvrez une issue dans ce dépôt.
- en: "Guix rebuilder"
  fr: "Recompilation avec Guix"
- en: >-
    Rebuilds a release from its tagged source in a fixed Guix environment, so independent builders
    can compare hashes and nobody has to trust a single build machine. The v0.34.16 release notes
    say its Linux binaries need glibc 2.38 or newer, while these scripts build against glibc 2.31:
    they were not made with them, so today rebuilders can only compare with each other.
  fr: >-
    Recompile une version à partir de son code étiqueté dans un environnement Guix fixe : des
    personnes indépendantes comparent les hachages, nul ne dépend d'une seule machine. Selon les
    notes de v0.34.16, ses binaires Linux exigent glibc 2.38 ou plus, ces scripts compilent contre
    glibc 2.31 : ils n'en sont pas issus, et les recompilateurs ne se comparent qu'entre eux.
- en: >-
    A Linux machine with Guix: 16 GB free for the Guix store plus 8 GB per platform you build. More
    cores build faster.
  fr: >-
    Une machine Linux avec Guix : 16 Go libres pour le store Guix plus 8 Go par plateforme compilée.
    Plus de cœurs compilent plus vite.
- en: >-
    The scripts are in the btx tree (contrib/guix). Their README is Bitcoin Core's and points at
    Bitcoin Core's signature repository; this site knows of no BTX one yet.
  fr: >-
    Les scripts sont dans l'arborescence de btx (contrib/guix). Leur README est celui de Bitcoin
    Core et renvoie au dépôt de signatures de Bitcoin Core ; ce site n'en connaît pas encore pour
    BTX.
- en: "The Guix scripts in the btx tree"
  fr: "Les scripts Guix dans l'arborescence de btx"
- en: "No lane covers reproducible builds yet; open an issue in this repository."
  fr: >-
    Aucun chantier ne couvre encore les compilations reproductibles ; ouvrez une issue dans ce
    dépôt.
- en: "Miners and pools"
  fr: "Mineurs et pools"
