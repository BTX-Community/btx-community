# French translations of the content texts of btx-community.com (community.yaml, guide.yaml,
# hub.yaml and infra.yaml). Each entry pairs the English text exactly as it stands there with its translation;
# when the English text changes, the old pair no longer matches, the page shows English and the
# build prints a warning. Translated with AI help; corrections by native speakers are welcome.

schema_version: 1
translations:
- en: >-
    easyBTX says it holds no funds, is not a party to any trade and quotes no price. On 16 November
    2026 the board listed one seller. Contact a seller only through the link on easyBTX's own page.
    Anyone who messages you first is not that seller. A price agreed there is not a market price.
  fr: >-
    Selon easyBTX, il ne détient aucun fonds, n'est partie à aucun échange et n'indique aucun prix.
    Le 16 novembre 2026, le tableau comptait un vendeur. Contactez un vendeur uniquement par le lien
    de la page d'easyBTX elle-même. Quiconque vous écrit en premier n'est pas ce vendeur. Un prix
    convenu là n'est pas un prix de marché.
- en: Buying BTX
  fr: Acheter des BTX
- en: >-
    There is no exchange for BTX. These are trades from person to person without escrow: you pay
    first and rely on the seller. Not checked by us. Read the checklist "Before you buy or receive
    BTX" on the start page first, and start with a small amount.
  fr: >-
    Il n'existe pas de bourse pour les BTX. Ce sont des échanges de personne à personne sans
    séquestre : vous payez d'abord et vous comptez sur le vendeur. Non vérifié par nous. Lisez
    d'abord la liste « Avant d'acheter ou de recevoir des BTX » de la page d'accueil, et commencez
    par un petit montant.
- en: >-
    Sellers the easyBTX team says it has bought from itself. You agree amount and price with a
    seller on Telegram and pay them directly, usually in USDT.
  fr: >-
    Des vendeurs auprès desquels l'équipe easyBTX dit avoir acheté elle-même. Vous convenez du
    montant et du prix avec un vendeur sur Telegram et vous le payez directement, en général en
    USDT.
- en: >-
    Verification gate to the main BTX chat on compute and tech. Not run by the community; for
    community questions use the group above.
  fr: >-
    Sas de vérification vers le chat principal de BTX sur le calcul et la technique. Non géré par la
    communauté ; pour les questions de la communauté, utilisez le groupe ci-dessus.
- en: A general mining chat rather than a BTX group; the list keeps to BTX channels.
  fr: Un chat de minage généraliste, pas un groupe BTX ; la liste s'en tient aux canaux BTX.
- en: Ask questions in the community group on Telegram.
  fr: Poser des questions dans le groupe de la communauté sur Telegram.
- en: Hardly any activity any more; the community talks on Telegram.
  fr: Presque plus d'activité ; la communauté discute sur Telegram.
- en: No activity, and the miner has not changed since August 2026.
  fr: Aucune activité, et le mineur n'a pas changé depuis août 2026.
- en: The main community group on Telegram, open to everyone.
  fr: Le groupe principal de la communauté sur Telegram, ouvert à tous.
- en: >-
    The archives were replaced several times under the same tag, last on 15 November 2026. The
    current ones bundle libevent, SQLite, ZeroMQ and libgomp; only libc, libstdc++ and the NVIDIA
    driver come from your system. Check your download against the release's SHA256SUMS.
  fr: >-
    Les archives ont été remplacées plusieurs fois sous la même étiquette, la dernière le 15
    novembre 2026. Les actuelles incluent libevent, SQLite, ZeroMQ et libgomp ; seuls libc,
    libstdc++ et le pilote NVIDIA viennent de votre système. Vérifiez votre téléchargement avec le
    SHA256SUMS de la version.
- en: Live census of BTX nodes and signer witness of the easyBTX team.
  fr: >-
    Recensement en direct des nœuds BTX et témoin des signataires de l'équipe easyBTX.
- en: >-
    The roles a node advertises are its own claim; the page marks separately which nodes answered a
    real request ("serve-verified").
  fr: >-
    Les rôles qu'un nœud annonce sont sa propre déclaration ; la page indique à part quels nœuds ont
    répondu à une vraie requête (« serve-verified »).
- en: >-
    The wallet in the official releases: btxd with btx-cli, open source, on your own node. The
    desktop app btx-qt is in v0.34.15; the v0.34.16 archives leave it out.
  fr: >-
    Le portefeuille des versions officielles : btxd avec btx-cli, open source, sur votre propre
    nœud. L'application de bureau btx-qt est dans la v0.34.15 ; les archives de la v0.34.16
    l'omettent.
- en: 'Live view from the Byron Bay archive node: its chain progress, the heights of the nodes connected
    to it, and a map of those connections (preview).'
  fr: 'Vue en direct depuis le nœud d''archive de Byron Bay : la progression de sa chaîne, les hauteurs
    des nœuds qui y sont connectés et une carte de ces connexions (aperçu).'
- en: 'The upstream Atlas desktop interface (btxchain/btx #273), hosted by the Byron Bay team as a demo.'
  fr: 'L''interface de bureau Atlas de l''amont (btxchain/btx #273), hébergée en démo par l''équipe de
    Byron Bay.'
- en: 'A walk-through of SwapNet (btxchain/btx #630), built by the Byron Bay team from the open-source
    code.'
  fr: 'Une visite de SwapNet (btxchain/btx #630), réalisée par l''équipe de Byron Bay à partir du code
    open source.'
- en: >-
    Unofficial demo with sample data only. Atlas is in the v0.34.16 source, but the release archives
    leave it out; the page connects to no node or wallet.
  fr: >-
    Démo non officielle, uniquement avec des données d'exemple. Atlas est dans le code source de
    v0.34.16, mais les archives de la version le laissent de côté ; la page ne se connecte à aucun
    nœud ni portefeuille.
- en: Describes MatMul v4.7, which the network runs since block 185,000, and keeps v3 as reference. Last
    updated 4 Aug 2026; its release notes still name v0.33.2.
  fr: Décrit MatMul v4.7, utilisé par le réseau depuis le bloc 185 000, et garde v3 comme référence. Dernière
    mise à jour le 4 août 2026 ; ses notes de version citent encore v0.33.2.
- en: Explorer of the Byron Bay team, with a 24 h mining view, stats pages, a public API and tools for
    AI assistants (MCP, REST, llms.txt) at /ai.
  fr: Explorateur de l'équipe de Byron Bay, avec une vue du minage sur 24 h, des pages de statistiques,
    une API publique et des outils pour assistants IA (MCP, REST, llms.txt) sous /ai.
- en: 13 of the 16 AI tools are public with no key; 3 premium ones need a token from the operator.
  fr: 13 des 16 outils IA sont publics et sans clé ; 3 outils premium demandent un jeton de l'opérateur.
- en: >-
    UTXO snapshot for loadtxoutset, confirmed by two operators, with SHA-256 of the file and the
    manifest.
  fr: >-
    Snapshot UTXO pour loadtxoutset, confirmé par deux opérateurs, avec le SHA-256 du fichier et du
    manifeste.
- en: Check the SHA-256 before use. The JSON names the height; it can lag the chain by a few thousand
    blocks.
  fr: Vérifiez le SHA-256 avant usage. Le JSON indique la hauteur ; elle peut avoir quelques milliers
    de blocs de retard sur la chaîne.
- en: UTXO snapshot every 1,000 blocks from the Byron Bay archive node, with SHA256SUMS; the last seven
    are kept.
  fr: Snapshot UTXO tous les 1 000 blocs depuis le nœud d'archive de Byron Bay, avec SHA256SUMS ; les
    sept derniers sont conservés.
- en: One signer, the operator. A height is sometimes skipped; then there is no file, not a wrong one.
  fr: Un seul signataire, l'opérateur. Une hauteur est parfois sautée ; il n'y a alors pas de fichier,
    pas un fichier faux.
- en: Post-quantum desktop wallet of the easyBTX team for macOS, Windows and Linux.
  fr: Portefeuille de bureau post-quantique de l'équipe easyBTX pour macOS, Windows et Linux.
- en: No independent audit; the source code is not public. The Mac build is signed and notarized (Bonuz
    Technology DMCC); Windows and Linux builds are unsigned, so check the SHA-256. Keep the master key
    or the encrypted recovery file offline.
  fr: Pas d'audit indépendant ; le code source n'est pas public. La version Mac est signée et notarisée
    (Bonuz Technology DMCC) ; celles pour Windows et Linux ne sont pas signées, vérifiez donc le SHA-256.
    Gardez la clé maître ou le fichier de récupération chiffré hors ligne.
- en: 'Seedless means there is no seed phrase you back up yourself: the page says the key is split by
    MPC, and access and recovery go through the Bonuz login. Check how recovery works before you rely
    on it.'
  fr: 'Sans seed signifie qu''il n''y a pas de phrase de récupération à sauvegarder soi-même : la page
    indique que la clé est partagée par MPC, et l''accès comme la récupération passent par la connexion
    Bonuz. Vérifiez comment fonctionne la récupération avant de vous y fier.'
- en: >-
    A full release since 15 November 2026, first published on 7 November as a pre-release. Archives
    for Linux x86_64, with and without CUDA 13; none for macOS or Windows. It packages the 0.35
    review branches; the 0.35 line stays open.
  fr: >-
    Version complète depuis le 15 novembre 2026, publiée d'abord le 7 novembre comme préversion.
    Archives pour Linux x86_64, avec et sans CUDA 13 ; aucune pour macOS ni Windows. Elle regroupe
    les branches de revue de 0.35 ; la ligne 0.35 reste ouverte.
- en: Cross-chain swaps, off by default
  fr: Échanges entre chaînes, désactivés par défaut
- en: >-
    SwapNet is built into btxd and starts only with -swapnet=1. Its keys for the other chains sit in
    the data directory: back them up with exportswaprecovery, not by copying files. Turning it off
    does not cancel a funded swap; refund deadlines keep running.
  fr: >-
    SwapNet est intégré à btxd et ne démarre qu'avec -swapnet=1. Ses clés pour les autres chaînes se
    trouvent dans le répertoire de données : sauvegardez-les avec exportswaprecovery, pas en copiant
    les fichiers. Le désactiver n'annule pas un échange financé ; les délais de remboursement
    continuent de courir.
- en: Signing keeps your timelocks
  fr: La signature ne modifie plus les verrous temporels
- en: >-
    For a csv, cltv or refund leaf, v0.34.15 rewrote nLockTime, nSequence and version while signing.
    signrawtransactionwithwallet and walletprocesspsbt now refuse and name the value they need,
    unless adjust_timelocks is true.
  fr: >-
    Pour une feuille csv, cltv ou de remboursement, v0.34.15 réécrivait nLockTime, nSequence et la
    version lors de la signature. signrawtransactionwithwallet et walletprocesspsbt refusent
    désormais et indiquent la valeur requise, sauf avec adjust_timelocks=true.
- en: >-
    No macOS or Windows archive: a Mac node stays on v0.34.15. The CUDA archive is built for NVIDIA
    Blackwell (sm_120) and does not include the NVIDIA driver.
  fr: >-
    Pas d'archive pour macOS ni Windows : un nœud sur Mac reste en v0.34.15. L'archive CUDA est
    compilée pour NVIDIA Blackwell (sm_120) et n'inclut pas le pilote NVIDIA.
- en: >-
    No desktop app: both archives leave out btx-qt and btx-atlas, which need a newer glibc than
    2.38. Use btxd and btx-cli.
  fr: >-
    Pas d'application de bureau : les deux archives omettent btx-qt et btx-atlas, qui demanderaient
    une glibc plus récente que 2.38. Utilisez btxd et btx-cli.
- en: >-
    Recent releases have no signed checksum file: the last SHA256SUMS.asc was for v0.34.6, and
    v0.34.16 has an unsigned SHA256SUMS. Compare the SHA-256 that GitHub shows for each file with
    "shasum -a 256 <file>" ("sha256sum" on Linux).
  fr: >-
    Les versions récentes n'ont pas de fichier de sommes de contrôle signé : le dernier
    SHA256SUMS.asc concernait la v0.34.6, et la v0.34.16 a un SHA256SUMS non signé. Comparez le
    SHA-256 que GitHub affiche pour chaque fichier avec « shasum -a 256 <fichier> » (« sha256sum »
    sous Linux).
- en: >-
    Linux binaries need glibc 2.38 or newer (Ubuntu 24.04, Debian 13). v0.34.16 has archives for
    Linux and Linux with CUDA; for Apple Silicon Macs the newest is v0.34.15. There is no official
    Windows build.
  fr: >-
    Les binaires Linux nécessitent glibc 2.38 ou plus récent (Ubuntu 24.04, Debian 13). La v0.34.16
    a des archives pour Linux et Linux avec CUDA ; pour les Mac Apple Silicon, la plus récente est
    la v0.34.15. Il n'existe pas de version officielle pour Windows.
- en: >-
    Release candidates (rc) are for testing. A node that holds coins, mines or signs belongs on the
    newest full release.
  fr: >-
    Les versions candidates (rc) servent aux tests. Un nœud qui détient des coins, mine ou signe
    doit tourner sur la dernière version complète.
- en: Build result
  fr: Résultat de la compilation
- en: >-
    The fork CI workflow (it ran on the release line on 12 Nov at 4c7840e9 and on 13 Nov at
    88c9b49c, red both times; keep the upstream Atlas workflows): jobs CI-0 to CI-10, the
    known-failing list, and a nightly job for the 41 stage3 suites that time out.
  fr: >-
    Le workflow de CI du fork (il a tourné sur la branche de version le 12 nov. sur 4c7840e9 et le
    13 nov. sur 88c9b49c, en échec les deux fois ; garder les workflows Atlas de l'amont) : jobs
    CI-0 à CI-10, la liste des échecs connus et un job nocturne pour les 41 suites stage3 qui
    expirent.
- en: >-
    The results of the last nightly build and test runs that the status page's operator publishes as
    job CI-0, read live from its API: one run on Linux for each branch it builds, the newest release
    first. They are not the fork build matrix listed under Gates. The unit runs leave out the slow
    matmul_v4_rc_stage3_* suites.
  fr: >-
    Les résultats des dernières exécutions nocturnes de compilation et de tests que l'opérateur de
    la page d'état publie comme job CI-0, lus en direct dans son API : une exécution sous Linux par
    branche compilée, la version la plus récente en premier. Ce n'est pas la matrice de compilation
    du fork listée sous Contrôles. Les tests unitaires laissent de côté les suites lentes
    matmul_v4_rc_stage3_*.
- en: "This panel is filled in by JavaScript. The runs as raw data: "
  fr: "Ce panneau est rempli par JavaScript. Les exécutions en données brutes : "
