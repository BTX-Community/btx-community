# French translations of the content texts of btx-community.com (community.yaml, guide.yaml and
# hub.yaml). Each entry pairs the English text exactly as it stands there with its translation;
# when the English text changes, the old pair no longer matches, the page shows English and the
# build prints a warning. Translated with AI help; corrections by native speakers are welcome.

schema_version: 1
translations:
- en: >-
    A .btxwallet file holds the post-quantum seed in plain text. Treat it like a private key and
    delete temporary copies.
  fr: >-
    Un fichier .btxwallet contient la phrase de récupération post-quantique en clair. Traitez-le
    comme une clé privée et supprimez les copies temporaires.
- en: >-
    A default build has no GPU support and cannot check MatMul blocks itself: add CUDA, or run it as
    a trusted mirror. On Ubuntu 22.04 or 24.04 add -DWITH_MODELNET=OFF, unless you install OpenSSL
    3.5 or newer.
  fr: >-
    Un build par défaut n'a pas de prise en charge GPU et ne peut pas vérifier lui-même les blocs
    MatMul : ajoutez CUDA, ou faites-le tourner comme miroir de confiance. Sous Ubuntu 22.04 ou
    24.04, ajoutez -DWITH_MODELNET=OFF, sauf si vous installez OpenSSL 3.5 ou plus récent.
- en: >-
    Back up the whole wallet with backupwalletbundlearchive (one passphrase-encrypted file; see
    doc/managing-wallets.md), not only the seed. A .btxwallet export holds the seed in plain text.
  fr: >-
    Sauvegardez le portefeuille entier avec backupwalletbundlearchive (un seul fichier chiffré avec
    une phrase secrète ; voir doc/managing-wallets.md), pas seulement la phrase de récupération. Un
    export .btxwallet contient la phrase de récupération en clair.
- en: >-
    Block explorer of the easyBTX team for blocks, transactions and addresses, with a public API
    (api.btxscan.io).
  fr: >-
    Explorateur de blocs de l'équipe easyBTX, pour les blocs, les transactions et les adresses, avec
    une API publique (api.btxscan.io).
- en: Block explorer run by the ninjaraider pool, with a JSON API for addresses and blocks.
  fr: >-
    Explorateur de blocs exploité par le pool ninjaraider, avec une API JSON pour les adresses et
    les blocs.
- en: >-
    Catch up in minutes with a daily signed snapshot. A sync from genesis currently stops at block
    126,978 (issue #272).
  fr: >-
    Rattrapez la chaîne en quelques minutes avec un instantané quotidien signé. Une synchronisation
    depuis la genèse s'arrête actuellement au bloc 126 978 (issue #272).
- en: Closed source (stated in its README). 2% dev fee on BTX.
  fr: Code source fermé (indiqué dans son README). 2 % de frais de développement sur BTX.
- en: >-
    Closed source; the builds are unsigned, so check the SHA-256 on the release page. It starts on
    BTX Pool by default. A 5% dev fee was listed for it in August 2026; check the current fee in the
    app.
  fr: >-
    Code source fermé ; les builds ne sont pas signés, vérifiez donc le SHA-256 sur la page de la
    version. Elle démarre par défaut sur BTX Pool. Des frais de développement de 5 % étaient
    indiqués pour elle en août 2026 ; vérifiez les frais actuels dans l'appli.
- en: Community Discord, open to everyone, including mining help.
  fr: Discord de la communauté, ouvert à tous, avec aide au minage.
- en: Community status page - is the network healthy, with history, node help and a public JSON API.
  fr: >-
    Page d'état de la communauté : le réseau est-il en bonne santé, avec historique, aide aux nœuds
    et une API JSON publique.
- en: >-
    Community-run account on X, not the developers'. It posted release notes and network news in
    August and September 2026.
  fr: >-
    Compte sur X tenu par la communauté, pas celui des développeurs. Il a publié des notes de
    version et des nouvelles du réseau en août et septembre 2026.
- en: >-
    Daily pruned datadir snapshot, checked and signed by a second node. Built on a trusted mirror,
    so the MatMul work was accepted on signers' attestations.
  fr: >-
    Instantané quotidien d'un répertoire de données élagué, vérifié et signé par un second nœud.
    Produit sur un miroir de confiance : le travail MatMul a donc été accepté sur la base des
    attestations des signataires.
- en: >-
    Early test build: internal security review, no independent audit; the source code is not public
    and the direct downloads are unsigned. A 64-character master key is the only backup; keep it
    offline.
  fr: >-
    Version de test préliminaire : revue de sécurité interne, pas d'audit indépendant ; le code
    source n'est pas public et les téléchargements directs ne sont pas signés. Une clé maîtresse de
    64 caractères est la seule sauvegarde ; gardez-la hors ligne.
- en: >-
    Every node relays blocks and keeps the network reachable. A node checks every block itself only
    with a GPU that passes btxd's self-test. Without one, run it as a trusted mirror that follows
    signed checks from at least two signers; otherwise it stops syncing. Signers have the highest
    requirements.
  fr: >-
    Chaque nœud relaie les blocs et garde le réseau joignable. Un nœud ne vérifie lui-même chaque
    bloc qu'avec un GPU qui réussit l'autotest de btxd. Sans un tel GPU, faites-le tourner comme
    miroir de confiance qui suit les vérifications signées d'au moins deux signataires ; sinon il
    cesse de se synchroniser. Les signataires ont les exigences les plus élevées.
- en: Explorer of the Byron Bay team, with a 24 h mining view, stats pages and a public API.
  fr: >-
    Explorateur de l'équipe de Byron Bay, avec une vue du minage sur 24 h, des pages de statistiques
    et une API publique.
- en: How to report a vulnerability privately to the BTX Development Team. Not for support questions.
  fr: >-
    Comment signaler une vulnérabilité en privé à l'équipe de développement de BTX. Pas pour les
    questions d'assistance.
- en: >-
    Its backup file (.btxwallet) holds the seed in plain text. Keep it offline and never send it to
    anyone.
  fr: >-
    Son fichier de sauvegarde (.btxwallet) contient la phrase de récupération en clair. Gardez-le
    hors ligne et ne l'envoyez jamais à personne.
- en: >-
    Last change 2026-08-21. The quick start in its README contains a sample payout address and two
    offline pools (minebtx, Byron); replace all three. 1% dev fee in pool mode; it updates itself
    unless started with --no-auto-update. NVIDIA Ampere (RTX 30 series) or newer only.
  fr: >-
    Dernière modification le 2026-08-21. Le démarrage rapide de son README contient une adresse de
    paiement d'exemple et deux pools hors ligne (minebtx, Byron) ; remplacez-les tous les trois. 1 %
    de frais de développement en mode pool ; il se met à jour lui-même sauf s'il est lancé avec
    --no-auto-update. NVIDIA Ampere (série RTX 30) ou plus récent uniquement.
- en: Last updated for v0.33.2 (August 2026); newer releases are on the GitHub releases page.
  fr: >-
    Dernière mise à jour pour la v0.33.2 (août 2026) ; les versions plus récentes sont sur la page
    des versions de GitHub.
- en: >-
    MIT-licensed; this repository holds only the downloads and release notes. Compare the SHA-256
    listed with each release.
  fr: >-
    Sous licence MIT ; ce dépôt ne contient que les téléchargements et les notes de version.
    Comparez le SHA-256 indiqué pour chaque version.
- en: >-
    Mac app (Apple Silicon, macOS 13 or later) of the easyBTX team that fetches open AI models over
    the BTX model network and runs them on your Mac. It only downloads; it never serves, pays or
    earns.
  fr: >-
    Appli Mac (Apple Silicon, macOS 13 ou plus récent) de l'équipe easyBTX qui récupère des modèles
    d'IA ouverts via le réseau de modèles BTX et les exécute sur votre Mac. Elle ne fait que
    télécharger ; elle ne distribue, ne paie et ne gagne jamais rien.
- en: Miners log in as ADDRESS.worker; nekominer documents this and charges no dev fee on this pool.
  fr: >-
    Les mineurs se connectent avec l'identifiant ADRESSE.worker ; nekominer le documente et ne prend
    pas de frais de développement sur ce pool.
- en: >-
    Mining needs a qualified GPU and a node that checks blocks itself (matmulvalidation=consensus,
    the default), not a trusted mirror. See the GPU operator runbook.
  fr: >-
    Le minage exige un GPU qualifié et un nœud qui vérifie lui-même les blocs
    (matmulvalidation=consensus, la valeur par défaut), pas un miroir de confiance. Voir le guide
    d'exploitation GPU.
- en: >-
    Multi-coin GPU miner with BTX support (MatMul v4.7 since version 1.6.0); its BTX example uses
    BTX Pool. BTX mines on NVIDIA cards only.
  fr: >-
    Logiciel de minage GPU multi-cryptomonnaies compatible BTX (MatMul v4.7 depuis la version 1.6.0)
    ; son exemple BTX utilise BTX Pool. BTX ne se mine que sur des cartes NVIDIA.
- en: >-
    NVIDIA (CUDA) miner for several coins; BTX runs as algorithm btxv4, the proof-of-work since
    block 185,000. Its README has commands for ninjaraider and BTX Pool.
  fr: >-
    Logiciel de minage NVIDIA (CUDA) pour plusieurs cryptomonnaies ; BTX tourne sous l'algorithme
    btxv4, la preuve de travail en vigueur depuis le bloc 185 000. Son README contient des commandes
    pour ninjaraider et BTX Pool.
- en: No change to the miner since 2026-08-21.
  fr: Aucune modification du logiciel de minage depuis le 2026-08-21.
- en: Not launched. Its launch checklist is still open and the reference contracts are unaudited.
  fr: >-
    Non lancé. Sa liste de contrôle de lancement est encore ouverte et les contrats de référence ne
    sont pas audités.
- en: >-
    Official explanation of why a node needs a qualified GPU to check blocks itself since block
    185,000, and what machines without one can do.
  fr: >-
    Explication officielle : pourquoi un nœud a besoin d'un GPU qualifié pour vérifier lui-même les
    blocs depuis le bloc 185 000, et ce que peuvent faire les machines qui n'en ont pas.
- en: >-
    Official guide to moving a btx.dev browser wallet into btxd and back, and how that file differs
    from an encrypted node backup.
  fr: >-
    Guide officiel : transférer un portefeuille de navigateur btx.dev vers btxd et inversement, et
    en quoi ce fichier diffère d'une sauvegarde chiffrée du nœud.
- en: >-
    Official guide to wallet roles, multisig, timelocked recovery, watch-only setups and encrypted
    backups, with a restore drill.
  fr: >-
    Guide officiel des rôles de portefeuille, de la multisignature, de la récupération avec verrou
    temporel, des configurations en lecture seule et des sauvegardes chiffrées, avec un exercice de
    restauration.
- en: >-
    Official integration profile for exchanges and custodians: UTXO model, watch-only setup,
    deposits, confirmations and reorg handling.
  fr: >-
    Profil d'intégration officiel pour les plateformes d'échange et les dépositaires : modèle UTXO,
    configuration en lecture seule, dépôts, confirmations et gestion des réorganisations.
- en: >-
    Official scripts for solo mining against your own btxd: a health-aware mining loop, start and
    stop scripts and a wallet backup. For larger setups the README points to getblocktemplate with
    external miners.
  fr: >-
    Scripts officiels pour miner en solo contre votre propre btxd : une boucle de minage qui tient
    compte de l'état de santé, des scripts de démarrage et d'arrêt et une sauvegarde du
    portefeuille. Pour des installations plus grandes, le README renvoie à getblocktemplate avec des
    logiciels de minage externes.
- en: Official step-by-step guide to building btxd and btx-cli on Windows 11.
  fr: Guide officiel pas à pas pour compiler btxd et btx-cli sous Windows 11.
- en: Official website with documentation, the browser wallet and the whitepaper.
  fr: Site officiel avec la documentation, le portefeuille dans le navigateur et le livre blanc.
- en: >-
    On a server - the official release for Linux needs glibc 2.38 or newer (Ubuntu 24.04, Debian
    13); a GPU node takes the -cuda13 archive (Blackwell cards). The v0.34.16 pre-release has no
    CUDA build, so GPU nodes stay on v0.34.15. The current release has no official Windows archive.
  fr: >-
    Sur un serveur : la version officielle pour Linux exige glibc 2.38 ou plus récent (Ubuntu 24.04,
    Debian 13) ; un nœud GPU prend l'archive -cuda13 (cartes Blackwell). La préversion v0.34.16 n'a
    pas de build CUDA, les nœuds GPU restent donc sur la v0.34.15. La version actuelle n'a pas
    d'archive Windows officielle.
- en: >-
    On mainnet it needs at least two pinned signers and a threshold of two. Pin only signers that
    are live today.
  fr: >-
    Sur le réseau principal, il lui faut au moins deux signataires épinglés et un seuil de deux.
    N'épinglez que des signataires actifs aujourd'hui.
- en: >-
    One-click miner app with a self-custodial wallet built in, for Apple Silicon Macs and Linux (on
    Windows through WSL).
  fr: >-
    Appli de minage en un clic avec un portefeuille non dépositaire intégré, pour les Mac Apple
    Silicon et Linux (sous Windows via WSL).
- en: >-
    Open-source (MIT) desktop app of the easyBTX team that installs and supervises btxd on the
    machine you already own.
  fr: >-
    Application de bureau open source (MIT) de l'équipe easyBTX qui installe et supervise btxd sur
    la machine que vous avez déjà.
- en: >-
    Paused by its operator since September 2026; no blocks among the last 1,000 (2026-11-12). The
    first light explorer of the same team stays listed.
  fr: >-
    Mis en pause par son exploitant depuis septembre 2026 ; aucun bloc parmi les 1 000 derniers
    (2026-11-12). L'explorateur first light de la même équipe reste dans la liste.
- en: >-
    Pick a miner from our link list - for example easyBTX (an app for Mac and Linux; on Windows
    through WSL) or matador (open source).
  fr: >-
    Choisir un logiciel de minage dans notre liste de liens, par exemple easyBTX (une appli pour Mac
    et Linux ; sous Windows via WSL) ou matador (open source).
- en: >-
    Pool dedicated to BTX, run by the author of btx-pool-miner (GitHub lucasan123). It pays miners
    inside each block it finds, split by work over a 30-minute window. Check its fee on the pool
    page.
  fr: >-
    Pool dédié à BTX, exploité par l'auteur de btx-pool-miner (GitHub lucasan123). Il paie les
    mineurs directement dans chaque bloc qu'il trouve, au prorata du travail sur une fenêtre de 30
    minutes. Vérifiez ses frais sur la page du pool.
- en: Post-quantum desktop wallet of the easyBTX team for macOS and Windows.
  fr: Portefeuille de bureau post-quantique de l'équipe easyBTX pour macOS et Windows.
- en: >-
    Problems with an NVIDIA card? The official CUDA troubleshooting guide helps; parts of it
    describe the CUDA path from before block 185,000.
  fr: >-
    Un problème avec une carte NVIDIA ? Le guide officiel de dépannage CUDA aide ; certaines de ses
    parties décrivent le chemin CUDA d'avant le bloc 185 000.
- en: >-
    Public tester site and guide of the wbtx-eth project (evxdev): a WBTX bridge on an Ethereum
    testnet. Test tokens have no value.
  fr: >-
    Site public pour testeurs et guide du projet wbtx-eth (evxdev) : un pont WBTX sur un réseau de
    test Ethereum. Les jetons de test n'ont aucune valeur.
- en: >-
    Read the official introduction and documentation. It was written for v0.33.2; newer releases
    differ in places.
  fr: >-
    Lire l'introduction et la documentation officielles. Elles ont été rédigées pour la v0.33.2 ;
    les versions plus récentes diffèrent par endroits.
- en: Run by the vendor of those apps.
  fr: Géré par l'éditeur de ces applis.
- en: >-
    Runs v0.34.15 without the model network. Without a qualified GPU the node follows signers'
    checks instead of checking the MatMul work itself.
  fr: >-
    Fonctionne avec la v0.34.15 sans le réseau de modèles. Sans GPU qualifié, le nœud suit les
    vérifications des signataires au lieu de vérifier lui-même le travail MatMul.
- en: >-
    Seedless means there is no seed phrase you back up yourself; access and recovery go through the
    Bonuz login. Check how recovery works before you rely on it.
  fr: >-
    « Sans phrase de récupération » veut dire qu'il n'y a pas de phrase de récupération à
    sauvegarder vous-même ; l'accès et la récupération passent par la connexion Bonuz. Vérifiez
    comment fonctionne la récupération avant de vous y fier.
- en: Seedless mobile wallet for iOS and Android with BTX support.
  fr: Portefeuille mobile sans phrase de récupération pour iOS et Android, compatible BTX.
- en: >-
    Signers (GPU attestors) need a GPU that passes btxd's self-test and must stay online. The
    official CUDA archive covers Blackwell cards (sm_120); other NVIDIA cards need a build from
    source and may not qualify. Follow the developers' operator runbook.
  fr: >-
    Les signataires (attestateurs GPU) ont besoin d'un GPU qui réussit l'autotest de btxd et doivent
    rester en ligne. L'archive CUDA officielle couvre les cartes Blackwell (sm_120) ; les autres
    cartes NVIDIA exigent une compilation depuis les sources et peuvent ne pas être qualifiées.
    Suivez le guide d'exploitation des développeurs.
- en: Some API endpoints need an access token.
  fr: Certains points de terminaison de l'API exigent un jeton d'accès.
- en: Telegram group of the easyBTX team, for questions about its miner, node app and wallet.
  fr: >-
    Groupe Telegram de l'équipe easyBTX, pour les questions sur son logiciel de minage, son appli de
    nœud et son portefeuille.
- en: Testnet only; it can be reset. Code unchanged since 2026-07-09.
  fr: Réseau de test uniquement ; il peut être réinitialisé. Code inchangé depuis le 2026-07-09.
- en: >-
    The current release has no official Windows archive. The handbook starts without CUDA, and such
    a build cannot check MatMul blocks itself: run it as a trusted mirror.
  fr: >-
    La version actuelle n'a pas d'archive Windows officielle. Le manuel commence sans CUDA, et un
    tel build ne peut pas vérifier lui-même les blocs MatMul : faites-le tourner comme miroir de
    confiance.
- en: >-
    The developers' design for wrapped BTX on EVM chains: token rules, bridge models and reference
    contracts. A design, not a working bridge.
  fr: >-
    La conception des développeurs pour du BTX encapsulé sur les chaînes EVM : règles du jeton,
    modèles de pont et contrats de référence. Une conception, pas un pont fonctionnel.
- en: >-
    The file is marked historical: it records the v3 design. Since block 185,000 the network runs
    MatMul v4.7.
  fr: >-
    Le fichier est marqué comme historique : il documente la conception v3. Depuis le bloc 185 000,
    le réseau tourne avec MatMul v4.7.
- en: >-
    The miner's source is not published: the repository holds scripts and binary releases, with no
    licence. 2% dev fee, 0% on ninjaraider.
  fr: >-
    Le code source du logiciel de minage n'est pas publié : le dépôt contient des scripts et des
    versions binaires, sans licence. 2 % de frais de développement, 0 % sur ninjaraider.
- en: >-
    The same WBTX test bridge as btx.supply, on the Robinhood Chain testnet. Test tokens have no
    value.
  fr: >-
    Le même pont de test WBTX que btx.supply, sur le réseau de test de Robinhood Chain. Les jetons
    de test n'ont aucune valeur.
- en: >-
    The wallet in the official releases for Linux and macOS: the desktop app btx-qt, or btxd with
    btx-cli. Open source; it runs on your own node.
  fr: >-
    Le portefeuille des versions officielles pour Linux et macOS : l'application de bureau btx-qt,
    ou btxd avec btx-cli. Open source ; il fonctionne sur votre propre nœud.
- en: Verification gate; clearing it lets you into the main BTX Telegram groups.
  fr: Sas de vérification ; le franchir donne accès aux principaux groupes Telegram de BTX.
- en: Verify the signature and SHA-256 before use. Not for signers.
  fr: Vérifiez la signature et le SHA-256 avant usage. Pas pour les signataires.
- en: >-
    Wrapped BTX on Ethereum - contracts, validator services and a local simulator, by the GitHub
    organisation evxdev. Testnet only.
  fr: >-
    BTX encapsulé sur Ethereum : contrats, services de validateur et un simulateur local, par
    l'organisation GitHub evxdev. Réseau de test uniquement.
- en: >-
    matador's quick start contains a sample payout address that is not yours and two pools that are
    offline. Always put in your own btx1z address and a pool from our link list.
  fr: >-
    Le démarrage rapide de matador contient une adresse de paiement d'exemple qui n'est pas la vôtre
    et deux pools hors ligne. Indiquez toujours votre propre adresse btx1z et un pool de notre liste
    de liens.
- en: Fixed supply
  fr: Offre fixe
- en: >-
    At most 21 million BTX, as with Bitcoin. A block comes about every 90 seconds; its reward of 20
    BTX halves every 525,000 blocks, roughly every 18 months.
  fr: >-
    Au maximum 21 millions de BTX, comme pour Bitcoin. Un bloc arrive environ toutes les 90 secondes
    ; sa récompense de 20 BTX est divisée par deux tous les 525 000 blocs, soit environ tous les 18
    mois.
- en: Mining by matrix multiplication
  fr: Minage par multiplication de matrices
- en: Post-quantum signatures
  fr: Signatures post-quantiques
- en: >-
    Coins are locked with signatures meant to withstand quantum computers: ML-DSA-44 (NIST FIPS 204)
    for everyday spending, SLH-DSA (FIPS 205) as a hash-based fallback. These P2MR addresses start
    with btx1z.
  fr: >-
    Les coins sont verrouillés par des signatures conçues pour résister aux ordinateurs quantiques
    : ML-DSA-44 (NIST FIPS 204) pour les dépenses courantes, SLH-DSA (FIPS 205) comme solution de
    repli à base de hachage. Ces adresses P2MR commencent par btx1z.
- en: Built on Bitcoin Knots
  fr: Bâti sur Bitcoin Knots
- en: Presigned swap claims from the wallet
  fr: Réclamations de swap présignées depuis le portefeuille
- en: Before you buy or receive BTX
  fr: Avant d'acheter ou de recevoir des BTX
- en: >-
    Check the receiving address in full, not just its start and end. BTX addresses start with btx1z.
  fr: >-
    Vérifiez l'adresse de réception en entier, pas seulement son début et sa fin. Les adresses BTX
    commencent par btx1z.
- en: >-
    Before you use an exchange or an OTC seller, check that withdrawals really work. A price on a
    website is not a market you can sell into.
  fr: >-
    Avant d'utiliser une plateforme d'échange ou un vendeur OTC, vérifiez que les retraits fonctionnent
    vraiment. Un prix affiché sur un site n'est pas un marché sur lequel on peut vendre.
- en: >-
    A "model" or "reference" price is an estimate, not an offer that anyone has to honour.
  fr: >-
    Un prix « modèle » ou « de référence » est une estimation, pas une offre que quiconque serait
    tenu d'honorer.
- en: >-
    Nobody legitimate asks for your seed. Messages offering help, "recovery" or guaranteed returns
    are scams.
  fr: >-
    Personne de sérieux ne vous demandera votre phrase de récupération. Les messages qui proposent
    de l'aide, une « récupération » ou des rendements garantis sont des arnaques.
- en: Before you install a node release
  fr: Avant d'installer une version du nœud
- en: >-
    Recent releases come without a signed checksum file; the last one with SHA256SUMS.asc was v0.34.6.
    GitHub shows a SHA-256 for each file on the release page: compare it with "shasum -a 256 <file>"
    ("sha256sum" on Linux).
  fr: >-
    Les versions récentes arrivent sans fichier de sommes de contrôle signé ; la dernière avec SHA256SUMS.asc
    était la v0.34.6. GitHub affiche un SHA-256 par fichier sur la page de la version : comparez-le
    avec « shasum -a 256 <fichier> » (« sha256sum » sous Linux).
- en: >-
    That proves the file is the one on GitHub, not who built it. If that matters to you, build the
    tagged source yourself.
  fr: >-
    Cela prouve que le fichier est bien celui de GitHub, pas qui l'a compilé. Si cela compte pour
    vous, compilez vous-même le code source étiqueté.
- en: New to BTX
  fr: Nouveau sur BTX
- en: >-
    BTX is a post-quantum fork of Bitcoin with a fixed maximum supply and its own proof-of-work (MatMul).
    It is run by an open community, not by a company.
  fr: >-
    BTX est un fork post-quantique de Bitcoin avec une offre maximale fixe et sa propre preuve de
    travail (MatMul). Il est porté par une communauté ouverte, pas par une entreprise.
- en: See how the network is doing right now, in plain terms.
  fr: Voir où en est le réseau en ce moment, expliqué simplement.
- en: Ask questions in the community chats (Discord, Telegram).
  fr: Poser des questions dans les chats de la communauté (Discord, Telegram).
- en: >-
