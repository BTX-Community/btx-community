# Spanish translations of the content texts of btx-community.com (community.yaml and
# guide.yaml). Each entry pairs the English text exactly as it stands there with its translation;
# when the English text changes, the old pair no longer matches, the page shows English and the
# build prints a warning. Translated with AI help; corrections by native speakers are welcome.

schema_version: 1
translations:
- en: >-
    A .btxwallet file holds the post-quantum seed in plain text. Treat it like a private key and
    delete temporary copies.
  es: >-
    Un archivo .btxwallet contiene la semilla poscuántica en texto plano. Trátalo como una clave
    privada y borra las copias temporales.
- en: >-
    A default build has no GPU support and cannot check MatMul blocks itself: add CUDA, or run it as
    a trusted mirror. On Ubuntu 22.04 or 24.04 add -DWITH_MODELNET=OFF, unless you install OpenSSL
    3.5 or newer.
  es: >-
    Una compilación por defecto no tiene soporte de GPU y no puede comprobar por sí misma los
    bloques MatMul: añade CUDA o ejecútala como espejo de confianza. En Ubuntu 22.04 o 24.04 añade
    -DWITH_MODELNET=OFF, salvo que instales OpenSSL 3.5 o más reciente.
- en: >-
    Back up the whole wallet with backupwalletbundlearchive (one passphrase-encrypted file; see
    doc/managing-wallets.md), not only the seed. A .btxwallet export holds the seed in plain text.
  es: >-
    Haz una copia de seguridad del monedero completo con backupwalletbundlearchive (un solo archivo
    cifrado con una frase de contraseña; consulta doc/managing-wallets.md), no solo de la semilla.
    Una exportación .btxwallet contiene la semilla en texto plano.
- en: >-
    Block explorer of the easyBTX team for blocks, transactions and addresses, with a public API
    (api.btxscan.io).
  es: >-
    Explorador de bloques, transacciones y direcciones del equipo easyBTX, con una API pública
    (api.btxscan.io).
- en: Block explorer run by the ninjaraider pool, with a JSON API for addresses and blocks.
  es: >-
    Explorador de bloques gestionado por el pool ninjaraider, con una API JSON para direcciones y
    bloques.
- en: >-
    Catch up in minutes with a daily signed snapshot. A sync from genesis currently stops at block
    126,978 (issue #272).
  es: >-
    Ponte al día en minutos con una instantánea diaria firmada. Una sincronización desde el génesis
    se detiene actualmente en el bloque 126.978 (issue #272).
- en: Closed source (stated in its README). 2% dev fee on BTX.
  es: Código cerrado (según su README). Comisión de desarrollador del 2 % en BTX.
- en: >-
    Closed source; the builds are unsigned, so check the SHA-256 on the release page. It starts on
    BTX Pool by default. A 5% dev fee was listed for it in August 2026; check the current fee in the
    app.
  es: >-
    Código cerrado; las compilaciones no están firmadas, así que comprueba el SHA-256 en la página
    de la versión. Por defecto arranca en BTX Pool. En agosto de 2026 se indicaba una comisión de
    desarrollador del 5 %; consulta la comisión actual en la app.
- en: Community Discord, open to everyone, including mining help.
  es: Discord de la comunidad, abierto a todos, con ayuda para minar.
- en: Community status page - is the network healthy, with history, node help and a public JSON API.
  es: >-
    Página de estado de la comunidad: si la red está sana, con historial, ayuda para nodos y una API
    JSON pública.
- en: >-
    Community-run account on X, not the developers'. It posted release notes and network news in
    August and September 2026.
  es: >-
    Cuenta en X gestionada por la comunidad, no la de los desarrolladores. Publicó notas de versión
    y noticias de la red en agosto y septiembre de 2026.
- en: >-
    Daily pruned datadir snapshot, checked and signed by a second node. Built on a trusted mirror,
    so the MatMul work was accepted on signers' attestations.
  es: >-
    Instantánea diaria de un directorio de datos podado, comprobada y firmada por un segundo nodo.
    Se genera en un espejo de confianza, así que el trabajo MatMul se aceptó basándose en las
    atestaciones de los firmantes.
- en: >-
    Early test build: internal security review, no independent audit; the source code is not public
    and the direct downloads are unsigned. A 64-character master key is the only backup; keep it
    offline.
  es: >-
    Versión de prueba temprana: revisión de seguridad interna, sin auditoría independiente; el
    código fuente no es público y las descargas directas no están firmadas. Una clave maestra de 64
    caracteres es la única copia de seguridad; guárdala fuera de línea.
- en: >-
    Every node relays blocks and keeps the network reachable. A node checks every block itself only
    with a GPU that passes btxd's self-test. Without one, run it as a trusted mirror that follows
    signed checks from at least two signers; otherwise it stops syncing. Signers have the highest
    requirements.
  es: >-
    Cada nodo retransmite bloques y mantiene la red accesible. Un nodo solo comprueba cada bloque
    por sí mismo con una GPU que supere la autoprueba de btxd. Sin ella, ejecútalo como un espejo de
    confianza que sigue las comprobaciones firmadas de al menos dos firmantes; si no, deja de
    sincronizar. Los firmantes tienen los requisitos más altos.
- en: Explorer of the Byron Bay team, with a 24 h mining view, stats pages and a public API.
  es: >-
    Explorador del equipo de Byron Bay, con una vista de minería de 24 h, páginas de estadísticas y
    una API pública.
- en: How to report a vulnerability privately to the BTX Development Team. Not for support questions.
  es: >-
    Cómo informar en privado de una vulnerabilidad al BTX Development Team. No es para consultas de
    soporte.
- en: >-
    Its backup file (.btxwallet) holds the seed in plain text. Keep it offline and never send it to
    anyone.
  es: >-
    Su archivo de copia de seguridad (.btxwallet) contiene la semilla en texto plano. Guárdalo fuera
    de línea y nunca se lo envíes a nadie.
- en: >-
    Last change 2026-08-21. The quick start in its README contains a sample payout address and two
    offline pools (minebtx, Byron); replace all three. 1% dev fee in pool mode; it updates itself
    unless started with --no-auto-update. NVIDIA Ampere (RTX 30 series) or newer only.
  es: >-
    Último cambio el 2026-08-21. El inicio rápido de su README contiene una dirección de cobro de
    ejemplo y dos pools fuera de servicio (minebtx, Byron); sustituye los tres. Comisión de
    desarrollador del 1 % en modo pool; se actualiza automáticamente salvo que se inicie con
    --no-auto-update. Solo NVIDIA Ampere (serie RTX 30) o más reciente.
- en: Last updated for v0.33.2 (August 2026); newer releases are on the GitHub releases page.
  es: >-
    Actualizada por última vez para la v0.33.2 (agosto de 2026); las versiones más nuevas están en
    la página de versiones de GitHub.
- en: >-
    MIT-licensed; this repository holds only the downloads and release notes. Compare the SHA-256
    listed with each release.
  es: >-
    Con licencia MIT; este repositorio solo contiene las descargas y las notas de versión. Compara
    el SHA-256 que se indica en cada versión.
- en: >-
    Mac app (Apple Silicon, macOS 13 or later) of the easyBTX team that fetches open AI models over
    the BTX model network and runs them on your Mac. It only downloads; it never serves, pays or
    earns.
  es: >-
    App para Mac (Apple Silicon, macOS 13 o posterior) del equipo easyBTX que obtiene modelos de IA
    abiertos a través de la red de modelos de BTX y los ejecuta en tu Mac. Solo descarga; nunca
    sirve modelos, ni paga ni gana nada.
- en: Miners log in as ADDRESS.worker; nekominer documents this and charges no dev fee on this pool.
  es: >-
    Los mineros se conectan como DIRECCIÓN.worker; nekominer lo documenta y no cobra comisión de
    desarrollador en este pool.
- en: >-
    Mining needs a qualified GPU and a node that checks blocks itself (matmulvalidation=consensus,
    the default), not a trusted mirror. See the GPU operator runbook.
  es: >-
    Para minar hace falta una GPU homologada y un nodo que compruebe los bloques por sí mismo
    (matmulvalidation=consensus, el valor por defecto), no un espejo de confianza. Consulta el
    manual de operación para GPU.
- en: >-
    Multi-coin GPU miner with BTX support (MatMul v4.7 since version 1.6.0); its BTX example uses
    BTX Pool. BTX mines on NVIDIA cards only.
  es: >-
    Minero de GPU multimoneda con soporte para BTX (MatMul v4.7 desde la versión 1.6.0); su ejemplo
    para BTX usa BTX Pool. BTX solo se mina con tarjetas NVIDIA.
- en: >-
    NVIDIA (CUDA) miner for several coins; BTX runs as algorithm btxv4, the proof-of-work since
    block 185,000. Its README has commands for ninjaraider and BTX Pool.
  es: >-
    Minero de varias monedas para NVIDIA (CUDA); BTX se mina con el algoritmo btxv4, la prueba de
    trabajo desde el bloque 185.000. Su README tiene comandos para ninjaraider y BTX Pool.
- en: No change to the miner since 2026-08-21.
  es: Sin cambios en el minero desde el 2026-08-21.
- en: Not launched. Its launch checklist is still open and the reference contracts are unaudited.
  es: >-
    Sin lanzar. Su lista de comprobación para el lanzamiento sigue abierta y los contratos de
    referencia no están auditados.
- en: >-
    Official explanation of why a node needs a qualified GPU to check blocks itself since block
    185,000, and what machines without one can do.
  es: >-
    Explicación oficial de por qué, desde el bloque 185.000, un nodo necesita una GPU homologada
    para comprobar los bloques por sí mismo, y qué pueden hacer los equipos sin ella.
- en: >-
    Official guide to moving a btx.dev browser wallet into btxd and back, and how that file differs
    from an encrypted node backup.
  es: >-
    Guía oficial para pasar un monedero de navegador de btx.dev a btxd y viceversa, y en qué se
    diferencia ese archivo de una copia de seguridad cifrada del nodo.
- en: >-
    Official guide to wallet roles, multisig, timelocked recovery, watch-only setups and encrypted
    backups, with a restore drill.
  es: >-
    Guía oficial sobre roles de monedero, multifirma, recuperación con bloqueo temporal,
    configuraciones de solo observación y copias de seguridad cifradas, con un simulacro de
    restauración.
- en: >-
    Official integration profile for exchanges and custodians: UTXO model, watch-only setup,
    deposits, confirmations and reorg handling.
  es: >-
    Perfil oficial de integración para exchanges y custodios: modelo UTXO, configuración de solo
    observación, depósitos, confirmaciones y gestión de reorganizaciones.
- en: >-
    Official scripts for solo mining against your own btxd: a health-aware mining loop, start and
    stop scripts and a wallet backup. For larger setups the README points to getblocktemplate with
    external miners.
  es: >-
    Scripts oficiales para minar en solitario contra tu propio btxd: un bucle de minería con
    comprobación de estado, scripts de inicio y parada y una copia de seguridad del monedero. Para
    instalaciones más grandes, el README remite a getblocktemplate con mineros externos.
- en: Official step-by-step guide to building btxd and btx-cli on Windows 11.
  es: Guía oficial paso a paso para compilar btxd y btx-cli en Windows 11.
- en: Official website with documentation, the browser wallet and the whitepaper.
  es: Web oficial con documentación, el monedero de navegador y el whitepaper.
- en: >-
    On a server - the official release for Linux needs glibc 2.38 or newer (Ubuntu 24.04, Debian
    13); a GPU node takes the -cuda13 archive (Blackwell cards). The v0.34.16 pre-release has no
    CUDA build, so GPU nodes stay on v0.34.15. The current release has no official Windows archive.
  es: >-
    En un servidor: la versión oficial para Linux necesita glibc 2.38 o más reciente (Ubuntu 24.04,
    Debian 13); un nodo con GPU usa el archivo -cuda13 (tarjetas Blackwell). La versión preliminar
    v0.34.16 no tiene compilación con CUDA, así que los nodos con GPU se quedan en la v0.34.15. La
    versión actual no tiene archivo oficial para Windows.
- en: >-
    On mainnet it needs at least two pinned signers and a threshold of two. Pin only signers that
    are live today.
  es: >-
    En la red principal necesita al menos dos firmantes fijados y un umbral de dos. Fija solo
    firmantes que estén activos hoy.
- en: >-
    One-click miner app with a self-custodial wallet built in, for Apple Silicon Macs and Linux (on
    Windows through WSL).
  es: >-
    App de minería con un clic y monedero propio integrado, para Mac con Apple Silicon y Linux (en
    Windows a través de WSL).
- en: >-
    Open-source (MIT) desktop app of the easyBTX team that installs and supervises btxd on the
    machine you already own.
  es: >-
    App de escritorio de código abierto (MIT) del equipo easyBTX que instala y supervisa btxd en el
    equipo que ya tienes.
- en: >-
    Paused by its operator since September 2026; no blocks among the last 1,000 (2026-11-12). The
    first light explorer of the same team stays listed.
  es: >-
    Pausado por su operador desde septiembre de 2026; ningún bloque entre los últimos 1.000
    (2026-11-12). El explorador first light del mismo equipo sigue en la lista.
- en: >-
    Pick a miner from our link list - for example easyBTX (an app for Mac and Linux; on Windows
    through WSL) or matador (open source).
  es: >-
    Elige un minero de nuestra lista de enlaces: por ejemplo easyBTX (una app para Mac y Linux; en
    Windows a través de WSL) o matador (código abierto).
- en: >-
    Pool dedicated to BTX, run by the author of btx-pool-miner (GitHub lucasan123). It pays miners
    inside each block it finds, split by work over a 30-minute window. Check its fee on the pool
    page.
  es: >-
    Pool dedicado a BTX, gestionado por el autor de btx-pool-miner (GitHub lucasan123). Paga a los
    mineros dentro de cada bloque que encuentra y reparte el pago según el trabajo de una ventana de
    30 minutos. Consulta su comisión en la página del pool.
- en: Post-quantum desktop wallet of the easyBTX team for macOS and Windows.
  es: Monedero de escritorio poscuántico del equipo easyBTX para macOS y Windows.
- en: >-
    Problems with an NVIDIA card? The official CUDA troubleshooting guide helps; parts of it
    describe the CUDA path from before block 185,000.
  es: >-
    ¿Problemas con una tarjeta NVIDIA? La guía oficial de solución de problemas de CUDA ayuda;
    partes de ella describen la vía CUDA anterior al bloque 185.000.
- en: >-
    Public tester site and guide of the wbtx-eth project (evxdev): a WBTX bridge on an Ethereum
    testnet. Test tokens have no value.
  es: >-
    Web pública de pruebas y guía del proyecto wbtx-eth (evxdev): un puente WBTX en una red de
    prueba de Ethereum. Los tokens de prueba no tienen valor.
- en: >-
    Read the official introduction and documentation. It was written for v0.33.2; newer releases
    differ in places.
  es: >-
    Lee la introducción y la documentación oficiales. Se escribieron para la v0.33.2; las versiones
    más nuevas difieren en algunos puntos.
- en: Run by the vendor of those apps.
  es: Lo gestiona el proveedor de esas apps.
- en: >-
    Runs v0.34.15 without the model network. Without a qualified GPU the node follows signers'
    checks instead of checking the MatMul work itself.
  es: >-
    Ejecuta la v0.34.15 sin la red de modelos. Sin una GPU homologada, el nodo sigue las
    comprobaciones de los firmantes en lugar de comprobar por sí mismo el trabajo MatMul.
- en: >-
    Seedless means there is no seed phrase you back up yourself; access and recovery go through the
    Bonuz login. Check how recovery works before you rely on it.
  es: >-
    "Sin semilla" significa que no hay una frase semilla de la que hagas tú la copia de seguridad;
    el acceso y la recuperación pasan por el inicio de sesión de Bonuz. Comprueba cómo funciona la
    recuperación antes de depender de ella.
- en: Seedless mobile wallet for iOS and Android with BTX support.
  es: Monedero móvil sin semilla para iOS y Android con soporte para BTX.
- en: >-
    Signers (GPU attestors) need a GPU that passes btxd's self-test and must stay online. The
    official CUDA archive covers Blackwell cards (sm_120); other NVIDIA cards need a build from
    source and may not qualify. Follow the developers' operator runbook.
  es: >-
    Los firmantes (atestadores con GPU) necesitan una GPU que supere la autoprueba de btxd y deben
    permanecer conectados. El archivo oficial con CUDA cubre las tarjetas Blackwell (sm_120); otras
    tarjetas NVIDIA necesitan una compilación desde el código fuente y puede que no cumplan los
    requisitos. Sigue el manual de operación de los desarrolladores.
- en: Some API endpoints need an access token.
  es: Algunos endpoints de la API necesitan un token de acceso.
- en: Telegram group of the easyBTX team, for questions about its miner, node app and wallet.
  es: >-
    Grupo de Telegram del equipo easyBTX, para preguntas sobre su minero, su app de nodo y su
    monedero.
- en: Testnet only; it can be reset. Code unchanged since 2026-07-09.
  es: Solo red de prueba; puede reiniciarse. Código sin cambios desde el 2026-07-09.
- en: >-
    The current release has no official Windows archive. The handbook starts without CUDA, and such
    a build cannot check MatMul blocks itself: run it as a trusted mirror.
  es: >-
    La versión actual no tiene archivo oficial para Windows. El manual empieza sin CUDA, y una
    compilación así no puede comprobar por sí misma los bloques MatMul: ejecútala como espejo de
    confianza.
- en: >-
    The developers' design for wrapped BTX on EVM chains: token rules, bridge models and reference
    contracts. A design, not a working bridge.
  es: >-
    El diseño de los desarrolladores para BTX envuelto en cadenas EVM: reglas del token, modelos de
    puente y contratos de referencia. Un diseño, no un puente en funcionamiento.
- en: >-
    The file is marked historical: it records the v3 design. Since block 185,000 the network runs
    MatMul v4.7.
  es: >-
    El archivo está marcado como histórico: recoge el diseño v3. Desde el bloque 185.000 la red
    funciona con MatMul v4.7.
- en: >-
    The miner's source is not published: the repository holds scripts and binary releases, with no
    licence. 2% dev fee, 0% on ninjaraider.
  es: >-
    El código fuente del minero no está publicado: el repositorio contiene scripts y versiones
    binarias, sin licencia. Comisión de desarrollador del 2 %, 0 % en ninjaraider.
- en: >-
    The same WBTX test bridge as btx.supply, on the Robinhood Chain testnet. Test tokens have no
    value.
  es: >-
    El mismo puente WBTX de prueba que btx.supply, en la red de prueba de Robinhood Chain. Los
    tokens de prueba no tienen valor.
- en: >-
    The wallet in the official releases for Linux and macOS: the desktop app btx-qt, or btxd with
    btx-cli. Open source; it runs on your own node.
  es: >-
    El monedero de las versiones oficiales para Linux y macOS: la aplicación de escritorio btx-qt, o
    btxd con btx-cli. Código abierto; funciona en tu propio nodo.
- en: Verification gate; clearing it lets you into the main BTX Telegram groups.
  es: Filtro de verificación; si lo superas, entras en los grupos principales de Telegram de BTX.
- en: Verify the signature and SHA-256 before use. Not for signers.
  es: Verifica la firma y el SHA-256 antes de usarla. No es para firmantes.
- en: >-
    Wrapped BTX on Ethereum - contracts, validator services and a local simulator, by the GitHub
    organisation evxdev. Testnet only.
  es: >-
    BTX envuelto en Ethereum: contratos, servicios de validador y un simulador local, de la
    organización de GitHub evxdev. Solo red de prueba.
- en: >-
    matador's quick start contains a sample payout address that is not yours and two pools that are
    offline. Always put in your own btx1z address and a pool from our link list.
  es: >-
    El inicio rápido de matador contiene una dirección de cobro de ejemplo que no es tuya y dos
    pools fuera de servicio. Pon siempre tu propia dirección btx1z y un pool de nuestra lista de
    enlaces.
- en: Fixed supply
  es: Suministro fijo
- en: >-
    At most 21 million BTX, as with Bitcoin. A block comes about every 90 seconds; its reward of 20
    BTX halves every 525,000 blocks, roughly every 18 months.
  es: >-
    Como máximo 21 millones de BTX, como en Bitcoin. Llega un bloque cada 90 segundos aproximadamente;
    su recompensa de 20 BTX se reduce a la mitad cada 525.000 bloques, más o menos cada 18 meses.
- en: Mining by matrix multiplication
  es: Minería por multiplicación de matrices
- en: >-
    Instead of hashing, miners multiply large matrices, the work AI accelerators are built for. Since
    block 185,000 every block needs a complete, exactly reproducible run on a qualified NVIDIA (CUDA)
    or Apple (Metal) GPU. There is no CPU mining.
  es: >-
    En lugar de calcular hashes, los mineros multiplican matrices grandes, el trabajo para el que
    están hechos los aceleradores de IA. Desde el bloque 185.000 cada bloque necesita una ejecución
    completa y exactamente reproducible en una GPU homologada de NVIDIA (CUDA) o Apple (Metal). No
    se puede minar con la CPU.
- en: Post-quantum signatures
  es: Firmas poscuánticas
- en: >-
    Coins are locked with signatures meant to withstand quantum computers: ML-DSA-44 (NIST FIPS 204)
    for everyday spending, SLH-DSA (FIPS 205) as a hash-based fallback. These P2MR addresses start
    with btx1z.
  es: >-
    Las monedas se bloquean con firmas pensadas para resistir a los ordenadores cuánticos: ML-DSA-44
    (NIST FIPS 204) para el gasto diario y SLH-DSA (FIPS 205) como respaldo basado en hashes. Estas
    direcciones P2MR empiezan por btx1z.
- en: Built on Bitcoin Core
  es: Basado en Bitcoin Core
- en: >-
    The node is a fork of Bitcoin Core. btxd, btx-cli, the RPC interface and PSBTs work the way Bitcoin
    users know them; what differs is the proof-of-work and the signatures.
  es: >-
    El nodo es un fork de Bitcoin Core. btxd, btx-cli, la interfaz RPC y los PSBT funcionan como los
    conocen los usuarios de Bitcoin; lo que cambia es la prueba de trabajo y las firmas.
- en: >-
    Release candidate v0.35.0rc1 since 13 October 2026. The developers call it not release-qualified;
    the current release stays v0.34.15. Nothing below is final.
  es: >-
    Versión candidata v0.35.0rc1 desde el 13 de octubre de 2026. Los desarrolladores dicen que no
    está lista para publicarse; la versión actual sigue siendo la v0.34.15. Nada de lo siguiente es
    definitivo.
- en: Presigned swap claims from the wallet
  es: Reclamaciones de swap prefirmadas desde el monedero
- en: >-
    Since 0.34.13 a swap claim can be signed at funding and completed later by anyone who has the
    secret; nobody has to stay online, but someone must broadcast it in time. That still takes hand-built
    transactions. htlc_presign and p2mr_leaf make it a wallet step. Not in rc1; in the 0.35 branch
    and the v0.34.16 pre-release.
  es: >-
    Desde la 0.34.13 una reclamación de swap puede firmarse al financiar el swap y completarla después
    cualquiera que tenga el secreto; nadie tiene que seguir conectado, pero alguien debe difundirla
    a tiempo. Por ahora requiere transacciones construidas a mano. htlc_presign y p2mr_leaf lo convierten
    en un paso del monedero. No están en la rc1; sí en la rama 0.35 y en la versión preliminar v0.34.16.
- en: The model network moves into the node
  es: La red de modelos pasa al nodo
- en: >-
    The network for AI models has run beside the node since v0.34.9 (btx-modeld). In 0.35 it runs
    inside btxd, and a research lab joins it: identities with recovery keys, git workspaces for models,
    evaluations. Off with -modelnet=0; it does not spend coins.
  es: >-
    La red para modelos de IA funciona junto al nodo desde la v0.34.9 (btx-modeld). En la 0.35 funciona
    dentro de btxd y se le une un laboratorio de investigación: identidades con claves de recuperación,
    espacios de trabajo git para modelos y evaluaciones. Se desactiva con -modelnet=0; no gasta monedas.
- en: Safer auto-update
  es: Actualización automática más segura
- en: >-
    A node behind a proxy or Tor no longer checks for updates by itself, so it does not reveal its
    address to the update server. The update helper runs isolated.
  es: >-
    Un nodo detrás de un proxy o de Tor ya no busca actualizaciones por sí mismo, así que no revela
    su dirección al servidor de actualizaciones. El asistente de actualización se ejecuta aislado.
- en: Desktop app and ZeroMQ
  es: Aplicación de escritorio y ZeroMQ
- en: >-
    The official archives include the graphical wallet btx-qt and ZeroMQ notifications for services
    that follow the chain.
  es: >-
    Los archivos oficiales incluyen el monedero gráfico btx-qt y las notificaciones ZeroMQ para servicios
    que siguen la cadena.
- en: >-
    rc1 has no Linux CUDA archive. A GPU node started with it falls back to the CPU and can stall
    at the next block. Miners and signers stay on v0.34.15.
  es: >-
    La rc1 no tiene archivo de Linux con CUDA. Un nodo con GPU iniciado con ella recurre a la CPU
    y puede quedarse atascado en el siguiente bloque. Mineros y firmantes se quedan en la v0.34.15.
- en: The desktop app of rc1 needs glibc 2.43 and does not start on Ubuntu 24.04.
  es: >-
    La aplicación de escritorio de la rc1 necesita glibc 2.43 y no arranca en Ubuntu 24.04.
- en: CUDA on Windows was neither built nor tested.
  es: CUDA en Windows no se compiló ni se probó.
- en: Before you buy or receive BTX
  es: Antes de comprar o recibir BTX
- en: >-
    Create the wallet first and write the backup down offline. Restore it once, so you know the backup
    works before money depends on it.
  es: >-
    Crea primero el monedero y apunta la copia de seguridad fuera de línea. Restáurala una vez para
    saber que funciona antes de que dependa dinero de ella.
- en: >-
    Check the receiving address in full, not just its start and end. BTX addresses start with btx1z.
  es: >-
    Comprueba la dirección de recepción completa, no solo el principio y el final. Las direcciones
    BTX empiezan por btx1z.
- en: Send a small test amount first and wait until it is confirmed.
  es: Envía primero una cantidad pequeña de prueba y espera a que se confirme.
- en: >-
    Before you use an exchange or an OTC seller, check that withdrawals really work. A price on a
    website is not a market you can sell into.
  es: >-
    Antes de usar un exchange o un vendedor OTC, comprueba que los retiros funcionan de verdad. Un
    precio en una web no es un mercado en el que puedas vender.
- en: >-
    A "model" or "reference" price is an estimate, not an offer that anyone has to honour.
  es: >-
    Un precio "modelo" o "de referencia" es una estimación, no una oferta que nadie tenga que cumplir.
- en: >-
    Nobody legitimate asks for your seed. Messages offering help, "recovery" or guaranteed returns
    are scams.
  es: >-
    Nadie legítimo te pedirá tu semilla. Los mensajes que ofrecen ayuda, "recuperación" o rentabilidad
    garantizada son estafas.
- en: Before you install a node release
  es: Antes de instalar una versión del nodo
- en: Download only from github.com/btxchain/btx/releases.
  es: Descarga solo desde github.com/btxchain/btx/releases.
- en: >-
    Recent releases come without a signed checksum file; the last one with SHA256SUMS.asc was v0.34.6.
    GitHub shows a SHA-256 for each file on the release page: compare it with "shasum -a 256 <file>"
    ("sha256sum" on Linux).
  es: >-
    Las versiones recientes vienen sin archivo de sumas de comprobación firmado; la última con SHA256SUMS.asc
    fue la v0.34.6. GitHub muestra un SHA-256 por archivo en la página de la versión: compáralo con
    "shasum -a 256 <archivo>" ("sha256sum" en Linux).
- en: >-
    That proves the file is the one on GitHub, not who built it. If that matters to you, build the
    tagged source yourself.
  es: >-
    Eso prueba que el archivo es el de GitHub, no quién lo compiló. Si eso te importa, compila tú
    mismo el código etiquetado.
- en: >-
    Read the release notes before upgrading. Some releases change the rules at a fixed block height;
    this page shows a countdown when one is coming.
  es: >-
    Lee las notas de versión antes de actualizar. Algunas versiones cambian las reglas a partir de
    una altura de bloque fija; esta página muestra una cuenta atrás cuando se acerca una.
- en: >-
    Release candidates (rc) are for testing. Do not run them on a mining or signing node.
  es: >-
    Las versiones candidatas (rc) son para pruebas. No las uses en un nodo de minería o de firma.
- en: New to BTX
  es: Nuevo en BTX
- en: >-
    BTX is a post-quantum fork of Bitcoin with a fixed maximum supply and its own proof-of-work (MatMul).
    It is run by an open community, not by a company.
  es: >-
    BTX es un fork poscuántico de Bitcoin con un suministro máximo fijo y su propia prueba de trabajo
    (MatMul). Lo sostiene una comunidad abierta, no una empresa.
- en: See how the network is doing right now, in plain terms.
  es: Mira cómo está la red ahora mismo, explicado con claridad.
- en: Ask questions in the community chats (Discord, Telegram).
  es: Haz preguntas en los chats de la comunidad (Discord, Telegram).
- en: >-
    Never share your seed or private key. Nobody from the community will ever ask for it; direct messages
    offering help or "support" are scams.
  es: >-
    Nunca compartas tu semilla ni tu clave privada. Nadie de la comunidad te la pedirá; los mensajes
    directos que ofrecen ayuda o "soporte" son estafas.
- en: Mining
  es: Minería
- en: >-
    Mining needs a GPU. You can mine alone against your own node and keep every block, or join a pool
    for steadier payouts.
  es: >-
    Para minar hace falta una GPU. Puedes minar en solitario contra tu propio nodo y quedarte cada
    bloque, o unirte a un pool para cobrar de forma más regular.
- en: >-
    Prefer a smaller pool. When one pool finds most blocks, the network depends on it; the status
    page shows the current shares.
  es: >-
    Mejor un pool pequeño. Cuando un pool encuentra la mayoría de los bloques, la red depende de él;
    la página de estado muestra las cuotas actuales.
