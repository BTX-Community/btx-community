# Spanish translations of the content texts of btx-community.com (community.yaml and
# guide.yaml). Each entry pairs the English text exactly as it stands there with its translation;
# when the English text changes, the old pair no longer matches, the page shows English and the
# build prints a warning. Translated with AI help; corrections by native speakers are welcome.

schema_version: 1
translations:
- en: Fixed supply
  es: Suministro fijo
- en: >-
    At most 21 million BTX, as with Bitcoin. A block comes about every 90 seconds; its reward of 20
    BTX halves every 525,000 blocks, roughly every 18 months.
  es: >-
    Como máximo 21 millones de BTX, como en Bitcoin. Llega un bloque cada 90 segundos aproximadamente;
    su recompensa de 20 BTX se reduce a la mitad cada 525.000 bloques, más o menos cada 18 meses.
- en: Mining by matrix multiplication
  es: Minería por multiplicación de matrices
- en: Post-quantum signatures
  es: Firmas poscuánticas
- en: >-
    Coins are locked with signatures meant to withstand quantum computers: ML-DSA-44 (NIST FIPS 204)
    for everyday spending, SLH-DSA (FIPS 205) as a hash-based fallback. These P2MR addresses start
    with btx1z.
  es: >-
    Las monedas se bloquean con firmas pensadas para resistir a los ordenadores cuánticos: ML-DSA-44
    (NIST FIPS 204) para el gasto diario y SLH-DSA (FIPS 205) como respaldo basado en hashes. Estas
    direcciones P2MR empiezan por btx1z.
- en: Built on Bitcoin Knots
  es: Basado en Bitcoin Knots
- en: Presigned swap claims from the wallet
  es: Reclamaciones de swap prefirmadas desde el monedero
- en: Before you buy or receive BTX
  es: Antes de comprar o recibir BTX
- en: >-
    Check the receiving address in full, not just its start and end. BTX addresses start with btx1z.
  es: >-
    Comprueba la dirección de recepción completa, no solo el principio y el final. Las direcciones
    BTX empiezan por btx1z.
- en: >-
    Before you use an exchange or an OTC seller, check that withdrawals really work. A price on a
    website is not a market you can sell into.
  es: >-
    Antes de usar un exchange o un vendedor OTC, comprueba que los retiros funcionan de verdad. Un
    precio en una web no es un mercado en el que puedas vender.
- en: >-
    A "model" or "reference" price is an estimate, not an offer that anyone has to honour.
  es: >-
    Un precio "modelo" o "de referencia" es una estimación, no una oferta que nadie tenga que cumplir.
- en: >-
    Nobody legitimate asks for your seed. Messages offering help, "recovery" or guaranteed returns
    are scams.
  es: >-
    Nadie legítimo te pedirá tu semilla. Los mensajes que ofrecen ayuda, "recuperación" o rentabilidad
    garantizada son estafas.
- en: Before you install a node release
  es: Antes de instalar una versión del nodo
- en: >-
    Recent releases come without a signed checksum file; the last one with SHA256SUMS.asc was v0.34.6.
    GitHub shows a SHA-256 for each file on the release page: compare it with "shasum -a 256 <file>"
    ("sha256sum" on Linux).
  es: >-
    Las versiones recientes vienen sin archivo de sumas de comprobación firmado; la última con SHA256SUMS.asc
    fue la v0.34.6. GitHub muestra un SHA-256 por archivo en la página de la versión: compáralo con
    "shasum -a 256 <archivo>" ("sha256sum" en Linux).
- en: >-
    That proves the file is the one on GitHub, not who built it. If that matters to you, build the
    tagged source yourself.
  es: >-
    Eso prueba que el archivo es el de GitHub, no quién lo compiló. Si eso te importa, compila tú
    mismo el código etiquetado.
- en: New to BTX
  es: Nuevo en BTX
- en: >-
    BTX is a post-quantum fork of Bitcoin with a fixed maximum supply and its own proof-of-work (MatMul).
    It is run by an open community, not by a company.
  es: >-
    BTX es un fork poscuántico de Bitcoin con un suministro máximo fijo y su propia prueba de trabajo
    (MatMul). Lo sostiene una comunidad abierta, no una empresa.
- en: Read the official introduction and documentation.
  es: Lee la introducción y la documentación oficiales.
- en: See how the network is doing right now, in plain terms.
  es: Mira cómo está la red ahora mismo, explicado con claridad.
- en: Ask questions in the community chats (Discord, Telegram).
  es: Haz preguntas en los chats de la comunidad (Discord, Telegram).
- en: >-
    Never share your seed or private key. Nobody from the community will ever ask for it; direct messages
    offering help or "support" are scams.
  es: >-
    Nunca compartas tu semilla ni tu clave privada. Nadie de la comunidad te la pedirá; los mensajes
    directos que ofrecen ayuda o "soporte" son estafas.
- en: Mining
  es: Minería
- en: >-
    Mining needs a GPU. You can mine alone against your own node and keep every block, or join a pool
    for steadier payouts.
  es: >-
    Para minar hace falta una GPU. Puedes minar en solitario contra tu propio nodo y quedarte cada
    bloque, o unirte a un pool para cobrar de forma más regular.
- en: >-
    Pick a miner - easyBTX (one app for Mac, Windows, Linux) or matador (open source).
  es: >-
    Elige un minero: easyBTX (una app para Mac, Windows y Linux) o matador (código abierto).
- en: >-
    Prefer a smaller pool. When one pool finds most blocks, the network depends on it; the status
    page shows the current shares.
  es: >-
    Mejor un pool pequeño. Cuando un pool encuentra la mayoría de los bloques, la red depende de él;
    la página de estado muestra las cuotas actuales.
- en: >-
    matador's examples still name the minebtx pool, which is offline. Use a pool from our link list
    instead.
  es: >-
    Los ejemplos de matador todavía mencionan el pool minebtx, que está fuera de servicio. Usa en
    su lugar un pool de nuestra lista de enlaces.
- en: Problems with an NVIDIA card? The official CUDA troubleshooting guide helps.
  es: >-
    ¿Problemas con una tarjeta NVIDIA? La guía oficial de solución de problemas de CUDA ayuda.
- en: Running a node
  es: Operar un nodo
- en: >-
    Every node checks the chain for itself and makes the network harder to fool. A home computer is
    enough; signers have much higher requirements.
  es: >-
    Cada nodo comprueba la cadena por sí mismo y hace que sea más difícil engañar a la red. Basta
    con un ordenador doméstico; los firmantes tienen requisitos mucho mayores.
- en: Easiest start at home - easynode installs and supervises btxd for you.
  es: 'El inicio más fácil en casa: easynode instala y supervisa btxd por ti.'
- en: >-
    On a server - the official release for Linux needs glibc 2.38 or newer (Ubuntu 24.04, Debian 13).
  es: >-
    En un servidor: la versión oficial para Linux necesita glibc 2.38 o más reciente (Ubuntu 24.04,
    Debian 13).
- en: >-
    Catch up in minutes with a daily signed snapshot instead of syncing from genesis.
  es: >-
    Ponte al día en minutos con una instantánea diaria firmada en lugar de sincronizar desde el génesis.
- en: Node stuck at a height? The node help explains each known case and its fix.
  es: >-
    ¿Nodo atascado en una altura? La ayuda para nodos explica cada caso conocido y su solución.
- en: >-
    Signers (GPU attestors) need an NVIDIA Blackwell card (sm_120) and must follow the developers'
    operator runbook.
  es: >-
    Los firmantes (atestadores con GPU) necesitan una tarjeta NVIDIA Blackwell (sm_120) y deben seguir
    el manual de operación de los desarrolladores.
