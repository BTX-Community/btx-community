    Check your setup with the exam: twelve cases with known answers.
  es: >-
    Pon a prueba tu configuración con el examen: doce casos con respuestas conocidas.
- en: >-
    Generate, challenge, verify, then publish: assume the draft is wrong, check every claim against
    a primary source, and treat AI output as a lead until a command you ran reproduces it.
  es: >-
    Generar, cuestionar, verificar y después publicar: da por hecho que el borrador está mal,
    comprueba cada afirmación contra una fuente primaria y trata lo que produce la IA como una pista
    hasta que lo reproduzca un comando que hayas ejecutado tú.
- en: >-
    Fix a class, not one spot: every place in the code, plus the test, lint or CI job that keeps the
    class at zero.
  es: >-
    Corrige una clase de error, no un solo punto: cada lugar del código, más la prueba, la regla de
    lint o el trabajo de CI que mantiene la clase en cero.
- en: >-
    Tested fixes only: fails before, passes after, with commit, platform and command. Say what was
    not tested.
  es: >-
    Solo correcciones probadas: falla antes, pasa después, con commit, plataforma y comando. Di qué
    no se probó.
- en: >-
    Validation, fork choice, attestation and the MatMul frontier stay out of release-0.34.16
    (btxchain/btx #464 and the pull requests closed on the same day, 11 November 2026). Findings
    there go to the E-CONSENSUS lane as evidence, not as pull requests.
  es: >-
    La validación, la elección de fork, la atestación y la frontera MatMul quedan fuera de
    release-0.34.16 (btxchain/btx #464 y los pull requests cerrados el mismo día, 11 de noviembre de
    2026). Los hallazgos en esas áreas van a la tarea E-CONSENSUS como evidencias, no como pull
    requests.
- en: >-
    A second person who is not the author reviews before anything goes upstream. Lanes send their
    pull requests together once a week, so the maintainer gets one batch, not a stream.
  es: >-
    Una segunda persona, que no sea el autor, revisa antes de que nada vaya upstream. Las tareas
    envían sus pull requests juntos una vez por semana, para que el mantenedor reciba un lote y no
    un goteo constante.
- en: >-
    The AI never posts, pushes or opens a pull request. You do, after reading the full text and the
    full diff.
  es: >-
    La IA nunca publica, nunca hace push ni abre un pull request. Lo haces tú, después de leer el
    texto completo y el diff completo.
- en: >-
    No secrets anywhere: no keys, wallets, RPC cookies or tokens on a test machine, in a log, a
    commit or a prompt.
  es: >-
    Ningún secreto en ninguna parte: ni claves, ni monederos, ni cookies RPC, ni tokens, ya sea en
    una máquina de pruebas, en un log, en un commit o en un prompt.
- en: >-
    Basic: verify
  es: >-
    Basic: verificar
- en: >-
    Re-run a pull request's stated test at its commit, or check a release archive's SHA-256 and that
    it starts. A Linux machine or WSL2, about an hour of setup, no spend, no wallet on the machine.
  es: >-
    Repite la prueba indicada de un pull request en su commit, o comprueba el SHA-256 de un archivo
    de versión y que arranca. Una máquina Linux o WSL2, una hora de preparación aproximadamente, sin
    gastos y sin monedero en la máquina.
- en: >-
    Advanced: team
  es: >-
    Advanced: en equipo
- en: >-
    Own a lane (a bug class or a code area) with a second person who checks every diff. Sweep the
    class, add the rule that keeps it at zero, send tested pull requests. A machine that builds the
    code with tests, a fork, a few hours every week.
  es: >-
    Hazte responsable de una tarea (una clase de error o un área del código) con una segunda persona
    que revisa cada diff. Barre la clase, añade la regla que la mantiene en cero y envía pull
    requests probados. Una máquina que compile el código con pruebas, un fork y unas horas cada
    semana.
