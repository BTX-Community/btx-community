  es: Web no accesible, el explorador respondió 503 (2026-11-03).
- en: Website not reachable (2026-11-03).
  es: Web no accesible (2026-11-03).
- en: Custodial OTC desk run by a third party, with no published company, licence, fees or audit; outside what this page can check.
  es: Mesa OTC custodial de un tercero, sin empresa, licencia, comisiones ni auditoría publicadas; fuera de lo que esta página puede comprobar.
- en: The BTX page no longer exists (404, 2026-11-03).
  es: La página de BTX ya no existe (404, 2026-11-03).
- en: >-
    A new node cannot sync from genesis: v0.34.15 and v0.34.16 stop at block 126,978. Start from a
    signed snapshot, and do not run -reindex until a release fixes it.
  es: >-
    Un nodo nuevo no puede sincronizar desde el génesis: la v0.34.15 y la v0.34.16 se detienen en el
    bloque 126.978. Empieza con una instantánea firmada y no ejecutes -reindex hasta que una versión lo
    corrija.
- en: >-
    A node behind a proxy, or with -onlynet excluding IPv4 and IPv6, no longer checks for updates by
    default. Every other mainnet node still polls btx.dev and installs a newer signed release by itself
    unless autoupdateseamless=0.
  es: >-
    Un nodo detrás de un proxy, o con -onlynet sin IPv4 ni IPv6, ya no busca actualizaciones por
    defecto. Cualquier otro nodo de mainnet sigue consultando btx.dev e instala por sí mismo una versión
    firmada más reciente, salvo con autoupdateseamless=0.
- en: >-
    A sync from genesis still stops at block 126,978 (#272). Start from a snapshot.
  es: >-
    Una sincronización desde el génesis sigue deteniéndose en el bloque 126.978 (#272). Empieza con una
    instantánea.
- en: Atlas, a second desktop app
  es: Atlas, una segunda aplicación de escritorio
- en: Auto-update off behind a proxy
  es: Actualización automática desactivada tras un proxy
- en: >-
    Before an upgrade, stop with btx-cli stop and wait until btxd has exited; never kill it. Then back
    up the data directory and wallets.
  es: >-
    Antes de actualizar, detén el nodo con btx-cli stop y espera a que btxd termine; nunca lo mates.
    Después haz una copia del directorio de datos y de los monederos.
- en: >-
    Decide the node's role first. Checking blocks yourself needs a qualified NVIDIA or Apple GPU.
    Without one, run a trusted mirror with at least two signers, or the node stops.
  es: >-
    Decide primero el papel del nodo. Comprobar los bloques por ti mismo requiere una GPU homologada de
    NVIDIA o Apple. Sin ella, ejecútalo como réplica de confianza con al menos dos firmantes, o el nodo
    se detiene.
- en: >-
    Download node releases only from github.com/btxchain/btx/releases. Community tools such as easynode
    or snapshots are your own choice to trust; check their signatures.
  es: >-
    Descarga las versiones del nodo solo desde github.com/btxchain/btx/releases. Confiar en herramientas
    de la comunidad como easynode o las instantáneas es decisión tuya; comprueba sus firmas.
- en: Clearer backup warning
  es: Advertencia de copia de seguridad más clara
- en: >-
    Instead of hashing, miners multiply large matrices, the work AI accelerators are built for. Since
    block 185,000 a node that checks blocks itself replays each one exactly on a qualified NVIDIA (CUDA)
    or Apple (Metal) GPU; nodes without one follow signed checks from others. There is no CPU mining.
  es: >-
    En lugar de calcular hashes, los mineros multiplican matrices grandes, el trabajo para el que están
    hechos los aceleradores de IA. Desde el bloque 185.000, un nodo que comprueba los bloques por sí
    mismo vuelve a calcular cada uno exactamente en una GPU homologada de NVIDIA (CUDA) o Apple (Metal);
    los nodos sin ella siguen comprobaciones firmadas por otros. No se puede minar con la CPU.
- en: >-
    Linux binaries need glibc 2.38 or newer (Ubuntu 24.04, Debian 13). v0.34.15 has archives for Linux,
    Linux with CUDA and Apple Silicon Macs; there is no official Windows build.
  es: >-
    Los binarios de Linux necesitan glibc 2.38 o más reciente (Ubuntu 24.04, Debian 13). La v0.34.15
    tiene archivos para Linux, Linux con CUDA y Mac con Apple Silicon; no hay versión oficial para
    Windows.
- en: >-
    Make a backup before money arrives. In btxd, backupwalletbundlearchive writes one encrypted file;
    keep it and its passphrase offline and apart. Any backup can spend your coins: plain exports at
    once, the archive once opened. Restore it once to test it.
  es: >-
    Haz una copia de seguridad antes de que llegue el dinero. En btxd, backupwalletbundlearchive escribe
    un único archivo cifrado; guárdalo junto con su frase de contraseña fuera de línea y por separado.
    Cualquier copia puede gastar tus monedas: las exportaciones simples de inmediato, el archivo una vez
    abierto. Restáurala una vez para probarla.
- en: Model network with fewer open ports
  es: Red de modelos con menos puertos abiertos
- en: >-
    No CUDA, macOS or Windows archive. A GPU, mining or signing node on v0.34.16 loses its GPU path;
    those nodes stay on v0.34.15.
  es: >-
    No hay archivo para CUDA, macOS ni Windows. Un nodo con GPU, de minería o de firma pierde con la
    v0.34.16 su ruta por GPU; esos nodos se quedan en la v0.34.15.
- en: >-
    Other coins also trade as BTX. A market is only for this chain if its deposit addresses start with
    btx1z.
  es: >-
    Otras monedas también cotizan como BTX. Un mercado solo es de esta cadena si sus direcciones de
    depósito empiezan por btx1z.
- en: >-
    Pre-release since 7 November 2026, Linux x86_64 only. It packages the 0.35 review branches; the 0.35
    line stays open. The developers say it is not a release qualification. The current full release
    stays v0.34.15.
  es: >-
    Versión preliminar desde el 7 de noviembre de 2026, solo para Linux x86_64. Reúne las ramas de
    revisión de la 0.35; la línea 0.35 sigue abierta. Los desarrolladores dicen que no es una versión
    validada para publicación. La versión completa actual sigue siendo la v0.34.15.
- en: >-
    Pre-releases (rc, and v0.34.16) are for testing. v0.34.16 has no CUDA build: a GPU, mining or
    signing node stays on v0.34.15.
  es: >-
    Las versiones preliminares (rc y la v0.34.16) son para pruebas. La v0.34.16 no tiene versión con
    CUDA: un nodo con GPU, de minería o de firma se queda en la v0.34.15.
- en: >-
    Read the release notes before upgrading. Some releases change the rules at a fixed block height;
    this page shows a countdown when one is coming. Each release also stops working about two years
    after it was built; current ones in November 2028.
  es: >-
    Lee las notas de versión antes de actualizar. Algunas versiones cambian las reglas a partir de una
    altura de bloque fija; esta página muestra una cuenta atrás cuando se acerca una. Además, cada
    versión deja de funcionar unos dos años después de compilarse; las actuales, en noviembre de 2028.
- en: >-
    Send a small test amount first. Wait for at least 10 confirmations before you treat a payment as
    final; short reorganisations of the chain happen several times a day.
  es: >-
    Envía primero una pequeña cantidad de prueba. Espera al menos 10 confirmaciones antes de dar un pago
    por definitivo; varias veces al día hay reorganizaciones cortas de la cadena.
- en: >-
    Since 0.34.13 a swap claim can be signed at funding and completed later by anyone who has the
    secret. htlc_presign and p2mr_leaf turn the hand-built transactions into a wallet step. The fee is
    fixed when you presign, and the claim must confirm before the refund height.
  es: >-
    Desde la 0.34.13 una reclamación de swap puede firmarse al financiar el swap y completarla después
    cualquiera que tenga el secreto. htlc_presign y p2mr_leaf convierten las transacciones construidas a
    mano en un paso del monedero. La comisión queda fijada al prefirmar, y la reclamación debe
    confirmarse antes de la altura de reembolso.
- en: >-
    The Linux archive adds btx-atlas beside btx-qt, which stays. Atlas needs glibc 2.39, WebKitGTK 4.1,
    GTK 3, the Ayatana tray library and zenity. btx-qt and ZeroMQ were already in v0.34.15.
  es: >-
    El archivo de Linux añade btx-atlas junto a btx-qt, que se mantiene. Atlas necesita glibc 2.39,
    WebKitGTK 4.1, GTK 3, la biblioteca de bandeja Ayatana y zenity. btx-qt y ZeroMQ ya estaban en la
    v0.34.15.
- en: >-
    The network for AI models is on by default and listens on TCP 29447. v0.34.16 no longer opens that
    port with -listen=0 or a proxy, finds model peers on the local network over UDP 29448, and adds a
    local security guard. -modelnet=0 turns all of it off; it does not spend coins.
  es: >-
    La red para modelos de IA está activada por defecto y escucha en TCP 29447. La v0.34.16 ya no abre
    ese puerto con -listen=0 o con un proxy, busca pares de modelos en la red local por UDP 29448 y
    añade un guardián de seguridad local. -modelnet=0 lo desactiva todo; no gasta monedas.
- en: >-
    The node derives from Bitcoin Knots v29.2, a variant of Bitcoin Core. btxd, btx-cli, the RPC
    interface and PSBTs work the way Bitcoin users know them; what differs is the proof-of-work, the
    signatures and some network rules.
  es: >-
    El nodo deriva de Bitcoin Knots v29.2, una variante de Bitcoin Core. btxd, btx-cli, la interfaz RPC
    y los PSBT funcionan como los conocen los usuarios de Bitcoin; lo que cambia es la prueba de
    trabajo, las firmas y algunas reglas de red.
- en: >-
    Two defaults to decide on: btxd installs newer signed releases from btx.dev by itself
    (autoupdateseamless=0 only reports them, autoupdate=0 stops checking), and the model network listens
    on port 29447 (modelnet=0 turns it off).
  es: >-
    Dos valores por defecto que debes decidir: btxd instala por sí mismo versiones firmadas más
    recientes desde btx.dev (autoupdateseamless=0 solo las notifica, autoupdate=0 deja de buscarlas), y
    la red de modelos escucha en el puerto 29447 (modelnet=0 la desactiva).
- en: Unpack the whole archive and run bin/btxd from it. A bin/btxd copied on its own exits.
  es: >-
    Descomprime el archivo completo y ejecuta bin/btxd desde él. Un bin/btxd copiado por separado se
    cierra.
- en: >-
    Wallet bundle backups now say that the descriptor file inside spends without the wallet passphrase,
    and warn for an encrypted wallet. Backups made with earlier versions hold the same file.
  es: >-
    Las copias de seguridad en paquete del monedero ahora indican que el archivo de descriptores que
    contienen puede gastar sin la frase de contraseña del monedero, y avisan si el monedero está
    cifrado. Las copias hechas con versiones anteriores contienen el mismo archivo.
- en: >-
    btx-qt in this archive needs glibc 2.43 and does not start on Ubuntu 24.04 or Debian 13; btxd and
    btx-cli need 2.38.
  es: >-
    btx-qt en este archivo necesita glibc 2.43 y no arranca en Ubuntu 24.04 ni en Debian 13; btxd y btx-
    cli necesitan 2.38.
- en: Become a BTX dev
  es: Hazte desarrollador de BTX
- en: >-
    How to work on the node software so that your change can be merged: the method, build and test
    recipes, the gate before an upstream pull request, open lanes with claimable owners, an exam,
    and an entry file for AI tools.
  es: >-
    Cómo trabajar en el software del nodo para que tu cambio pueda integrarse: el método, recetas de
    compilación y pruebas, la lista de comprobación previa a un pull request upstream, tareas
    abiertas en las que puedes apuntarte como responsable, un examen y un archivo de entrada para
    herramientas de IA.
- en: Living document - every page carries its last-verified date
  es: >-
    Documento vivo: cada página indica la fecha de su última verificación
- en: Measured 12 November 2026 at commit c6f9678d
  es: Medido el 12 de noviembre de 2026 en el commit c6f9678d
- en: Review and test programme - one pull request per bug class
  es: >-
    Programa de revisión y pruebas: un pull request por clase de error
- en: >-
    Test coverage measured on the release line, the recurring bug classes behind 317 fix pull
    requests since August, one sweep per class that closes it with a rule, and checks before a final
    release. A proposal by contributors; the maintainer decides what lands.
  es: >-
    La cobertura de pruebas medida en la rama de publicación, las clases de error recurrentes detrás
    de 317 pull requests de corrección desde agosto, un barrido por clase que la cierra con una
    regla y comprobaciones antes de una versión final. Una propuesta de colaboradores; el mantenedor
    decide qué se incorpora.
- en: >-
    The node software is open source, and anyone can send it a pull request on GitHub. The developer
    hub tells you, and the AI tool you work with, how to build, test and document a change so that
    it can be merged, and which work is open.
  es: >-
    El software del nodo es de código abierto y cualquiera puede enviarle un pull request en GitHub.
    El centro para desarrolladores te explica a ti, y a la herramienta de IA con la que trabajas,
    cómo compilar, probar y documentar un cambio para que pueda integrarse, y qué trabajo está
    abierto.
- en: The reference implementation and its own rules for agents.
  es: La implementación de referencia y sus propias reglas para agentes.
- en: >-
    Start on the developers page: where to begin, levels, test coverage and open lanes.
  es: >-
    Empieza por la página para desarrolladores: primeros pasos, niveles, cobertura de pruebas y
    tareas abiertas.
- en: Read the hub's front page, written for people.
  es: Lee la portada del centro, escrita para personas.
- en: >-
    Pick a level: what each one needs, and its first hour.
  es: >-
    Elige un nivel: qué necesita cada uno y su primera hora.
- en: Give your AI tool (Claude Code, Cursor, Codex or another) the agent file.
  es: Dale a tu herramienta de IA (Claude Code, Cursor, Codex u otra) el archivo para agentes.
- en: >-
    Learn the working method: generate, challenge, verify, then publish.
  es: >-
    Aprende el método de trabajo: generar, cuestionar, verificar y después publicar.
- en: Build and test on Linux, macOS or Windows; the coverage recipe is for Linux.
  es: Compila y prueba en Linux, macOS o Windows; la receta de cobertura es para Linux.
- en: >-
    Before you open a pull request upstream: the eight questions and the template.
  es: >-
    Antes de abrir un pull request upstream: las ocho preguntas y la plantilla.
- en: >-
    Claim a lane: put your GitHub handle in its owner line, by pull request.
  es: >-
    Asume una tarea: pon tu usuario de GitHub en su línea de responsable, con un pull request.
- en: >-
    Check your setup with the exam: twelve cases with known answers.
  es: >-
    Pon a prueba tu configuración con el examen: doce casos con respuestas conocidas.
- en: >-
    Generate, challenge, verify, then publish: assume the draft is wrong, check every claim against
    a primary source, and treat AI output as a lead until a command you ran reproduces it.
  es: >-
    Generar, cuestionar, verificar y después publicar: da por hecho que el borrador está mal,
    comprueba cada afirmación contra una fuente primaria y trata lo que produce la IA como una pista
    hasta que lo reproduzca un comando que hayas ejecutado tú.
- en: >-
    Fix a class, not one spot: every place in the code, plus the test, lint or CI job that keeps the
    class at zero.
  es: >-
    Corrige una clase de error, no un solo punto: cada lugar del código, más la prueba, la regla de
    lint o el trabajo de CI que mantiene la clase en cero.
- en: >-
    Tested fixes only: fails before, passes after, with commit, platform and command. Say what was
    not tested.
  es: >-
    Solo correcciones probadas: falla antes, pasa después, con commit, plataforma y comando. Di qué
    no se probó.
- en: >-
    Validation, fork choice, attestation and the MatMul frontier stay out of release-0.34.16
    (btxchain/btx #464 and the pull requests closed on the same day, 11 November 2026). Findings
    there go to the E-CONSENSUS lane as evidence, not as pull requests.
