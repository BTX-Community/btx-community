    pull requests into one batch. A fork with GitHub Actions and time every week.
  es: >-
    Ejecuta las comprobaciones de las que dependen los demás: CI en un fork, la validación de
    versiones y la recopilación de los pull requests de la semana en un solo lote. Un fork con
    GitHub Actions y tiempo cada semana.
