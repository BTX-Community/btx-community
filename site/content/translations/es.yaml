  es: La ventana de arranque y la recompensa de despliegue de 1.000.000 BTX
- en: >-
    The first question most newcomers ask, answered from chain data: what the first 50,000 blocks
    produced, under which consensus rules, and what public data can and cannot show.
  es: >-
    La primera pregunta de casi todos los recién llegados, respondida con datos de la cadena: qué
    produjeron los primeros 50.000 bloques, con qué reglas de consenso y qué pueden y qué no pueden
    mostrar los datos públicos.
