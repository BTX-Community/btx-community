              de: >-
                shielded_rpc_tests existiert, und wallet/shielded_rpc.cpp liegt über 50 abgedeckten
                Zeilen (Ziel hier festgelegt)
            - en: verification fuzz targets with cost limits
              de: Fuzz-Targets für die Verifikation mit Kostengrenzen
            - en: a disconnect-reconnect functional test
              de: ein Funktionstest mit Trennen und Wiederverbinden
            - en: >-
                the one lock-order inversion DEBUG_LOCKORDER reports fixed on the wallet side, with
