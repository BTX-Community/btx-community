            de: >-
              Die Netzwerkschnittstelle des ModelNet-Helpers: sein Request-Dispatcher, die nie
              gelaufenen Fuzz-Targets und das Gate, das sicherstellt, dass der ModelNet-Fuzz-Build
              linkt, security_v2, die Trennung in zwei Nutzer unter -modelrpcsocket und die Tests
