# Four principles: dev/plan/MASTER-PLAN.md section 0 items 9 and 10, dev/07-lanes.md sections 1 and 7.
principles:
  - id: classes
    title:
      en: Classes, not instances
      de: Klassen statt Einzelfälle
    text:
      en: >-
        One pull request per recurring bug class: the fix at every site a machine rule finds, plus
        the rule (a unit test, a lint or a CI job) that keeps the class at zero.
      de: >-
        Ein Pull Request pro wiederkehrender Fehlerklasse: die Korrektur an jeder Stelle, die eine
        maschinelle Regel findet, dazu die Regel (ein Unit-Test, eine Lint-Regel oder ein CI-Job),
        die die Klasse bei null hält.
  - id: measure
    title:
      en: Measure first, on the fork
      de: Erst messen, auf dem Fork
    text:
      en: >-
        Fork CI runs every class rule, and each pull request links its run: fails before, passes
        after. Every number carries its source and the commit it was measured on.
      de: >-
        Die Fork-CI führt jede Klassenregel aus, und jeder Pull Request verlinkt seinen Lauf:
        schlägt vorher fehl, besteht danach. Jede Zahl nennt ihre Quelle und den Commit, an dem sie
        gemessen wurde.
  - id: second-pass
    title: { en: An owner and a second pass, de: Verantwortung und Zweitprüfung }
    text:
      en: >-
        Each lane has one owner and one second-pass reviewer, never the same person. For a run lane,
        the second pass is an independent run on different hardware.
      de: >-
        Jeder Arbeitsbereich hat eine verantwortliche Person und eine zweite prüfende Person, nie
        dieselbe. Bei einem Bereich mit Prüfläufen ist die Zweitprüfung ein unabhängiger Lauf auf
        anderer Hardware.
  - id: done-bar
    title: { en: A done bar for every lane, de: Abschlusskriterien für jeden Bereich }
    text:
      en: >-
        Every lane has a measurable done bar. The programme is done when gates G2 (machines on), G3
        (parsers covered) and G4 (classes swept) hold; then the weekly batch shrinks to the ratchet.
      de: >-
        Jeder Arbeitsbereich hat messbare Abschlusskriterien. Das Programm ist fertig, wenn die
        Gates G2 (Maschinen laufen), G3 (Parser abgedeckt) und G4 (Klassen bereinigt) erfüllt sind;
        dann schrumpft das wöchentliche Paket auf den Ratchet.

