classes_text:
  en: >-
    A taxonomy of every fix pull request to btxchain/btx since 1 August: 317 fix PRs in 26 named
    classes, plus "other". Class assignments are 10-15% noisy. Site counts are on the live head;
    static and dynamic counts were measured at c6f9678d and are untriaged.
  de: >-
    Eine Einordnung jedes Fix-Pull-Requests an btxchain/btx seit dem 1. August: 317 Fix-PRs in 26
    benannten Klassen, dazu „Sonstige“. Die Zuordnung zu Klassen ist zu 10–15 % unscharf. Stellen
    sind am aktuellen Head gezählt; statische und dynamische Zahlen wurden an c6f9678d gemessen und
    sind nicht gesichtet.
classes_source: https://github.com/BTX-Community/btx-community/blob/main/dev/05-bug-classes.md
