            - en: >-
                under -modelrpcsocket the helper runs as a different user and cannot open .cookie or
                wallets/
              de: >-
                unter -modelrpcsocket läuft der Helper als anderer Nutzer und kann .cookie und
                wallets/ nicht öffnen
            - en: a malformed reply fails the request, not the helper
              de: eine fehlerhafte Antwort lässt die Anfrage scheitern, nicht den Helper
        - id: A-SHIELDED
          title: { en: Shielded pool integration, de: Einbindung des Shielded Pools }
          scope:
            en: >-
              Shielded pool integration, the shielded wallet RPC, note reservation (K12, with
              A-WALLET) and verification cost limits; deep review 3.5a. Proof soundness is for
