# The Developers page of btx-community.com (/dev/): the public plan of the developer hub in dev/ at
# the root of this repository. The hub is the source; this file is a copy of it, made by hand, so
# the site stays self-contained and the build never reads ../dev. Every number and every list that
# comes from the hub is compared with it by site/tests/test_build.py
# (test_the_developers_page_matches_the_hub), so a drift fails the check:
#
#   measured            dev/plan/plan-data.json measured_at (commit, date, live_head)
#   coverage.text       dev/01-state.md section 3, the "Coverage is measured again." line, and the
#   coverage.figures    four figures in it; only change them when the hub does
#   coverage.runs       dev/plan/MASTER-PLAN.md section 1.1, the unit and functional run sentences
#   coverage.areas      dev/plan/plan-data.json coverage.areas, in order
#   coverage.baselines  dev/plan/plan-data.json static
#   classes             dev/plan/plan-data.json classes, in order; lanes and security from the
#                       registry table in dev/05-bug-classes.md section 1; status from the start of
#                       sweep_status. No file, line or function of any result here: class and count
#                       only
#   lanes               dev/plan/lanes.json lanes (why, target, cadence, route, done bar, coverage,
#                       risk rank, runners); a group id is the lanes' "kind"; waiting = the lane is
#                       in no_work_until_claimed and has no pack. Scopes are written here, without
#                       file lists; every number, class and lane id in one is in the lane's scope in
#                       lanes.json. Owners are claimed in the hub, never named here
#   flow, week, sweep_rules  dev/plan/lanes.json flow, rhythm, rules 3-6; "who" from
#                       dev/07-lanes.md section 6
#   routes, escalation  the three routes of dev/07-lanes.md section 3 (PR, EVIDENCE, RUN) and the
#                       five escalation lines of its section 7 (lanes.json rules 7)
#   gates, phases       dev/plan/plan-data.json gates and phases; the phase of a CI job from the
#                       cadence of lane I-CI, the done bar from lanes.json rules 10 (also the gates
#                       the done-bar principle names)
#   never               dev/07-lanes.md section 8, without the code marks
#
# Written by hand from the hub, without a line-by-line comparison, so a change in the hub needs a
# change here: principles (dev/plan/MASTER-PLAN.md section 0, dev/07-lanes.md sections 1 and 7),
# start and levels (dev/README.md "Start by level" and "What to read first", dev/08-levels.md),
# brief.notes (dev/AGENTS.md section 1, dev/packs/README.md), rules (dev/README.md "Rules of the
# house", the same ten as dev/AGENTS.md section 4) and contribute (dev/README.md,
# dev/lessons/README.md, dev/exam/questions.md). The counts they name are checked all the same: the
# lanes that wait for an owner and the exits of the flow.
#
# brief.prompt is shown in English on every page (the files it points at are English); everything
# else is a text in English and German, as in community.yaml. Spanish, French and Chinese are in
# translations/<lang>.yaml.
# url: plain https URL into this repository on GitHub; the two brief links are raw URLs of dev/.

