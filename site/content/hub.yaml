            de: PR; Anchor-Fenster -> E-CONSENSUS
          coverage:
            unit: 71.8
            functional: 72.3
          risk_rank: 4
          waiting: true
          done_bar:
            - en: >-
                shielded_rpc_tests exists and wallet/shielded_rpc.cpp is above 50 lines covered
