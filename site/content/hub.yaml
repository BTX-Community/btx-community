            de: >-
              ModelNet auf Risikorang 3; security_v2 bei 0,2/15,0, 6 Dateien selbst mit
              Funktionstests bei 0; der Dispatcher hat kein Fuzz-Target
          target:
            en: >-
              dispatcher target 24 h clean; every security_v2 file above 0; listener and
