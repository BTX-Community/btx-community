lanes:
  source: https://github.com/BTX-Community/btx-community/blob/main/dev/07-lanes.md
  data: https://github.com/BTX-Community/btx-community/blob/main/dev/plan/lanes.json
  groups:
    - id: area
      title: { en: Area lanes, de: Code-Bereiche }
      text:
        en: >-
          One area of the code each. E-CONSENSUS prepares evidence and files a pull request only
          when the maintainer asks for one. A-NET, A-HELPER, A-SHIELDED, A-PQ and A-GUI have a scope
          and a done bar but no brief yet, and wait for an owner.
        de: >-
          Je ein Bereich des Codes. E-CONSENSUS sammelt Belege und stellt einen Pull Request nur,
          wenn der Maintainer darum bittet. A-NET, A-HELPER, A-SHIELDED, A-PQ und A-GUI haben Umfang
          und Abschlusskriterien, aber noch kein Briefing, und warten auf eine verantwortliche
          Person.
      lanes:
        - id: A-WALLET
          title:
            en: Wallet, RPC authorization, secrets
            de: Wallet, RPC-Berechtigungen, Geheimnisse
          scope:
            en: >-
              The wallet and its RPC calls (the shielded RPC belongs to A-SHIELDED) and
              wallet-facing RPC authorization; classes K05, K11/K12, K25 (wallet half) and K27; deep
              review 3.3 of the plan.
            de: >-
              Die Wallet und ihre RPC-Aufrufe (der Shielded-RPC gehört zu A-SHIELDED) sowie die
              Berechtigungen wallet-bezogener RPCs; die Klassen K05, K11/K12, K25 (Wallet-Hälfte)
              und K27; Tiefenprüfung 3.3 des Plans.
          why:
            en: >-
              wallet risk rank 4; 927 wallet functions never executed under unit+functional; K05
              chain of 4 PRs in 4 days
            de: >-
              Wallet auf Risikorang 4; 927 Wallet-Funktionen laufen in Unit- und Funktionstests nie;
              bei K05 eine Kette von 4 PRs in 4 Tagen
          target:
            en: >-
              wallet lines >= 70 (set here); K05/K11/K12 rules in ctest; restore-without-passphrase
              probe fails; no seed bytes after walletlock
            de: >-
              Wallet-Zeilen >= 70 (hier festgelegt); Regeln für K05/K11/K12 in ctest; die Probe
              „Wiederherstellen ohne Passphrase“ scheitert; keine Seed-Bytes nach walletlock
          cadence:
            en: one class per week from phase 2b; 3.3 review in phase 3
            de: ab Phase 2b eine Klasse pro Woche; Prüfung 3.3 in Phase 3
          route: pr
          route_text:
            en: PR to release-0.34.16 (Thursday batch)
            de: PR an release-0.34.16 (Donnerstagspaket)
          coverage:
            unit: 37.2
            functional: 50.5
          risk_rank: 4
          pack: https://github.com/BTX-Community/btx-community/blob/main/dev/packs/A-WALLET.md
          done_bar:
            - en: K05 test enumerating every wallet RPC against a locked wallet, registered in ctest
              de: >-
                K05-Test, der jeden Wallet-RPC gegen eine gesperrte Wallet prüft, in ctest
                registriert
            - en: K11 allowlist test per restricted-user RPC
              de: K11-Allowlist-Test für jeden RPC eingeschränkter Nutzer
            - en: K12 RAII reservation type plus a two-sender test
              de: K12-RAII-Reservierungstyp und ein Test mit zwei Sendern
            - en: K27 log-scan assertion in the functional runner
              de: K27-Prüfung per Log-Scan im Funktionstest-Runner
            - en: >-
                restore-without-passphrase probe fails; memory scan after walletlock shows no seed
                bytes
              de: >-
                die Probe „Wiederherstellen ohne Passphrase“ scheitert; ein Speicherscan nach
                walletlock zeigt keine Seed-Bytes
            - en: wallet lines from 50.5 to at least 70 (target set here)
              de: Wallet-Zeilen von 50,5 auf mindestens 70 (Ziel hier festgelegt)
            - en: each of the 927 unexecuted wallet functions tested or listed as dead
              de: >-
                jede der 927 nie ausgeführten Wallet-Funktionen getestet oder als toter Code
                gelistet
        - id: A-STORES
          title:
            en: ModelNet store, deposit and persistence logic
            de: Speicher, Einzahlungen und Persistenz von ModelNet
          scope:
            en: >-
              The ModelNet stores (helper, bounty, campaign, mandate, feed, catalog), the BCP/1
              deposit code and its planners, and persistence outside MatMul; classes K20/K21/K02 (52
              PRs); test generators, not instance fixes.
            de: >-
              Die ModelNet-Speicher (Helper, Bounty, Campaign, Mandate, Feed, Catalog), der
              BCP/1-Einzahlungscode mit seinen Planern und die Persistenz außerhalb von MatMul; die
              Klassen K20/K21/K02 (52 PRs); Testgeneratoren statt Einzelkorrekturen.
          why:
            en: >-
              modelnet risk rank 3; helper.cpp touched by 42 fix PRs; more single fixes landed on 12
              Nov; logic slips hide behind high line coverage
            de: >-
              ModelNet auf Risikorang 3; helper.cpp von 42 Fix-PRs berührt; am 12. Nov. kamen
              weitere Einzelkorrekturen hinzu; Logikfehler verstecken sich hinter hoher
              Zeilenabdeckung
          target:
            en: >-
              property tests per store and a BCP/1 lifecycle table in ctest; helper.cpp split
              proposed; 0 new single-site K20/K21 PRs
            de: >-
              Property-Tests je Speicher und eine BCP/1-Lebenszyklustabelle in ctest; Aufteilung von
              helper.cpp vorgeschlagen; 0 neue K20/K21-PRs für Einzelstellen
          cadence: { en: one store per week from phase 2b, de: ab Phase 2b ein Speicher pro Woche }
          route: pr
          route_text:
            en: PR to release-0.34.16 (Thursday batch)
            de: PR an release-0.34.16 (Donnerstagspaket)
          coverage:
            unit: 83.7
            functional: 85.6
          risk_rank: 3
          pack: https://github.com/BTX-Community/btx-community/blob/main/dev/packs/A-STORES.md
          done_bar:
            - en: >-
                property tests per store (idempotency keys, pagination completeness, monotonic
                counters, restart = no restart) in ctest
              de: >-
                Property-Tests je Speicher (Idempotenzschlüssel, vollständige Paginierung, monotone
                Zähler, Neustart = kein Neustart) in ctest
            - en: >-
                one table-driven BCP/1 lifecycle test (new, mempool, confirmed, replaced, spent,
                consolidated) through every reporting RPC
              de: >-
                ein tabellengesteuerter BCP/1-Lebenszyklustest (neu, Mempool, bestätigt, ersetzt,
                ausgegeben, konsolidiert) über jeden berichtenden RPC
            - en: mutate -> reopen -> compare test per store
              de: Test „ändern -> neu öffnen -> vergleichen“ je Speicher
            - en: helper.cpp split proposed to the maintainer with the tests in hand
              de: Aufteilung von helper.cpp dem Maintainer vorgeschlagen, mit den Tests in der Hand
            - en: 0 new single-site K20/K21 PRs after the generators land
              de: 0 neue K20/K21-PRs für Einzelstellen, sobald die Generatoren übernommen sind
        - id: E-CONSENSUS
          title:
            en: Consensus, fork choice, attestation, MatMul frontier (evidence only)
            de: Konsens, Fork-Wahl, Attestierung, MatMul-Frontier (nur Belege)
          scope:
            en: >-
              Validation, proof of work, the consensus rules, the script interpreter, fork choice
              and download scheduling, the MatMul attestation rules and the MatMul code; classes K13
              and K14; deep reviews 3.1, 3.2b, 3.5b and the rules of 3.6; the #464 list.
            de: >-
              Validierung, Proof of Work, die Konsensregeln, der Script-Interpreter, Fork-Wahl und
              Download-Planung, die Regeln der MatMul-Attestierung und der MatMul-Code; die Klassen
              K13 und K14; die Tiefenprüfungen 3.1, 3.2b, 3.5b und die Regeln aus 3.6; die Liste in
              #464.
          why:
            en: >-
              net/p2p risk rank 1, validation rank 2; net_processing.cpp 113 fix commits,
              validation.cpp 63, matmul_trusted_attestations.h 50; 68 consensus functions never
              executed; frozen for 0.34.16 by #464, so only evidence lands
            de: >-
              net/p2p auf Risikorang 1, Validierung auf Rang 2; net_processing.cpp 113 Fix-Commits,
              validation.cpp 63, matmul_trusted_attestations.h 50; 68 Konsensfunktionen laufen nie;
              für 0.34.16 durch #464 eingefroren, daher kommen nur Belege an
          target:
            en: >-
              a #464 evidence list: one measured result + one ready test + one paragraph per item; 0
              re-filed PRs that were not taken
            de: >-
              eine Belegliste für #464: je Punkt ein gemessenes Ergebnis + ein fertiger Test + ein
              Absatz; 0 erneut eingereichte PRs, die nicht übernommen wurden
          cadence:
            en: with the Thursday batch, only when a complete item exists; at most one short note
            de: >-
              mit dem Donnerstagspaket, nur wenn ein vollständiger Punkt vorliegt; höchstens eine
              kurze Notiz
          route: evidence
          route_text:
            en: "EVIDENCE on #464; a PR only if the maintainer asks"
            de: "BELEG in #464; ein PR nur auf Bitte des Maintainers"
          coverage:
            unit: 24.6
            functional: 62.3
          risk_rank: 1
          pack: https://github.com/BTX-Community/btx-community/blob/main/dev/packs/E-CONSENSUS.md
          done_bar:
            - en: >-
                #464 evidence list with one measured result, one ready test and one paragraph per
                item
              de: >-
                Belegliste für #464 mit je Punkt einem gemessenen Ergebnis, einem fertigen Test und
                einem Absatz
            - en: >-
                K13 attestation state machine as one model-based test (vote, withdraw, restart,
                reorg, missing index)
              de: >-
                K13-Zustandsautomat der Attestierung als ein modellbasierter Test (Stimme,
                Rücknahme, Neustart, Reorg, fehlender Index)
            - en: >-
                K14 download state machine as a deterministic simulation with an adversarial
                scheduler ('every announced body is requested within N ticks')
              de: >-
                K14-Zustandsautomat des Downloads als deterministische Simulation mit feindlichem
                Scheduler („jeder angekündigte Blockinhalt wird innerhalb von N Ticks angefordert“)
            - en: 68 unexecuted consensus functions listed as tested or dead
              de: 68 nie ausgeführte Konsensfunktionen als getestet oder tot gelistet
            - en: byte-diff proof of block validity between main and the release line
              de: Byte-Diff-Nachweis der Blockgültigkeit zwischen main und der Release-Linie
            - en: >-
                net_processing and validation thread-safety warnings delivered as a measured result
              de: >-
                Thread-Safety-Warnungen in net_processing und validation als gemessenes Ergebnis
                geliefert
            - en: 0 re-filed PRs that were not taken
              de: 0 erneut eingereichte PRs, die nicht übernommen wurden
        - id: A-NET
          title:
            en: Non-consensus P2P bounds and parsers
            de: P2P-Grenzen und Parser außerhalb des Konsenses
          scope:
            en: >-
              Peer-to-peer code outside fork choice and scheduling: networking, the address manager
              and the message parsers; fuzz targets for the five message types that have none and
              for the hybrid handshake; Dandelion stem limits; K09 (peer half) and, with A-WALLET,
              the K25 observing-peer test.
            de: >-
              P2P-Code außerhalb von Fork-Wahl und Download-Planung: Netzwerk, Adressverwaltung und
              Nachrichten-Parser; Fuzz-Targets für die fünf Nachrichtentypen, die keines haben, und
              für den hybriden Handshake; Grenzen des Dandelion-Stems; K09 (Peer-Hälfte) und, mit
              A-WALLET, der K25-Test mit beobachtendem Peer.
          why:
            en: >-
              net/p2p risk rank 1; gate G3 at 1 of about 13 parser targets; no container inventory
              exists
            de: >-
              net/p2p auf Risikorang 1; Gate G3 bei 1 von etwa 13 Parser-Targets; es gibt keine
              Bestandsaufnahme der Container
          target:
            en: >-
              bounds table complete; 6 targets run 24 h clean under ASan; net_processing.cpp >= 75
              lines with functional tests (set here)
            de: >-
              Grenzentabelle vollständig; 6 Targets laufen 24 h fehlerfrei unter ASan;
              net_processing.cpp >= 75 Zeilen mit Funktionstests (hier festgelegt)
          cadence:
            en: none until owned; the phase-3 fuzz batch produces the targets only
            de: >-
              keine, bis jemand den Bereich übernimmt; das Fuzz-Paket aus Phase 3 liefert nur die
              Targets
          route: pr
          route_text:
            en: PR for bounds and targets; scheduling or fork choice -> E-CONSENSUS
            de: PR für Grenzen und Targets; Download-Planung oder Fork-Wahl -> E-CONSENSUS
          coverage:
            unit: 50.4
            functional: 75.5
          risk_rank: 1
          waiting: true
          done_bar:
            - en: >-
                every peer-fed container in doc/resource-bounds.md with a bound, an eviction and a
                unit test
              de: >-
                jeder von Peers gefüllte Container in doc/resource-bounds.md mit Grenze, Verdrängung
                und Unit-Test
            - en: >-
                DLTX, chunks, mmsketch, mdpeers, mmatrefute and hybrid-handshake targets link and
                run 24 h clean under ASan
              de: >-
                die Targets für DLTX, Chunks, mmsketch, mdpeers, mmatrefute und den hybriden
                Handshake linken und laufen 24 h fehlerfrei unter ASan
            - en: K25 observing-peer test in the functional runner
              de: K25-Test mit beobachtendem Peer im Funktionstest-Runner
            - en: >-
                net_processing.cpp at or above 75 lines with functional tests through non-consensus
                tests (target set here)
              de: >-
                net_processing.cpp bei mindestens 75 Zeilen mit Funktionstests, erreicht durch Tests
                außerhalb des Konsenses (Ziel hier festgelegt)
        - id: A-HELPER
          title:
            en: ModelNet helper network surface and security_v2
            de: Netzwerkschnittstelle des ModelNet-Helpers und security_v2
          scope:
            en: >-
              The ModelNet helper's network surface: its request dispatcher, the fuzz targets that
              never ran and the gate that makes the modelnet fuzz build link, security_v2, the
              two-user layout under -modelrpcsocket and the jail escape suite; K09 (helper half) and
