          route: pr
          route_text:
            en: PR; the helper user default is the maintainer's decision (release-scope note)
            de: >-
              PR; der Standardnutzer des Helpers ist die Entscheidung des Maintainers (Hinweis zum
              Release-Umfang)
          coverage:
            unit: 0.2
            functional: 15.0
          risk_rank: 3
          waiting: true
          done_bar:
            - en: modelnet_native_dispatch target runs 24 h clean under ASan
              de: das Target modelnet_native_dispatch läuft 24 h fehlerfrei unter ASan
            - en: the never-run targets run 1 h clean
              de: die nie gelaufenen Targets laufen 1 h fehlerfrei
            - en: every security_v2 file above 0 lines covered
              de: jede security_v2-Datei mit mehr als 0 abgedeckten Zeilen
            - en: >-
                functional test: no non-loopback listener on 29447 without -modelbind; no NAT-PMP
