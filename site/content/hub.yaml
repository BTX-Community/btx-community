        de: Fork-CI-Branch auf 4c7840e9 mit Lint, clang-tidy-diff und cppcheck
      - en: "rule-only PRs: K10 test, K04 lint"
        de: "PRs nur mit der Regel: K10-Test, K04-Lint"
      - en: "K15: 28 casts + 5 single results"
        de: "K15: 28 Casts + 5 einzelne Ergebnisse"
      - en: K01 worklist and lint to the portability lane
        de: K01-Arbeitsliste und Lint-Regel an den Portabilitätsbereich
      - en: functional-failure triage
        de: Sichtung der fehlgeschlagenen Funktionstests
  - id: 2b
    name: { en: The sweeps, de: Die Durchgänge }
    window:
      en: 15-21 Nov
      de: 15.–21. Nov.
    deliverables:
      - en: K05, K08, K03 + annotations
        de: K05, K08, K03 + Annotationen
      - en: fs-trust policy
        de: fs-trust-Richtlinie
      - en: K16, K17, K19 lints
        de: Lint-Regeln für K16, K17, K19
      - en: K22 release gate
        de: K22-Release-Gate
      - en: K11, K12, K07, K25, K27 (counted first)
        de: K11, K12, K07, K25, K27 (zuerst gezählt)
      - en: coverage ratchet and ASan job
        de: Coverage-Ratchet und ASan-Job
  - id: "3"
