            en: RUN report; findings to the registry, then to the class owner or E-CONSENSUS
            de: >-
              LAUF-Bericht; Befunde ins Register, dann an die für die Klasse verantwortliche Person
              oder an E-CONSENSUS
          pack: https://github.com/BTX-Community/btx-community/blob/main/dev/packs/I-OPS.md
          done_bar:
            - en: the safe profile in the community guide and the status page
              de: das sichere Profil im Community-Leitfaden und auf der Statusseite
            - en: >-
                a genesis sync with assumevalid=0 on a stock binary that reaches the tip, reported
                with the height
              de: >-
                eine Synchronisation ab Genesis mit assumevalid=0 auf einer unveränderten
                Binärdatei, die die Kettenspitze (Tip) erreicht, gemeldet mit der Höhe
            - en: an upgrade from a saved datadir on every candidate
              de: ein Upgrade aus einem gesicherten Datenverzeichnis bei jedem Kandidaten
            - en: one interop run per candidate
              de: ein Interop-Lauf je Kandidat
            - en: UTC timelines on every report
              de: UTC-Zeitleisten in jedem Bericht
        - id: I-XDEV
          title: { en: MatMul cross-backend corpus, de: Backend-übergreifendes MatMul-Korpus }
          scope:
            en: >-
              One mutated-block corpus replayed on CPU, CUDA and Metal, one script and one verdict
              table; the test half of deep review 3.6.
            de: >-
              Ein Korpus veränderter Blöcke, abgespielt auf CPU, CUDA und Metal, ein Skript und eine
              Ergebnistabelle; die Testhälfte der Tiefenprüfung 3.6.
          why:
            en: >-
              matmul 62.6/62.7 with 47 suites unmeasured; a CPU/CUDA corpus run exists; Metal never
              run; a backend disagreement is a consensus split
            de: >-
              MatMul bei 62,6/62,7, 47 Suites ungemessen; ein Korpuslauf auf CPU/CUDA existiert;
              Metal lief nie; eine Abweichung zwischen Backends ist eine Konsensspaltung
          target:
            en: a verdict table with one row per (block, backend), no disagreement, a Metal row
            de: >-
              eine Ergebnistabelle mit einer Zeile pro (Block, Backend), ohne Abweichung, mit einer
              Zeile für Metal
          cadence:
            en: once per candidate, and once after any matmul change lands
            de: einmal je Kandidat und einmal nach jeder übernommenen MatMul-Änderung
          route: run
          route_text:
            en: RUN report; disagreements -> EVIDENCE
            de: LAUF-Bericht; Abweichungen -> BELEG
          coverage:
            unit: 62.6
            functional: 62.7
          risk_rank: 9
          pack: https://github.com/BTX-Community/btx-community/blob/main/dev/packs/I-XDEV.md
          done_bar:
            - en: corpus and script in the repo
              de: Korpus und Skript im Repository
            - en: one row per (block, backend) with no disagreement
              de: eine Zeile pro (Block, Backend) ohne Abweichung
            - en: a Metal row exists
              de: es gibt eine Zeile für Metal
            - en: every disagreement filed as EVIDENCE within the week
              de: jede Abweichung innerhalb der Woche als BELEG eingereicht

# How a finding moves (exit: the step can end the path early), the routes and escalation from
# dev/07-lanes.md section 7.
flow:
  - text: { en: found, de: gefunden }
  - text:
      en: class check against doc/bug-classes.md (add a class if new)
      de: >-
        Klassenprüfung gegen doc/bug-classes.md (neue Klasse ergänzen, falls es sie noch nicht gibt)
  - text:
      en: >-
        if the class touches validation, fork choice, attestation or the MatMul frontier ->
        E-CONSENSUS evidence; stop here
      de: >-
        berührt die Klasse Validierung, Fork-Wahl, Attestierung oder die MatMul-Frontier -> Beleg
        für E-CONSENSUS; hier endet der Weg
    exit: true
  - text:
      en: "count sites on the live head (under 3 real sites: file the rule alone)"
      de: "Stellen am aktuellen Head zählen (unter 3 echten Stellen: nur die Regel einreichen)"
    exit: true
  - text:
      en: sweep every site + write the rule (test, lint or CI job)
      de: jede Stelle beheben + die Regel schreiben (Test, Lint-Regel oder CI-Job)
  - text:
      en: "PR with the fork CI link: fails before, passes after"
      de: "PR mit dem Link zum Fork-CI-Lauf: schlägt vorher fehl, besteht danach"
  - text:
      en: second pass by the lane's reviewer (Wednesday)
      de: Zweitprüfung durch die prüfende Person des Bereichs (Mittwoch)
  - text: { en: Thursday batch to the maintainer, de: Donnerstagspaket an den Maintainer }
  - text:
      en: merged -> board card moved -> baseline shrinks
      de: übernommen -> Board-Karte verschoben -> Baseline schrumpft
routes:
  - id: pr
    title: { en: Pull request, de: Pull Request }
    text:
      en: >-
        A normal pull request to release-0.34.16, sent in the Thursday batch with its fork CI run:
        fails before, passes after.
      de: >-
        Ein normaler Pull Request an release-0.34.16, verschickt im Donnerstagspaket mit seinem
        Fork-CI-Lauf: schlägt vorher fehl, besteht danach.
  - id: evidence
    title: { en: Evidence, de: Beleg }
    text:
      en: >-
        For validation, fork choice, attestation and the MatMul frontier: one measured result, one
        ready test and one paragraph on #464. A pull request only if the maintainer asks for one.
      de: >-
        Für Validierung, Fork-Wahl, Attestierung und die MatMul-Frontier: ein gemessenes Ergebnis,
        ein fertiger Test und ein Absatz in #464. Ein Pull Request nur, wenn der Maintainer darum
        bittet.
  - id: run
    title: { en: Run report, de: Laufbericht }
    text:
      en: >-
        One script on one machine prints one result line, which the runner pastes unchanged, plus
        one line that says what was not tested.
      de: >-
        Ein Skript auf einem Rechner gibt eine Ergebniszeile aus, die der Runner unverändert
        einfügt, dazu eine Zeile, die sagt, was nicht getestet wurde.
escalation:
  - en: >-
      Gate red (a baseline grew, a known-failing list grew): the lane stops new work and fixes the
      gate first.
    de: >-
      Gate rot (eine Baseline ist gewachsen, eine Liste bekannter Fehlschläge ist gewachsen): Der
      Bereich nimmt keine neue Arbeit an und repariert zuerst das Gate.
  - en: >-
      A pull request the maintainer closed without taking it is never re-filed; it becomes an
      evidence item or is dropped.
    de: >-
      Ein Pull Request, den der Maintainer geschlossen hat, ohne ihn zu übernehmen, wird nie erneut
      eingereicht; er wird ein Beleg oder fällt weg.
  - en: >-
      Owner and second pass disagree: the batch coordinator decides what goes into the batch, and
      the question goes into the Thursday batch as one line if the maintainer's view is needed.
    de: >-
      Verantwortliche Person und Zweitprüfung sind uneins: Die Koordination des Pakets entscheidet,
      was hineinkommt, und die Frage geht als eine Zeile ins Donnerstagspaket, wenn die Sicht des
      Maintainers gebraucht wird.
  - en: >-
      A security-relevant finding goes through GitHub private vulnerability reporting on
      btxchain/btx, never into a public issue or a chat; the class goes on the registry without the
      detail.
    de: >-
      Ein sicherheitsrelevanter Befund geht über die private Sicherheitsmeldung von GitHub (Private
      Vulnerability Reporting) an btxchain/btx, nie in ein öffentliches Issue oder einen Chat; die
      Klasse kommt ohne Einzelheiten ins Register.
  - en: >-
      A runner cannot reproduce a stated test: the pull request waits, and the owner, not the
      runner, investigates.
    de: >-
      Ein Runner kann einen angegebenen Test nicht reproduzieren: Der Pull Request wartet, und die
      verantwortliche Person, nicht der Runner, geht der Sache nach.
flow_source: https://github.com/BTX-Community/btx-community/blob/main/dev/07-lanes.md
