      - en: Thursday batch
        de: Donnerstagspaket
      - en: "#464 evidence list"
        de: "Belegliste für #464"
      - en: external-review scope
        de: Umfang der externen Prüfung
week:
  - id: monday
    what:
      en: each lane picks one class or item from the board; owners post the plan line on their card
      de: >-
        jeder Bereich wählt eine Klasse oder einen Punkt vom Board; die Verantwortlichen schreiben
        die Planzeile auf ihre Karte
    who: { en: owners, de: Verantwortliche }
  - id: tuesday_wednesday
    what:
      en: sweep, rule, fork CI run; second passes on Wednesday
      de: Durchgang, Regel, Fork-CI-Lauf; Zweitprüfungen am Mittwoch
    who:
      en: owners, second pass
      de: Verantwortliche, Zweitprüfung
  - id: thursday
    what:
      en: >-
        one batch to the maintainer (PRs with run links); an evidence note on #464 only when a
        complete item exists; one operator line (batch coordinator)
      de: >-
        ein Paket an den Maintainer (PRs mit Links zu den Läufen); eine Belegnotiz in #464 nur, wenn
        ein vollständiger Punkt vorliegt; eine Zeile für die Betreiber (Koordination des Pakets)
    who: { en: batch coordinator, de: Koordination des Pakets }
  - id: friday
    what:
      en: board updated; baselines rechecked; I-RC verify lines in (batch coordinator, runners)
      de: >-
        Board aktualisiert; Baselines erneut geprüft; Prüfzeilen für I-RC eingegangen (Koordination
        des Pakets, Runner)
    who:
      en: batch coordinator, runners
      de: Koordination des Pakets, Runner
rhythm_source: https://github.com/BTX-Community/btx-community/blob/main/dev/07-lanes.md

rules:
  - en: >-
      Generate, challenge, verify, then publish: assume the draft is wrong, check every claim
      against a primary source, and treat AI output as a lead until a command you ran reproduces it.
    de: >-
      Entwerfen, anzweifeln, prüfen, dann veröffentlichen: den Entwurf für falsch halten, jede
      Aussage an der Primärquelle prüfen und Ergebnisse einer KI als Hinweis behandeln, bis ein
      selbst ausgeführter Befehl sie bestätigt.
  - en: >-
      Fix a class, not one spot: every place in the code, plus the test, lint or CI job that keeps
      the class at zero.
    de: >-
      Eine Fehlerklasse beheben, nicht eine Stelle: jede Stelle im Code, dazu der Test, die
      Lint-Regel oder der CI-Job, der die Klasse bei null hält.
  - en: >-
      Tested fixes only: fails before, passes after, with commit, platform and command. Say what was
      not tested.
    de: >-
      Nur getestete Korrekturen: Der Test schlägt vorher fehl und besteht danach, mit Commit,
      Plattform und Befehl. Sagen, was nicht getestet wurde.
  - en: >-
      Validation, fork choice, attestation and the MatMul frontier stay out of release-0.34.16
      (btxchain/btx #464 and the pull requests closed on the same day, 11 November 2026). Findings
      there go to the E-CONSENSUS lane as evidence, not as pull requests.
    de: >-
      Validierung, Fork-Wahl, Attestierung und die MatMul-Frontier bleiben aus release-0.34.16
      heraus (btxchain/btx #464 und die am selben Tag geschlossenen Pull Requests, 11. November
      2026). Befunde dort gehen als Belege an den Bereich E-CONSENSUS, nicht als Pull Requests.
  - en: >-
      A second person who is not the author reviews before anything goes upstream. Lanes send their
      pull requests together once a week, so the maintainer gets one batch, not a stream.
    de: >-
      Eine zweite Person, nicht der Autor, prüft, bevor etwas upstream geht. Die Arbeitsbereiche
      reichen ihre Pull Requests einmal pro Woche gesammelt ein, damit der Maintainer ein Paket
      bekommt statt eines ständigen Stroms.
  - en: >-
      The AI never posts, pushes or opens a pull request. You do, after reading the full text and
      the full diff.
    de: >-
      Die KI postet nichts, pusht nichts und öffnet keinen Pull Request. Das tust du, nachdem du den
      ganzen Text und den ganzen Diff gelesen hast.
  - en: >-
      No secrets anywhere: no keys, wallets, RPC cookies or tokens on a test machine, in a log, a
      commit or a prompt.
    de: >-
      Keine Geheimnisse, nirgends: keine Schlüssel, Wallets, RPC-Cookies oder Tokens auf einem
      Testrechner, in einem Log, einem Commit oder einem Prompt.
never:
  - en: >-
      Never post, comment, push or open a PR on its own. The owner reads the full text and the diff
      first.
    de: >-
      Nie selbst posten, kommentieren, pushen oder einen PR öffnen. Die verantwortliche Person liest
      zuerst den ganzen Text und den Diff.
  - en: >-
      Never open a PR into release-0.34.16 that touches validation.cpp, pow.cpp, src/consensus/,
      script/interpreter.cpp, fork choice or download scheduling in net_processing.cpp,
      node/matmul_trusted_attestations.* rules, or src/matmul/. Those go to E-CONSENSUS.
    de: >-
      Nie einen PR an release-0.34.16 öffnen, der validation.cpp, pow.cpp, src/consensus/,
      script/interpreter.cpp, die Fork-Wahl oder die Download-Planung in net_processing.cpp, die
      Regeln in node/matmul_trusted_attestations.* oder src/matmul/ berührt. Das geht an
      E-CONSENSUS.
  - en: >-
      Never file a single-site fix for a class in the registry. Count the class on the live head;
      sweep it; add the rule.
    de: >-
      Nie eine Korrektur für eine einzelne Stelle einreichen, wenn ihre Klasse im Register steht.
      Die Klasse am aktuellen Head zählen, alle Stellen beheben, die Regel ergänzen.
  - en: Never put a fix in a commit linked from a comment. Follow-ups are PRs.
    de: >-
      Nie eine Korrektur in einen Commit legen, der nur aus einem Kommentar verlinkt ist. Nachträge
      sind PRs.
  - en: >-
      Never claim a test ran without the run link or log, the commit SHA and the platform. "Fails
      before, passes after" or nothing.
    de: >-
      Nie behaupten, ein Test sei gelaufen, ohne Link zum Lauf oder Log, Commit-SHA und Plattform.
      „Schlägt vorher fehl, besteht danach“ oder gar nichts.
  - en: >-
      Never add a stub, a fail-closed workaround, a skipped test or a widened timeout to make a job
      green.
    de: >-
      Nie einen Stub, einen Fail-closed-Workaround, einen übersprungenen Test oder ein verlängertes
      Timeout einbauen, um einen Job grün zu bekommen.
  - en: >-
      Never stop a node with kill -9. Stop any keeper or watchdog first, back up the datadir, then
      stop the node cleanly.
    de: >-
      Nie eine Node mit kill -9 beenden. Zuerst jeden Keeper oder Watchdog stoppen, das
      Datenverzeichnis sichern, dann die Node sauber beenden.
  - en: >-
      Never re-run a baseline tool that already ran; reuse the C1-C3 results (the numbers in
      plan/plan-data.json) and re-grep only the live head.
    de: >-
      Nie ein Baseline-Werkzeug erneut laufen lassen, das schon lief; die Ergebnisse aus C1-C3
      wiederverwenden (die Zahlen in plan/plan-data.json) und nur den aktuellen Head neu
      durchsuchen.
  - en: >-
      Never hold keys, wallet files, RPC cookies or tokens on a test or runner box; never test on
      the machine that holds a wallet.
    de: >-
      Nie Schlüssel, Wallet-Dateien, RPC-Cookies oder Tokens auf einem Test- oder Runner-Rechner
      halten; nie auf dem Rechner testen, der eine Wallet hält.
  - en: >-
      Never quote private chats, name people other than by handle, or state a figure without its
      source.
    de: >-
      Nie private Chats zitieren, Personen anders als mit ihrem Handle nennen oder eine Zahl ohne
      Quelle angeben.
sweep_rules:
  - en: >-
      Sweep rule (a): a 'not counted' class is counted on the live head first; under 3 real sites,
      the rule alone
    de: >-
      Durchgangsregel (a): Eine „nicht gezählte“ Klasse wird zuerst am aktuellen Head gezählt; bei
      weniger als 3 echten Stellen nur die Regel
  - en: >-
      Sweep rule (b): a sweep PR changes nothing beyond its class; anything else it finds goes to
      the lane worklist or its own PR
    de: >-
      Durchgangsregel (b): Ein Durchgangs-PR ändert nichts außerhalb seiner Klasse; alles andere,
      was er findet, kommt auf die Arbeitsliste des Bereichs oder in einen eigenen PR
  - en: >-
      Sweep rule (c): no sweep touches validation.cpp, pow.cpp, src/consensus/,
      script/interpreter.cpp, fork choice or src/matmul/; hits go to E-CONSENSUS
    de: >-
      Durchgangsregel (c): Kein Durchgang berührt validation.cpp, pow.cpp, src/consensus/,
      script/interpreter.cpp, die Fork-Wahl oder src/matmul/; Treffer gehen an E-CONSENSUS
  - en: >-
      Hot files (net_processing.cpp, modelnet/helper.cpp, node/matmul_trusted_attestations.*): no
      per-event PR without a model-based test or a split proposal first
    de: >-
      Heiße Dateien (net_processing.cpp, modelnet/helper.cpp, node/matmul_trusted_attestations.*):
      kein PR pro Einzelereignis ohne vorherigen modellbasierten Test oder Vorschlag zur Aufteilung
method_source: https://github.com/BTX-Community/btx-community/blob/main/dev/02-method.md
guardrails_source: https://github.com/BTX-Community/btx-community/blob/main/dev/03-guardrails.md

# Claim a lane, file a lesson, take the exam: dev/README.md, dev/lessons/README.md,
# dev/exam/questions.md.
contribute:
  - id: claim
    title: { en: Claim a lane, de: Einen Arbeitsbereich übernehmen }
    text:
      en: >-
        Every lane is claimable, including the five that wait for an owner. A claim is a small pull
        request to this repository.
      de: >-
        Jeder Arbeitsbereich kann übernommen werden, auch die fünf, die auf eine verantwortliche
        Person warten. Eine Übernahme ist ein kleiner Pull Request an dieses Repository.
    steps:
      - text:
          en: "Pick a lane in 07-lanes.md: its scope, why, done bar and first tasks."
          de: >-
            Einen Bereich in 07-lanes.md wählen: Umfang, Begründung, Abschlusskriterien und erste
            Aufgaben.
      - text:
          en: >-
            Open a pull request that puts your GitHub handle in the lane's Owner line in 07-lanes.md
            and in owner.handle in plan/lanes.json.
          de: >-
            Einen Pull Request öffnen, der deinen GitHub-Namen in die Owner-Zeile des Bereichs in
            07-lanes.md und in owner.handle in plan/lanes.json einträgt.
      - text:
          en: A second pass goes in second_pass.handle. The second pass is never the owner.
          de: >-
            Die Zweitprüfung kommt in second_pass.handle. Die Zweitprüfung ist nie die
            verantwortliche Person.
      - text:
          en: >-
            One approving review from a /dev/ code owner merges it. If git is in your way, ask, and
            someone enters it for you.
          de: >-
            Eine zustimmende Review einer für /dev/ zuständigen Person (Code Owner) führt ihn
            zusammen. Wenn dir git im Weg ist, frag, und jemand trägt es für dich ein.
    url: https://github.com/BTX-Community/btx-community/blob/main/dev/07-lanes.md
  - id: lesson
    title: { en: File a lesson, de: Eine Lektion festhalten }
    text:
      en: >-
        Something in the hub was wrong, missing or cost you an evening? That is a lesson: a one-page
        record of a trap, so nobody pays for it twice.
      de: >-
        Etwas im Hub war falsch, fehlte oder hat dich einen Abend gekostet? Das ist eine Lektion:
        eine Seite über eine Falle, damit niemand zweimal dafür zahlt.
    steps:
      - text:
          en: Copy the template in lessons/README.md to lessons/YYYY-MM-DD-slug.md.
          de: Die Vorlage aus lessons/README.md nach lessons/YYYY-MM-DD-slug.md kopieren.
      - text:
          en: >-
            Fill in what happened, what was done, the rule now, the source, how it was verified
            (command, commit, platform) and which hub pages change.
          de: >-
            Ausfüllen: was passiert ist, was getan wurde, die Regel ab jetzt, die Quelle, wie es
            geprüft wurde (Befehl, Commit, Plattform) und welche Seiten des Hubs sich ändern.
      - text:
          en: Open a pull request. Your AI may draft it; you open it.
          de: Einen Pull Request öffnen. Deine KI darf ihn entwerfen; öffnen tust du ihn.
      - text:
          en: >-
            One approving review from a /dev/ code owner merges it; the owner of each affected page
            folds the rule in within a week.
          de: >-
            Eine zustimmende Review einer für /dev/ zuständigen Person führt ihn zusammen; wer für
            eine betroffene Seite zuständig ist, arbeitet die Regel innerhalb einer Woche ein.
    url: https://github.com/BTX-Community/btx-community/blob/main/dev/lessons/README.md
  - id: exam
    title: { en: Take the exam, de: Die Prüfung ablegen }
    text:
      en: >-
        Twelve cases with known answers, from public pull requests and the rules of the hub. Passing
        it, 11 of 12 with sources, is half of moving up a level.
      de: >-
        Zwölf Fälle mit bekannten Antworten, aus öffentlichen Pull Requests und den Regeln des Hubs.
        Sie zu bestehen, 11 von 12 mit Quellen, ist die Hälfte des Aufstiegs zur nächsten Stufe.
    steps:
      - text:
          en: >-
            Give the questions to the person or the AI session being checked, in a clone without
            exam/answers.md, so the key is never in its context.
          de: >-
            Die Fragen der Person oder KI-Sitzung geben, die geprüft wird, in einem Klon ohne
            exam/answers.md, damit der Schlüssel nie in ihrem Kontext ist.
      - text:
          en: "Answer every question in the fixed shape: verdict, why, sources."
          de: "Jede Frage in der festen Form beantworten: Urteil, Begründung, Quellen."
      - text:
          en: Grade in a separate session or by hand, with the key.
          de: In einer getrennten Sitzung oder von Hand mit dem Schlüssel bewerten.
      - text:
          en: >-
            A question counts when the verdict matches and at least one cited source is one the key
            names; 11 of 12 pass.
          de: >-
            Eine Frage zählt, wenn das Urteil stimmt und mindestens eine genannte Quelle eine des
            Schlüssels ist; 11 von 12 bestehen.
    url: https://github.com/BTX-Community/btx-community/blob/main/dev/exam/questions.md
