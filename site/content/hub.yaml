            - en: anchor-window item (#317/#461) filed as EVIDENCE
              de: der Punkt zum Anchor-Fenster (#317/#461) als BELEG eingereicht
        - id: A-PQ
          title: { en: Post-quantum crypto use, de: Einsatz der Post-Quanten-Kryptografie }
          scope:
            en: >-
              Every verify call site for ML-DSA-44, SLH-DSA and the P2MR evaluation, sigop
              accounting for post-quantum signatures, the ML-KEM transport and the build flags for
