# The fast lane: BTX in a nutshell for newcomers. Draft, English only, reachable at /fast-lane/
# but linked from nowhere and marked noindex until it has been reviewed.
# Facts only, one or two sentences each, every fact with a source a reader can open.

title: BTX fast lane
lead: >-
  Everything a newcomer needs on one page: what BTX is, how to get a wallet, buy, mine or run a
  node, and what to watch out for.
checked: 2026-11-16

facts:
  - title: What it is
    text: >-
      A Bitcoin fork (Bitcoin Knots v29.2) with two changes: proof-of-work by matrix
      multiplication on GPUs, and post-quantum signatures.
    source: https://github.com/btxchain/btx
  - title: Supply
    text: >-
      At most 21,000,000 BTX. 20 BTX per block, halving every 525,000 blocks (about 18 months).
    source: https://github.com/btxchain/btx/blob/main/src/kernel/chainparams.cpp
  - title: Blocks
    text: One block about every 90 seconds; difficulty adjusts every block.
    source: https://github.com/btxchain/btx/blob/main/src/kernel/chainparams.cpp
  - title: Addresses
    text: >-
      Start with btx1z. Signed with ML-DSA-44 (NIST FIPS 204), with SLH-DSA (FIPS 205) as a
      hash-based fallback.
    source: https://github.com/btxchain/btx/blob/main/doc/btx-pqc-spec.md
  - title: Mining needs a GPU
    text: >-
      Since block 185,000 every block is replayed on a qualified NVIDIA (CUDA) or Apple (Metal)
      GPU. No CPU mining.
    source: https://github.com/btxchain/btx/blob/main/doc/btx-gpu-verified-network-transition.md
  - title: Current release
    text: >-
      v0.34.16, for Linux x86_64 only (CPU and CUDA builds). The last macOS build is v0.34.15
      (Apple Silicon). There is no official Windows build.
    source: https://github.com/btxchain/btx/releases
  - title: The first million
    text: >-
      Blocks 1 to 50,000 paid 1,000,000 BTX (4.76 % of the maximum) to one address. All of it
      left through shielded transactions by May 2026; where it went cannot be seen.
    source: https://github.com/BTX-Community/btx-community/blob/main/research/deployment-reward.md
  - title: No exchange
    text: >-
      No exchange lists this BTX. Trading is person to person or over the counter. The "BTX" on
      CoinGecko and similar sites is a different coin.
    source: https://btxotc.com/research/btx-market-structure/

paths:
  - id: wallet
    title: Get a wallet
    text: Pick one. Write the recovery words on paper, never into a website or chat.
    steps:
      - text: "PQ Wallet: desktop, macOS, Windows, Linux"
        href: https://pq-wallet.com
      - text: "Bonuz: phone, iOS and Android"
        href: https://www.bonuz.xyz/en/btx-wallet
      - text: "BTX Wallet: in the browser, from btx.dev"
        href: https://btx.dev/wallet/
      - text: "Backups and keys: the official guide"
        href: https://github.com/btxchain/btx/blob/main/doc/btx-key-management-guide.md

  - id: buy
    title: Buy BTX
    text: >-
      There is no exchange and no escrow. You usually pay first and trust the seller.
    steps:
      - text: Read the checklist before you buy
        href: /learn/#before-buying
      - text: "easyBTX seller board: person to person, no escrow"
        href: https://easybtx.com/buy
      - text: Start with a small amount and wait for confirmations
      - text: Anyone who messages you first is not a seller

  - id: miners
    title: Mine
    text: >-
      You need a GPU (NVIDIA, AMD or Apple), mining software and a pool.
    steps:
      - text: "easyBTX miner: macOS, Windows, Linux"
        href: https://easybtx.com/
      - text: "matador: open source, NVIDIA"
        href: https://github.com/vanities/matador-miner
      - text: "Pool: ninjaraider"
        href: https://ninjaraider.com
      - text: "Pool: BTX Pool"
        href: https://btx-pool.com
      - text: Two pools find almost every block. Check their shares before you pick one
        href: https://network.btx-monitoring.com/

  - id: nodes
    title: Run a node
    text: Linux x86_64. Start from a snapshot instead of syncing from the first block.
    steps:
      - text: Download v0.34.16 and compare it with SHA256SUMS
        href: https://github.com/btxchain/btx/releases
      - text: Load the latest snapshot
        href: https://github.com/dr-chambre/btx-snapshots/releases/latest
      - text: "Node holds coins or mines? Set modelnet=0, natpmp=0 and swapnet=0"
        href: https://network.btx-monitoring.com/help/
      - text: Updates install themselves by default; set autoupdate=0 to decide yourself
      - text: Open TCP port 19335 for incoming peers
      - text: Read the checklist before you install
        href: /infra/#before-installing

watch_out:
  - Nobody from the team or a seller will message you first. Treat every direct message as a scam.
  - Never type your recovery words or upload a wallet file into any website.
  - >-
    Release files have been replaced under the same version tag, and SHA256SUMS is not signed.
    Compare your download with it on the day you download.
  - >-
    The price on btxprice.com is a model price, not the result of exchange trades.

