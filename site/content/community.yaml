# Start page of btx-community.com: cards for newcomers, miners and node operators, plus a link
# directory. The directory continues the community list btxlinks.com
# (github.com/vanities/btxlinks, MIT licence) with every entry re-checked.
#
# Edit this file to change the page; site/build.py checks it on every pull request and
# refuses anything that does not fit the rules below.
#
# checked:  date on which every link below was opened and found alive.
# risk:     category with services we have not audited (wallets, bridges, exchanges); the page
#           shows its warning above the entries.
# url:      plain https URL; a short query (e.g. "?type=basic") is allowed, nothing else.
# Texts: English (default) and German. Keep them factual; no claims we cannot back up.

schema_version: 1
checked: 2026-11-03

audiences:
  - id: newcomers
    title: { en: New to BTX, de: Neu bei BTX }
    text:
      en: >-
        BTX is a post-quantum fork of Bitcoin with a fixed maximum supply and its own
        proof-of-work (MatMul). It is run by an open community, not by a company.
      de: >-
        BTX ist ein Post-Quanten-Fork von Bitcoin mit fester Höchstmenge und eigenem
        Proof-of-Work (MatMul). Getragen wird es von einer offenen Community, nicht von einer Firma.
    steps:
      - text:
          en: Read the official introduction and documentation.
          de: Die offizielle Einführung und Dokumentation lesen.
        url: https://btx.dev/
      - text:
          en: See how the network is doing right now, in plain terms.
          de: Nachsehen, wie es dem Netz gerade geht, verständlich erklärt.
        url: https://network.btx-monitoring.com/
      - text:
          en: Ask questions in the community chats (Discord, Telegram).
          de: Fragen in den Community-Chats stellen (Discord, Telegram).
        anchor: community
      - text:
          en: >-
            Never share your seed or private key. Nobody from the community will ever ask for
            it; direct messages offering help or "support" are scams.
          de: >-
            Seed oder privaten Schlüssel nie weitergeben. Niemand aus der Community fragt danach;
            Direktnachrichten mit "Hilfe" oder "Support" sind Betrug.

  - id: miners
    title: { en: Mining, de: Mining }
    text:
      en: >-
        Mining needs a GPU. You can mine alone against your own node and keep every block, or
        join a pool for steadier payouts.
      de: >-
        Zum Minen braucht man eine Grafikkarte. Man kann allein gegen den eigenen Node minen und
        jeden Block behalten oder einem Pool beitreten und regelmäßiger ausgezahlt werden.
    steps:
      - text:
          en: Pick a miner - easyBTX (one app for Mac, Windows, Linux) or matador (open source).
          de: Einen Miner wählen - easyBTX (eine App für Mac, Windows, Linux) oder matador (Open Source).
        anchor: miners
      - text:
          en: >-
            Prefer a smaller pool. When one pool finds most blocks, the network depends on it;
            the status page shows the current shares.
          de: >-
            Lieber einen kleineren Pool wählen. Findet ein Pool die meisten Blöcke, hängt das Netz
            an ihm; die Statusseite zeigt die aktuellen Anteile.
        url: https://network.btx-monitoring.com/
      - text:
          en: >-
            matador's examples still name the minebtx pool, which is offline. Use a pool from
            the list below instead.
          de: >-
            Die Beispiele von matador nennen noch den Pool minebtx, der nicht mehr erreichbar ist.
            Stattdessen einen Pool aus der Liste unten nehmen.
        anchor: pools
      - text:
          en: Problems with an NVIDIA card? The official CUDA troubleshooting guide helps.
          de: Probleme mit einer NVIDIA-Karte? Die offizielle CUDA-Fehlersuche hilft.
        url: https://github.com/btxchain/btx/blob/main/doc/btx-cuda-mining-troubleshooting.md

  - id: nodes
    title: { en: Running a node, de: Einen Node betreiben }
    text:
      en: >-
        Every node checks the chain for itself and makes the network harder to fool. A home
        computer is enough; signers have much higher requirements.
      de: >-
        Jeder Node prüft die Kette selbst und macht das Netz schwerer zu täuschen. Ein
        Heimrechner genügt; Signer haben deutlich höhere Anforderungen.
    steps:
      - text:
          en: Easiest start at home - easynode installs and supervises btxd for you.
          de: Einfachster Start zu Hause - easynode installiert und überwacht btxd für dich.
        url: https://github.com/MendeMatthias/easynode
      - text:
          en: >-
            On a server - the official release for Linux needs glibc 2.38 or newer
            (Ubuntu 24.04, Debian 13).
          de: >-
            Auf einem Server - das offizielle Linux-Release braucht glibc 2.38 oder neuer
            (Ubuntu 24.04, Debian 13).
        url: https://github.com/btxchain/btx/releases
      - text:
          en: Catch up in minutes with a daily signed snapshot instead of syncing from genesis.
          de: In Minuten aufholen mit einem täglich signierten Snapshot statt Sync ab Genesis.
        url: https://github.com/dr-chambre/btx-snapshots
      - text:
          en: Node stuck at a height? The node help explains each known case and its fix.
          de: Node hängt bei einer Höhe? Die Node-Hilfe erklärt jeden bekannten Fall und die Lösung.
        url: https://network.btx-monitoring.com/help/
      - text:
          en: >-
            Signers (GPU attestors) need an NVIDIA Blackwell card (sm_120) and must follow the
            developers' operator runbook.
          de: >-
            Signer (GPU-Attestoren) brauchen eine NVIDIA-Blackwell-Karte (sm_120) und müssen sich
            an das Betreiber-Runbook der Entwickler halten.
        url: https://github.com/btxchain/btx/blob/main/doc/btx-matmul-v4.7-gpu-operator-runbook.md

