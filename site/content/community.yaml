          en: >-
            Closed source; the builds are unsigned, so check the SHA-256 on the release page. It
            starts on BTX Pool by default. A 5% dev fee was listed for it in August 2026; check
            the current fee in the app.
          de: >-
            Closed Source; die Builds sind unsigniert, daher die SHA-256 auf der Release-Seite
            prüfen. Startet standardmäßig auf BTX Pool. Im August 2026 wurde eine Dev-Gebühr von
            5 % genannt; die aktuelle Gebühr in der App prüfen.
      - id: matador
        name: matador
        url: https://github.com/vanities/matador-miner
        tags: [gpu, nvidia, open source]
        description:
          en: Open-source GPU miner (NVIDIA, CUDA), solo against your own node or in a pool.
          de: Open-Source-GPU-Miner (NVIDIA, CUDA), solo gegen den eigenen Node oder im Pool.
        note:
          en: >-
            Last change 2026-08-21. The quick start in its README contains a sample payout
            address and two offline pools (minebtx, Byron); replace all three. 1% dev fee in pool
            mode; it updates itself unless started with --no-auto-update. NVIDIA Ampere (RTX 30
            series) or newer only.
          de: >-
            Letzte Änderung 2026-08-21. Im Schnellstart des README stehen eine
            Beispiel-Auszahlungsadresse und zwei nicht erreichbare Pools (minebtx, Byron); alle
            drei ersetzen. 1 % Dev-Gebühr im Pool-Modus; aktualisiert sich selbst, außer beim
            Start mit --no-auto-update. Nur NVIDIA Ampere (RTX-30-Serie) oder neuer.
      - id: nekominer
        name: nekominer
        url: https://github.com/nr800/nekominer
        tags: [gpu, nvidia, linux, hiveos, closed source]
        description:
          en: >-
            NVIDIA (CUDA) miner for several coins; BTX runs as algorithm btxv4, the proof-of-work
            since block 185,000. Its README has commands for ninjaraider and BTX Pool.
          de: >-
            NVIDIA-Miner (CUDA) für mehrere Coins; BTX läuft als Algorithmus btxv4, der
            Proof-of-Work seit Block 185.000. Das README enthält Befehle für ninjaraider und
            BTX Pool.
        note:
          en: >-
            The miner's source is not published: the repository holds scripts and binary releases,
            with no licence. 2% dev fee, 0% on ninjaraider.
          de: >-
            Der Quellcode des Miners ist nicht veröffentlicht: Das Repository enthält Skripte und
            Binär-Releases, ohne Lizenz. 2 % Dev-Gebühr, 0 % bei ninjaraider.
      - id: forgeminer
        name: ForgeMiner
        url: https://github.com/0xHashRaptor/ForgeMiner
        tags: [gpu, nvidia, windows, hiveos, closed source]
        description:
          en: >-
            Multi-coin GPU miner with BTX support (MatMul v4.7 since version 1.6.0); its BTX
            example uses BTX Pool. BTX mines on NVIDIA cards only.
          de: >-
            Multi-Coin-GPU-Miner mit BTX-Unterstützung (MatMul v4.7 seit Version 1.6.0); das
            BTX-Beispiel nutzt BTX Pool. BTX läuft nur auf NVIDIA-Karten.
        note:
          en: Closed source (stated in its README). 2% dev fee on BTX.
          de: Closed Source (laut README). 2 % Dev-Gebühr auf BTX.
      - id: btxd-solo-mining
        name: Solo mining helpers (btxd)
        url: https://github.com/btxchain/btx/tree/main/contrib/mining
        tags: [solo, official, open source, scripts]
        description:
          en: >-
            Official scripts for solo mining against your own btxd: a health-aware mining loop,
            start and stop scripts and a wallet backup. For larger setups the README points to
            getblocktemplate with external miners.
          de: >-
            Offizielle Skripte für Solo-Mining gegen den eigenen btxd: eine Mining-Schleife mit
            Zustandsprüfung, Start- und Stopp-Skripte und ein Wallet-Backup. Für größere Setups
            verweist das README auf getblocktemplate mit externen Minern.
        note:
          en: >-
            Mining needs a qualified GPU and a node that checks blocks itself
            (matmulvalidation=consensus, the default), not a trusted mirror. See the GPU
            operator runbook.
          de: >-
            Mining braucht eine zugelassene GPU und einen Node, der Blöcke selbst prüft
            (matmulvalidation=consensus, die Voreinstellung), keinen Trusted Mirror. Siehe das
            GPU-Betreiber-Runbook.

  - id: node-tools
    title: { en: Node tools, de: Node-Werkzeuge }
    entries:
      - id: easynode
        name: easynode
        url: https://github.com/MendeMatthias/easynode
        tags: [desktop, open source]
        description:
          en: >-
            Open-source (MIT) desktop app of the easyBTX team that installs and supervises btxd
            on the machine you already own.
          de: >-
            Open-Source-Desktop-App (MIT) des easyBTX-Teams, die btxd auf dem eigenen Rechner
            installiert und überwacht.
        note:
          en: >-
            Runs v0.34.15 without the model network. Without a qualified GPU the node follows
            signers' checks instead of checking the MatMul work itself.
          de: >-
            Läuft mit v0.34.15 ohne Modellnetz. Ohne zugelassene GPU folgt der Node den Prüfungen
            der Signer, statt die MatMul-Arbeit selbst zu prüfen.
      - id: guardian
        name: BTX Node Guardian
        url: https://easybtx.com/guardian
        tags: [script, watchdog]
        description:
          en: Free script that tells a waiting network from a stuck node and dials helpful peers. It never restarts the node.
          de: Kostenloses Skript, das ein wartendes Netz von einem hängenden Node unterscheidet und hilfreiche Peers anwählt. Es startet den Node nie neu.
      - id: snapshots
        name: BTX snapshots
        url: https://github.com/dr-chambre/btx-snapshots/releases/latest
        tags: [snapshot, signed, pruned]
        description:
          en: >-
            Daily pruned datadir snapshot, checked and signed by a second node. Built on a
            trusted mirror, so the MatMul work was accepted on signers' attestations.
          de: >-
            Täglicher Datadir-Snapshot (pruned), von einem zweiten Node geprüft und signiert. Auf
            einem Trusted Mirror gebaut: Die MatMul-Arbeit wurde anhand der Bestätigungen von
            Signern akzeptiert.
        note:
          en: Verify the signature and SHA-256 before use. Not for signers.
          de: Vor der Nutzung Signatur und SHA-256 prüfen. Nicht für Signer.
      - id: node-help
        name: Node help
        url: https://network.btx-monitoring.com/help/
        tags: [help, stuck heights]
        description:
          en: Known stuck heights with their cause and fix.
          de: Bekannte Hänge-Höhen mit Ursache und Lösung.
      - id: ainode
        name: AInode
        url: https://github.com/MendeMatthias/ainode-releases
        tags: [mac, model network, desktop]
        description:
          en: >-
            Mac app (Apple Silicon, macOS 13 or later) of the easyBTX team that fetches open AI
            models over the BTX model network and runs them on your Mac. It only downloads; it
            never serves, pays or earns.
          de: >-
            Mac-App (Apple Silicon, ab macOS 13) des easyBTX-Teams, die offene KI-Modelle über das
            BTX-Modellnetz lädt und auf dem eigenen Mac ausführt. Sie lädt nur herunter; sie
            stellt nichts bereit, zahlt nichts und verdient nichts.
        note:
          en: >-
            MIT-licensed; this repository holds only the downloads and release notes. Compare the
            SHA-256 listed with each release.
          de: >-
            MIT-lizenziert; dieses Repository enthält nur die Downloads und Release-Notes. Die bei
            jedem Release angegebene SHA-256 vergleichen.

  - id: wallets
    title: { en: Wallets, de: Wallets }
    risk:
      en: >-
        Not audited by us. Only install wallets from the link here, keep your seed offline and
        never type it into a website.
      de: >-
        Von uns nicht geprüft. Wallets nur über den Link hier installieren, den Seed offline
        aufbewahren und nie auf einer Website eingeben.
    entries:
      - id: btx-wallet
        name: BTX Wallet
        url: https://btx.dev/wallet/
        tags: [official, browser, pq]
        description:
          en: Official post-quantum wallet in the browser.
          de: Offizielle Post-Quanten-Wallet im Browser.
        note:
          en: Its backup file (.btxwallet) holds the seed in plain text. Keep it offline and never send it to anyone.
          de: Die Sicherungsdatei (.btxwallet) enthält den Seed im Klartext. Offline aufbewahren und nie an jemanden schicken.
      - id: node-wallet
        name: Node wallet (btx-qt, btx-cli)
        url: https://github.com/btxchain/btx/releases
        tags: [official, desktop, open source, pq]
        description:
          en: >-
            The wallet in the official releases for Linux and macOS: the desktop app btx-qt, or
            btxd with btx-cli. Open source; it runs on your own node.
          de: >-
            Die Wallet in den offiziellen Releases für Linux und macOS: die Desktop-App btx-qt oder
            btxd mit btx-cli. Open Source; sie läuft auf dem eigenen Node.
        note:
          en: >-
            Back up the whole wallet with backupwalletbundlearchive (one passphrase-encrypted
            file; see doc/managing-wallets.md), not only the seed. A .btxwallet export holds the
            seed in plain text.
          de: >-
            Die ganze Wallet mit backupwalletbundlearchive sichern (eine mit Passphrase
            verschlüsselte Datei; siehe doc/managing-wallets.md), nicht nur den Seed. Ein
            .btxwallet-Export enthält den Seed im Klartext.
      - id: pq-wallet
        name: BTX PQ Wallet
        url: https://easybtx.com/wallet
        tags: [desktop, pq, mac, windows]
        description:
          en: Post-quantum desktop wallet of the easyBTX team for macOS and Windows.
          de: Post-Quanten-Desktop-Wallet des easyBTX-Teams für macOS und Windows.
        note:
          en: >-
            Early test build: internal security review, no independent audit; the source code is
            not public and the direct downloads are unsigned. A 64-character master key is the
            only backup; keep it offline.
          de: >-
            Frühe Testversion: interne Sicherheitsprüfung, kein unabhängiges Audit; der Quellcode
            ist nicht öffentlich und die direkten Downloads sind unsigniert. Ein Master-Key mit 64
            Zeichen ist das einzige Backup; offline aufbewahren.
      - id: bonuz
        name: Bonuz
        url: https://www.bonuz.xyz
        tags: [mobile, ios, android, seedless]
        description:
          en: Seedless mobile wallet for iOS and Android with BTX support.
          de: Mobile Wallet ohne Seed für iOS und Android, mit BTX-Unterstützung.
        note:
          en: >-
            Seedless means there is no seed phrase you back up yourself; access and recovery go
            through the Bonuz login. Check how recovery works before you rely on it.
          de: >-
            Seedless heißt: Es gibt keine Seed-Phrase, die man selbst sichert; Zugang und
            Wiederherstellung laufen über das Bonuz-Login. Vor dem Einsatz prüfen, wie die
            Wiederherstellung funktioniert.

  - id: bridges
    title: { en: Bridges and testnets, de: Bridges und Testnetze }
    risk:
      en: >-
        Experimental and not audited by us. Bridges can lose funds; do not send more than you
        can afford to lose.
      de: >-
        Experimentell und von uns nicht geprüft. Bridges können Guthaben verlieren; nicht mehr
        schicken, als man verlieren kann.
    entries:
      - id: wbtx-spec
        name: wBTX specification (official)
        url: https://github.com/btxchain/btx/blob/main/docs/wBTX.md
        tags: [official, spec, wrapped, ethereum]
        description:
          en: >-
            The developers' design for wrapped BTX on EVM chains: token rules, bridge models and
            reference contracts. A design, not a working bridge.
          de: >-
            Der Entwurf der Entwickler für Wrapped BTX auf EVM-Chains: Token-Regeln, Bridge-Modelle
            und Referenzverträge. Ein Entwurf, keine laufende Bridge.
        note:
          en: Not launched. Its launch checklist is still open and the reference contracts are unaudited.
          de: Nicht gestartet. Die Start-Checkliste ist noch offen, und die Referenzverträge sind nicht auditiert.
      - id: wbtx
        name: WBTX (wbtx-eth)
        url: https://github.com/evxdev/wbtx-eth
        tags: [ethereum, wrapped, testnet]
        description:
          en: >-
            Wrapped BTX on Ethereum - contracts, validator services and a local simulator, by the
            GitHub organisation evxdev. Testnet only.
          de: >-
            Wrapped BTX auf Ethereum - Verträge, Validator-Dienste und ein lokaler Simulator der
            GitHub-Organisation evxdev. Nur Testnetz.
        note:
          en: Last change 2026-07-09.
          de: Letzte Änderung 2026-07-09.
      - id: btx-supply
        name: btx.supply
        url: https://btx.supply/
        tags: [testnet, bridge, wip]
        description:
          en: >-
            Public tester site and guide of the wbtx-eth project (evxdev): a WBTX bridge on an
            Ethereum testnet. Test tokens have no value.
          de: >-
            Öffentliche Testseite mit Anleitung des Projekts wbtx-eth (evxdev): eine WBTX-Bridge in
            einem Ethereum-Testnetz. Test-Token sind nichts wert.
        note:
          en: Testnet only; it can be reset. Code unchanged since 2026-07-09.
          de: Nur Testnetz; es kann zurückgesetzt werden. Code unverändert seit 2026-07-09.
      - id: robinhood
        name: Robinhood Chain testnet
        url: https://robinhood.btx.supply/
        tags: [testnet, bridge, wip]
        description:
          en: The same WBTX test bridge as btx.supply, on the Robinhood Chain testnet. Test tokens have no value.
          de: Dieselbe WBTX-Test-Bridge wie btx.supply, im Testnetz der Robinhood Chain. Test-Token sind nichts wert.
        note:
          en: Testnet only; it can be reset. Code unchanged since 2026-07-09.
          de: Nur Testnetz; es kann zurückgesetzt werden. Code unverändert seit 2026-07-09.

# The documents this group maintains. They live in the repository so that every change is
# visible as a commit; this section is how a reader finds them without knowing git.
# status: optional, says where a document stands. Leave it out once something is settled.
documents:
  - id: doc-roadmap
    title:
      en: Roadmap
      de: Roadmap
    text:
      en: >-
        What the community can do by itself and what depends on the core team, in two columns,
        with a place to put your name against a lane.
      de: >-
        Was die Community selbst tun kann und was vom Kernteam abhängt, in zwei Spalten, mit
        einem Feld, in das man seinen Namen für einen Bereich eintragen kann.
    url: https://github.com/BTX-Community/btx-community/blob/main/ROADMAP.md
    status:
      en: Open for edits
      de: Offen für Änderungen

  - id: doc-deployment-reward
    title:
      en: The bootstrap window and the 1,000,000 BTX deployment reward
      de: Das Bootstrap-Fenster und die 1.000.000 BTX Deployment Reward
    text:
      en: >-
        The first question most newcomers ask, answered from chain data: what the first 50,000
        blocks produced, under which consensus rules, and what public data can and cannot show.
      de: >-
        Die erste Frage fast jedes Neuzugangs, beantwortet aus Chain-Daten: was die ersten
        50.000 Blöcke erzeugt haben, unter welchen Konsensregeln, und was öffentliche Daten
        zeigen können und was nicht.
    url: https://github.com/BTX-Community/btx-community/blob/main/research/deployment-reward.md
    status:
      en: Draft - under review
      de: Entwurf - in Prüfung

  - id: doc-network-fund
    title:
      en: Network fund
      de: Netzwerk-Fund
    text:
      en: >-
        How the network could pay for its own infrastructure: contributions, multisig custody,
        published rules and payouts against verified uptime.
      de: >-
        Wie das Netzwerk seine eigene Infrastruktur bezahlen könnte: Beiträge, Multisig-Verwahrung,
        veröffentlichte Regeln und Auszahlungen gegen nachgewiesene Verfügbarkeit.
    url: https://github.com/BTX-Community/btx-community/blob/main/research/network-fund.md
    status:
      en: Discussion paper
      de: Diskussionspapier

  - id: doc-venue-structure
    title:
      en: Venue structure and the licensing boundary
      de: Handelsplatzstruktur und die Erlaubnisgrenze
    text:
      en: >-
        What a decentralised exchange can be on a chain without a virtual machine, where the
        regulatory line runs, and the models that remain open. Not legal advice.
      de: >-
        Was eine dezentrale Börse auf einer Chain ohne virtuelle Maschine sein kann, wo die
        regulatorische Grenze verläuft und welche Modelle bleiben. Keine Rechtsberatung.
    url: https://github.com/BTX-Community/btx-community/blob/main/research/venue-structure.md
    status:
      en: Draft for discussion
      de: Entwurf zur Diskussion

  - id: doc-contributing
    title:
      en: How to change something here
      de: Wie man hier etwas ändert
    text:
      en: >-
        What you can edit freely, what needs a second pair of eyes, and how to report a wrong
        figure if git is not your thing.
      de: >-
        Was man frei ändern kann, was ein zweites Augenpaar braucht, und wie man eine falsche
        Zahl meldet, wenn git nicht das eigene Werkzeug ist.
    url: https://github.com/BTX-Community/btx-community/blob/main/CONTRIBUTING.md

  - id: doc-dev-hub
    title:
      en: Become a BTX dev
      de: BTX-Entwickler werden
    text:
      en: >-
        How to work on the node software so that your change can be merged: the method, build
        and test recipes, the gate before an upstream pull request, open lanes with claimable
        owners, an exam, and an entry file for AI tools.
      de: >-
        Wie man an der Node-Software so arbeitet, dass eine Änderung angenommen werden kann:
        die Methode, Bau- und Testanleitungen, die Prüfliste vor einem Upstream-Pull-Request,
        offene Bereiche, in die man sich eintragen kann, eine Prüfung und eine Einstiegsdatei
        für KI-Werkzeuge.
    url: https://github.com/BTX-Community/btx-community/blob/main/dev/README.md
    status:
      en: Living document - every page carries its last-verified date
      de: Wird laufend gepflegt - jede Seite nennt das Datum ihrer letzten Prüfung

  - id: doc-review-programme
    title:
      en: Review and test programme - one pull request per bug class
      de: Review- und Testprogramm - ein Pull Request pro Fehlerklasse
    text:
      en: >-
        Test coverage measured on the release line, the recurring bug classes behind 317 fix
        pull requests since August, one sweep per class that closes it with a rule, and checks
        before a final release. A proposal by contributors; the maintainer decides what lands.
      de: >-
        Die auf dem Release-Zweig gemessene Testabdeckung, die wiederkehrenden Fehlerklassen
        hinter 317 Fix-Pull-Requests seit August, ein Sammel-PR pro Klasse, der sie mit einer
        Regel schließt, und Prüfungen vor einem endgültigen Release. Ein Vorschlag von
        Mitwirkenden; was übernommen wird, entscheidet der Maintainer.
    url: https://github.com/BTX-Community/btx-community/blob/main/dev/plan/MASTER-PLAN.md
    status:
      en: Measured 12 November 2026 at commit c6f9678d
      de: Gemessen am 12. November 2026 auf Commit c6f9678d


