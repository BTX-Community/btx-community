# Start page of btx-community.com: cards for newcomers, miners and node operators, plus a link
# directory. The directory continues the community list btxlinks.com
# (github.com/vanities/btxlinks, Copyright (c) 2026 Adam Mischke, MIT License) with every
# entry re-checked; its licence text is in THIRD-PARTY-NOTICES.md.
#
# Edit this file to change the page; site/build.py checks it on every pull request and
# refuses anything that does not fit the rules below.
#
# checked:  date on which every link below was opened and found alive.
# risk:     category with services we have not audited (wallets, bridges, exchanges); the page
#           shows its warning above the entries.
# url:      plain https URL; a short query (e.g. "?type=basic") is allowed, nothing else.
# page:     a step can link to a page of this site instead, e.g. "dev" for the developers page.
# Texts: English (default) and German. Keep them factual; no claims we cannot back up.

schema_version: 1
checked: 2026-11-03

audiences:
  - id: newcomers
    title: { en: New to BTX, de: Neu bei BTX }
    text:
      en: >-
        BTX is a post-quantum fork of Bitcoin with a fixed maximum supply and its own
        proof-of-work (MatMul). It is run by an open community, not by a company.
      de: >-
        BTX ist ein Post-Quanten-Fork von Bitcoin mit fester Höchstmenge und eigenem
        Proof-of-Work (MatMul). Getragen wird es von einer offenen Community, nicht von einer Firma.
    steps:
      - text:
          en: >-
            Read the official introduction and documentation. It was written for v0.33.2;
            newer releases differ in places.
          de: >-
            Die offizielle Einführung und Dokumentation lesen. Sie wurde für v0.33.2 geschrieben;
            neuere Releases weichen teils ab.
        url: https://btx.dev/
      - text:
          en: See how the network is doing right now, in plain terms.
          de: Nachsehen, wie es dem Netz gerade geht, verständlich erklärt.
        url: https://network.btx-monitoring.com/
      - text:
          en: Ask questions in the community chats (Discord, Telegram).
          de: Fragen in den Community-Chats stellen (Discord, Telegram).
        anchor: community
      - text:
          en: >-
            Never share your seed or private key. Nobody from the community will ever ask for
            it; direct messages offering help or "support" are scams.
          de: >-
            Seed oder privaten Schlüssel nie weitergeben. Niemand aus der Community fragt danach;
            Direktnachrichten mit "Hilfe" oder "Support" sind Betrug.

  - id: miners
    title: { en: Mining, de: Mining }
    text:
      en: >-
        Mining needs a GPU. You can mine alone against your own node and keep every block, or
        join a pool for steadier payouts.
      de: >-
        Zum Minen braucht man eine Grafikkarte. Man kann allein gegen den eigenen Node minen und
        jeden Block behalten oder einem Pool beitreten und regelmäßiger ausgezahlt werden.
    steps:
      - text:
          en: >-
            Pick a miner from our link list - for example easyBTX (an app for Mac and Linux; on
            Windows through WSL) or matador (open source).
          de: >-
            Einen Miner aus unserer Linkliste wählen - etwa easyBTX (eine App für Mac und Linux;
            unter Windows über WSL) oder matador (Open Source).
        anchor: miners
      - text:
          en: >-
            Prefer a smaller pool. When one pool finds most blocks, the network depends on it;
            the status page shows the current shares.
          de: >-
            Lieber einen kleineren Pool wählen. Findet ein Pool die meisten Blöcke, hängt das Netz
            an ihm; die Statusseite zeigt die aktuellen Anteile.
        url: https://network.btx-monitoring.com/
      - text:
          en: >-
            matador's quick start contains a sample payout address that is not yours and two
            pools that are offline. Always put in your own btx1z address and a pool from our
            link list.
          de: >-
            Im Schnellstart von matador stehen eine fremde Beispiel-Auszahlungsadresse und zwei
            Pools, die nicht mehr erreichbar sind. Immer die eigene btx1z-Adresse und einen Pool
            aus unserer Linkliste eintragen.
        anchor: pools
      - text:
          en: >-
            Problems with an NVIDIA card? The official CUDA troubleshooting guide helps; parts of
            it describe the CUDA path from before block 185,000.
          de: >-
            Probleme mit einer NVIDIA-Karte? Die offizielle CUDA-Fehlersuche hilft; Teile davon
            beschreiben den CUDA-Weg von vor Block 185.000.
        url: https://github.com/btxchain/btx/blob/main/doc/btx-cuda-mining-troubleshooting.md

  - id: nodes
    title: { en: Running a node, de: Einen Node betreiben }
    text:
      en: >-
        Every node relays blocks and keeps the network reachable. A node checks every block
        itself only with a GPU that passes btxd's self-test. Without one, run it as a trusted
        mirror that follows signed checks from at least two signers; otherwise it stops
        syncing. Signers have the highest requirements.
      de: >-
        Jeder Node leitet Blöcke weiter und hält das Netz erreichbar. Jeden Block selbst prüft
        ein Node nur mit einer GPU, die den Selbsttest von btxd besteht. Ohne sie läuft er als
        Trusted Mirror, der signierten Prüfungen von mindestens zwei Signern folgt; sonst
        bleibt er stehen. Signer haben die höchsten Anforderungen.
    steps:
      - text:
          en: Easiest start at home - easynode installs and supervises btxd for you.
          de: Einfachster Start zu Hause - easynode installiert und überwacht btxd für dich.
        url: https://github.com/MendeMatthias/easynode
      - text:
          en: >-
            On a server - the official release for Linux needs glibc 2.38 or newer
            (Ubuntu 24.04, Debian 13); a GPU node takes the -cuda13 archive (Blackwell cards).
            The v0.34.16 pre-release has no CUDA build, so GPU nodes stay on v0.34.15. The
            current release has no official Windows archive.
          de: >-
            Auf einem Server - das offizielle Linux-Release braucht glibc 2.38 oder neuer
            (Ubuntu 24.04, Debian 13); ein GPU-Node nimmt das Archiv -cuda13 (Blackwell-Karten).
            Das Pre-Release v0.34.16 hat keinen CUDA-Build, GPU-Nodes bleiben daher auf v0.34.15.
            Für das aktuelle Release gibt es kein offizielles Windows-Archiv.
        url: https://github.com/btxchain/btx/releases
      - text:
          en: >-
            Catch up in minutes with a daily signed snapshot. A sync from genesis currently
            stops at block 126,978 (issue #272).
          de: >-
            In Minuten aufholen mit einem täglich signierten Snapshot. Ein Sync ab Genesis bleibt
            derzeit bei Block 126.978 stehen (Issue #272).
        url: https://github.com/dr-chambre/btx-snapshots/releases/latest
      - text:
          en: Node stuck at a height? The node help explains each known case and its fix.
          de: Node hängt bei einer Höhe? Die Node-Hilfe erklärt jeden bekannten Fall und die Lösung.
        url: https://network.btx-monitoring.com/help/
      - text:
          en: >-
            Signers (GPU attestors) need a GPU that passes btxd's self-test and must stay
            online. The official CUDA archive covers Blackwell cards (sm_120); other NVIDIA cards
            need a build from source and may not qualify. Follow the developers' operator runbook.
          de: >-
            Signer (GPU-Attestoren) brauchen eine GPU, die den Selbsttest von btxd besteht, und
            müssen ständig online sein. Das offizielle CUDA-Archiv deckt Blackwell-Karten (sm_120)
            ab; andere NVIDIA-Karten brauchen einen eigenen Build und qualifizieren sich womöglich
            nicht. An das Betreiber-Runbook der Entwickler halten.
        url: https://github.com/btxchain/btx/blob/main/doc/btx-matmul-v4.7-gpu-operator-runbook.md

  - id: developers
    title: { en: Become a BTX dev, de: BTX-Entwickler werden }
    text:
      en: >-
        The node software is open source, and anyone can send it a pull request on GitHub.
        The developer hub tells you, and the AI tool you work with, how to build, test and
        document a change so that it can be merged, and which work is open.
      de: >-
        Die Node-Software ist Open Source, und jeder kann auf GitHub Pull Requests dafür
        einreichen. Der Entwickler-Hub erklärt dir und deinem KI-Werkzeug, wie man eine
        Änderung baut, testet und dokumentiert, damit sie übernommen werden kann, und welche
        Arbeit offen ist.
    steps:
      - text:
          en: "Start on the developers page: where to begin, levels, test coverage and open lanes."
          de: "Auf der Entwickler-Seite anfangen: Einstieg, Stufen, Testabdeckung und offene Arbeitsbereiche."
        page: dev
      - text:
          en: Give your AI tool (Claude Code, Cursor, Codex or another) the agent file.
          de: Dem eigenen KI-Werkzeug (Claude Code, Cursor, Codex oder einem anderen) die Agenten-Datei geben.
        url: https://github.com/BTX-Community/btx-community/blob/main/dev/AGENTS.md
      - text:
          en: The reference implementation and its own rules for agents.
          de: Die Referenzimplementierung und ihre eigenen Regeln für Agenten.
        url: https://github.com/btxchain/btx

