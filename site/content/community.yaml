    entries:
      - id: btx-dev
        name: btx.dev
        url: https://btx.dev/
        tags: [docs, wallet]
        description:
          en: Official website with documentation, the browser wallet and the whitepaper.
          de: Offizielle Website mit Dokumentation, Browser-Wallet und Whitepaper.
        note:
          en: Last updated for v0.33.2 (August 2026); newer releases are on the GitHub releases page.
          de: Zuletzt für v0.33.2 aktualisiert (August 2026); neuere Releases stehen auf der Release-Seite bei GitHub.
      - id: btx-node
        name: BTX Node
        url: https://github.com/btxchain/btx
        tags: [source, node]
        description:
          en: Source code and releases of the reference node (btxd).
          de: Quellcode und Releases des Referenz-Nodes (btxd).
      - id: protocol-of-record
        name: The Protocol of Record
        url: https://btx.dev/BTX-Context.pdf
        tags: [whitepaper, pdf]
        description:
          en: The official whitepaper, describing what BTX is and why.
          de: Das offizielle Whitepaper; beschreibt, was BTX ist und warum.
        note:
          en: Written for v0.33.2 (August 2026). Newer releases differ in places.
          de: Geschrieben für v0.33.2 (August 2026). Neuere Releases weichen teils ab.
      - id: specification
        name: BTX Specification
        url: https://btx.dev/BTX-Specifications.pdf
        tags: [spec, pdf]
        description:
          en: The official technical specification of the protocol.
          de: Die offizielle technische Spezifikation des Protokolls.
        note:
          en: Written for v0.33.2 (August 2026). Newer releases differ in places.
          de: Geschrieben für v0.33.2 (August 2026). Neuere Releases weichen teils ab.
      - id: build-from-source
        name: Build from source
        url: https://github.com/btxchain/btx/blob/main/doc/build-unix.md
        tags: [docs, node]
        description:
          en: How to build btxd yourself on Linux, if you would rather not trust a binary.
          de: So baust du btxd unter Linux selbst, wenn du keinem fertigen Programm vertrauen willst.
        note:
          en: >-
            A default build has no GPU support and cannot check MatMul blocks itself: add CUDA,
            or run it as a trusted mirror. On Ubuntu 22.04 or 24.04 add -DWITH_MODELNET=OFF,
            unless you install OpenSSL 3.5 or newer.
          de: >-
            Ein Standard-Build hat keine GPU-Unterstützung und kann MatMul-Blöcke nicht selbst
            prüfen: CUDA hinzufügen oder als Trusted Mirror betreiben. Unter Ubuntu 22.04 oder
            24.04 -DWITH_MODELNET=OFF setzen, außer man installiert OpenSSL 3.5 oder neuer.
      - id: windows-build
        name: Build on Windows 11
        url: https://github.com/btxchain/btx/blob/main/doc/btx-windows-11-compile-handbook.md
        tags: [docs, windows, node]
        description:
          en: Official step-by-step guide to building btxd and btx-cli on Windows 11.
          de: Offizielle Schritt-für-Schritt-Anleitung, um btxd und btx-cli unter Windows 11 zu bauen.
        note:
          en: >-
            The current release has no official Windows archive. The handbook starts without
            CUDA, and such a build cannot check MatMul blocks itself: run it as a trusted mirror.
          de: >-
            Für das aktuelle Release gibt es kein offizielles Windows-Archiv. Das Handbuch beginnt
            ohne CUDA, und ein solcher Build kann MatMul-Blöcke nicht selbst prüfen: als Trusted
            Mirror betreiben.
      - id: pqc-spec
        name: Post-quantum signatures
        url: https://github.com/btxchain/btx/blob/main/doc/btx-pqc-spec.md
        tags: [spec, pq]
        description:
          en: ML-DSA and SLH-DSA in BTX, P2MR outputs and the address format.
          de: ML-DSA und SLH-DSA in BTX, P2MR-Outputs und das Adressformat.
      - id: pq-multisig
        name: Post-quantum multisig
        url: https://github.com/btxchain/btx/blob/main/doc/btx-pq-multisig-tutorial.md
        tags: [docs, pq]
        description:
          en: Step-by-step guide to a multisig wallet with post-quantum keys.
          de: Schritt-für-Schritt-Anleitung für eine Multisig-Wallet mit Post-Quanten-Schlüsseln.
      - id: key-management
        name: Key management and backups
        url: https://github.com/btxchain/btx/blob/main/doc/btx-key-management-guide.md
        tags: [docs, wallet, backup]
        description:
          en: >-
            Official guide to wallet roles, multisig, timelocked recovery, watch-only setups and
            encrypted backups, with a restore drill.
          de: >-
            Offizielle Anleitung zu Wallet-Rollen, Multisig, zeitgesperrter Wiederherstellung,
            Watch-only-Setups und verschlüsselten Backups, mit einer Übung zur Wiederherstellung.
      - id: browser-wallet-interop
        name: Browser wallet and node wallet
        url: https://github.com/btxchain/btx/blob/main/doc/btxwallet-browser-node-interop.md
        tags: [docs, wallet, browser]
        description:
          en: >-
            Official guide to moving a btx.dev browser wallet into btxd and back, and how that
            file differs from an encrypted node backup.
          de: >-
            Offizielle Anleitung, wie man eine Browser-Wallet von btx.dev in btxd überträgt und
            zurück, und wie sich diese Datei von einem verschlüsselten Node-Backup unterscheidet.
        note:
          en: >-
            A .btxwallet file holds the post-quantum seed in plain text. Treat it like a private
            key and delete temporary copies.
          de: >-
            Eine .btxwallet-Datei enthält den Post-Quanten-Seed im Klartext. Wie einen privaten
            Schlüssel behandeln und temporäre Kopien löschen.
      - id: matmul-spec
        name: MatMul proof-of-work
        url: https://github.com/btxchain/btx/blob/main/doc/btx-matmul-pow-spec.md
        tags: [spec, mining]
        description:
          en: How mining by matrix multiplication works and how blocks are checked.
          de: Wie Mining mit Matrixmultiplikation funktioniert und wie Blöcke geprüft werden.
        note:
          en: >-
            The file is marked historical: it records the v3 design. Since block 185,000 the
            network runs MatMul v4.7.
          de: >-
            Die Datei ist als historisch markiert: Sie hält den Entwurf v3 fest. Seit Block 185.000
            läuft das Netz mit MatMul v4.7.
      - id: trusted-mirrors
        name: Trusted MatMul mirrors
        url: https://github.com/btxchain/btx/blob/main/doc/btx-matmul-trusted-rpc-mirrors.md
        tags: [docs, node]
        description:
          en: >-
            Running a node without a qualified GPU by trusting signers' replay attestations,
            and what that trust means.
          de: >-
            Einen Node ohne zugelassene GPU betreiben, indem man den Replay-Bestätigungen von
            Signern vertraut, und was dieses Vertrauen bedeutet.
        note:
          en: >-
            On mainnet it needs at least two pinned signers and a threshold of two. Pin only
            signers that are live today.
          de: >-
            Im Mainnet braucht es mindestens zwei gepinnte Signer und eine Schwelle von zwei. Nur
            Signer pinnen, die heute aktiv sind.
      - id: gpu-verified-nodes
        name: Who needs a GPU
        url: https://github.com/btxchain/btx/blob/main/doc/btx-gpu-verified-network-transition.md
        tags: [docs, node, gpu]
        description:
          en: >-
            Official explanation of why a node needs a qualified GPU to check blocks itself since
            block 185,000, and what machines without one can do.
          de: >-
            Offizielle Erklärung, warum ein Node seit Block 185.000 eine zugelassene GPU braucht,
            um Blöcke selbst zu prüfen, und was Rechner ohne eine solche GPU tun können.
      - id: integration-docs
        name: Exchange and custody integration (BCP/1)
        url: https://github.com/btxchain/btx/blob/main/doc/integrations/README.md
        tags: [docs, exchange, custody]
        description:
          en: >-
            Official integration profile for exchanges and custodians: UTXO model, watch-only
            setup, deposits, confirmations and reorg handling.
          de: >-
            Offizielles Integrationsprofil für Börsen und Verwahrer: UTXO-Modell, Watch-only-Setup,
            Einzahlungen, Bestätigungen und Umgang mit Reorgs.
      - id: security-policy
        name: Report a security problem
        url: https://github.com/btxchain/btx/blob/main/SECURITY.md
        tags: [security]
        description:
          en: How to report a vulnerability privately to the BTX Development Team. Not for support questions.
          de: Wie man eine Schwachstelle vertraulich an das BTX Development Team meldet. Nicht für Support-Fragen.

