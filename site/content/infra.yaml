# The "Run infra" page of btx-community.com: the machines people can give BTX, and a map of how
# they fit together.
#
# roles:     one card per role. does = what it does for the network; hardware = a rough class,
#            never a price; guide = an existing guide, reused as it is (leave it out and the card
#            says "guide coming": never write a guide here); coming = what a reader finds until
#            the guide exists; ask = who to ask, as a role, never a person's name; security =
#            the card carries the private reporting route.
# managed:   entry ids of community.yaml. The card shows that entry's own description and note,
#            so this page says nothing about it that the link list does not.
# map:       boxes (nodes) and arrows (edges) of the network map. Every edge cites the lines of
#            btxchain/btx at verified.tag that make it true (or a file of this repository); they
#            were read at both commits in verified.commits. When a role is not certain, leave the
#            arrow out. Each node is placed in a column (L, C, R) and a row of the wide and the
#            narrow layout; frame = the node sits inside the peer-to-peer network frame.
# Texts: English (default) and German, as in community.yaml.

schema_version: 1
checked: 2026-11-15
verified:
  tag: v0.34.16
  commits: [074dac16, 8e7045b9]
  text:
    en: Checked on 15 Nov 2026 against the node software at v0.34.16 (074dac16) and the release-0.34.17 branch (8e7045b9).
    de: Am 15. Nov. 2026 geprüft am Node-Code von v0.34.16 (074dac16) und am Branch release-0.34.17 (8e7045b9).

texts:
  yourself_title: { en: Run it yourself, de: Selbst betreiben }
  yourself_text:
    en: >-
      You keep a machine running and follow its guide. Seven roles, from a node at home to a fuzz
      box in a rack; each card says what the network gets, what the machine needs and who to ask.
    de: >-
      Du hältst einen Rechner am Laufen und folgst seiner Anleitung. Sieben Rollen, vom Node zu
      Hause bis zur Fuzz-Box im Rechenzentrum; jede Karte sagt, was das Netz davon hat, was der
      Rechner braucht und wen man fragt.
  managed_title: { en: Use a managed setup, de: Eine verwaltete Lösung nutzen }
  managed_text:
    en: >-
      An app installs and supervises the node software for you, on a machine you own. The machine
      and its uptime stay yours.
    de: >-
      Eine App installiert und überwacht die Node-Software für dich, auf einem eigenen Rechner. Der
      Rechner und seine Laufzeit bleiben deine Sache.
  managed_none:
    en: This site lists no hosted service that runs BTX infrastructure for you.
    de: Diese Seite führt keinen gehosteten Dienst, der BTX-Infrastruktur für dich betreibt.
  roles_title: { en: The roles, de: Die Rollen }
  kind_network: { en: Network, de: Netz }
  kind_testing: { en: Testing, de: Tests }
  does: { en: What the network gets, de: Was das Netz davon hat }
  hardware: { en: Machine, de: Rechner }
  guide: { en: Guide, de: Anleitung }
  coming: { en: Guide coming., de: Anleitung folgt. }
  ask: { en: Who to ask, de: Wen fragen }
  report_short:
    en: Crashes and security problems go privately to the maintainers, never in public.
    de: Abstürze und Sicherheitsprobleme gehen vertraulich an die Maintainer, nie öffentlich.
  map_title: { en: How it fits together, de: Wie alles zusammenhängt }
  map_lead:
    en: >-
      Who sends what to whom. A box opens its guide or its card; the numbers on the arrows match
      the list below the map, and each line of the list names its source in the node software.
    de: >-
      Wer wem was schickt. Ein Kasten öffnet seine Anleitung oder seine Karte; die Nummern an den
      Pfeilen gehören zur Liste unter der Karte, und jede Zeile der Liste nennt ihre Quelle im
      Node-Code.
  map_name: { en: Map of BTX infrastructure, de: Karte der BTX-Infrastruktur }
  map_desc:
    en: >-
      Boxes for the roles, arrows for what they send each other. The same connections are listed
      in words below the map.
    de: >-
      Kästen für die Rollen, Pfeile für das, was sie einander schicken. Dieselben Verbindungen
      stehen unter der Karte in Worten.
  network: { en: BTX peer-to-peer network, de: BTX-Peer-to-Peer-Netz }
  list_title: { en: The connections in words, de: Die Verbindungen in Worten }
  source: { en: Source, de: Quelle }
  open_guide: { en: open the guide, de: Anleitung öffnen }
  open_card: { en: go to its card, de: zur Karte }
  report_title: { en: "Found a crash or a security problem?", de: "Einen Absturz oder ein Sicherheitsproblem gefunden?" }
  report_text:
    en: >-
      Report it privately through GitHub private vulnerability reporting on btxchain/btx, as its
      security policy asks. Never post a crash, a sanitizer report or a crashing input in a public
      issue, pull request or chat: it can show an attacker how to crash running nodes.
    de: >-
      Vertraulich melden, über GitHubs private Schwachstellenmeldung bei btxchain/btx, wie es deren
      Sicherheitsrichtlinie verlangt. Nie einen Absturz, einen Sanitizer-Bericht oder eine
      absturzauslösende Eingabe in einem öffentlichen Issue, Pull Request oder Chat zeigen: Das kann
      einem Angreifer zeigen, wie man laufende Nodes zum Absturz bringt.
  report_link: { en: Report a vulnerability privately, de: Schwachstelle vertraulich melden }
  policy_link: { en: The security policy (SECURITY.md), de: Die Sicherheitsrichtlinie (SECURITY.md) }

private_route: https://github.com/btxchain/btx/security/advisories/new
policy: https://github.com/btxchain/btx/blob/main/SECURITY.md

managed: [easynode]

roles:
  - id: full-node
    kind: network
    title: { en: Full node, de: Full Node }
    does:
      en: >-
        Relays blocks and transactions and keeps the network reachable. With a qualified GPU it
        checks the MatMul work itself; without one, set it up as a trusted mirror that follows
        signed checks from its signers (on mainnet at least two, by default), or it stops syncing.
      de: >-
        Leitet Blöcke und Transaktionen weiter und hält das Netz erreichbar. Mit einer zugelassenen
        GPU prüft er die MatMul-Arbeit selbst; ohne sie als Trusted Mirror einrichten, der den
        signierten Prüfungen seiner Signer folgt (im Mainnet standardmäßig mindestens zwei), sonst
        bleibt er stehen.
    hardware:
      en: >-
        An always-on computer or small server with an SSD and a steady connection. A GPU is
        optional.
      de: >-
        Ein ständig laufender Rechner oder kleiner Server mit SSD und stabiler Verbindung. Eine GPU
        ist optional.
    guide:
      text: { en: "Before you install a node release: the checklist on the start page", de: "Bevor du ein Node-Release installierst: die Checkliste auf der Startseite" }
      page: home
      anchor: before-installing
    related:
      - text: { en: "Running a node: the steps on the start page", de: "Einen Node betreiben: die Schritte auf der Startseite" }
        page: home
        anchor: nodes
      - text: { en: Node help for stuck heights, de: Node-Hilfe bei hängenden Höhen }
        url: https://network.btx-monitoring.com/help/
      - text: { en: How a trusted mirror works (developers), de: Wie ein Trusted Mirror arbeitet (Entwickler) }
        url: https://github.com/btxchain/btx/blob/main/doc/btx-matmul-trusted-rpc-mirrors.md
    ask:
      en: The node help first; for the rest, the community chats on the links page.
      de: Zuerst die Node-Hilfe; für alles andere die Community-Chats auf der Links-Seite.
    ask_page: links
    security: true

  - id: archive
    kind: network
    title: { en: Archive node and snapshot publisher, de: Archiv-Node und Snapshot-Herausgeber }
    does:
      en: >-
        An archive node keeps every block (prune=0) and serves the whole chain to its peers; the
        status page measures the chain from archive nodes. A snapshot publisher turns a node's data
        into a signed file that saves a new node most of the sync. A sync from genesis currently
        stops at block 126,978 (#272), so new nodes start from a snapshot.
      de: >-
        Ein Archiv-Node behält jeden Block (prune=0) und liefert seinen Peers die ganze Kette; die
        Statusseite misst die Kette an Archiv-Nodes. Ein Snapshot-Herausgeber macht aus den Daten
        eines Nodes eine signierte Datei, die einem neuen Node den Großteil der Synchronisation
        erspart. Ein Sync ab Genesis bleibt derzeit bei Block 126.978 stehen (#272); neue Nodes
        starten daher mit einem Snapshot.
    hardware:
      en: >-
        A server with a large disk (the whole chain, never pruned, plus room for snapshot files)
        and an upload link that can serve them.
      de: >-
        Ein Server mit großer Platte (die ganze Kette, nie gekürzt, plus Platz für
        Snapshot-Dateien) und einer Upload-Leitung, die sie ausliefern kann.
    guide:
      text: { en: Archival node runbook (developers), de: Runbook für Archiv-Nodes (Entwickler) }
      url: https://github.com/btxchain/btx/blob/main/doc/btx-public-node-bootstrap.md
      note:
        en: >-
          Its opening note still calls Epoch A a release candidate; the developers' docs index says it
          has been live on mainnet since block 185,000.
        de: >-
          Sein Einleitungshinweis nennt Epoch A noch einen Release-Kandidaten; laut dem
          Doku-Verzeichnis der Entwickler ist sie seit Block 185.000 im Mainnet aktiv.
    coming:
      en: No community guide yet for publishing a signed snapshot.
      de: Für das Veröffentlichen eines signierten Snapshots gibt es noch keine Community-Anleitung.
    related:
      - text: { en: Signed snapshots in the link list, de: Signierte Snapshots in der Linkliste }
        page: links
        anchor: cat-node-tools
      - text: { en: The developers' UTXO snapshot recipe, de: Das UTXO-Snapshot-Rezept der Entwickler }
        url: https://github.com/btxchain/btx/blob/main/contrib/devtools/README.md
    ask:
      en: The I-OPS lane owner, whose lane covers archive mirrors and signed snapshots.
      de: Die Person, die den Bereich I-OPS betreut; er umfasst Archiv-Mirrors und signierte Snapshots.
    ask_url: https://github.com/BTX-Community/btx-community/blob/main/dev/packs/I-OPS.md
    security: true

  - id: signer
    kind: network
    title: { en: Attestation signer, de: Attestierungs-Signer }
    does:
      en: >-
        Replays the MatMul work of new blocks on a qualified GPU (ExactReplay) and signs the result.
        Trusted mirrors that pinned its key follow those signatures; a node that checks blocks
        itself never uses them in place of its own check. The developers' docs call this role a GPU
        archive or attestor.
      de: >-
        Rechnet die MatMul-Arbeit neuer Blöcke auf einer zugelassenen GPU nach (ExactReplay) und
        signiert das Ergebnis. Trusted Mirrors, die seinen Schlüssel hinterlegt haben, folgen diesen
        Signaturen; ein Node, der Blöcke selbst prüft, ersetzt damit nie seine eigene Prüfung. Die
        Doku der Entwickler nennt die Rolle GPU-Archiv oder Attestor.
    hardware:
      en: >-
        A GPU that passes btxd's self-qualification in strict-device mode, the whole chain
        (prune=0), online around the clock. The runbook reports RTX 5090 and RTX PRO 6000 passing on
        CUDA 13.2 with cuBLASLt 13.4; other cards must pass the same self-test. One signing key per
        machine; never on a miner.
      de: >-
        Eine GPU, die die Selbstqualifizierung von btxd im Modus strict-device besteht, die ganze
        Kette (prune=0), rund um die Uhr online. Laut Runbook bestehen RTX 5090 und RTX PRO 6000 mit
        CUDA 13.2 und cuBLASLt 13.4; andere Karten müssen denselben Selbsttest bestehen. Ein
        Signierschlüssel pro Rechner; nie auf einem Miner.
    guide:
      text: { en: GPU operator runbook (developers), de: Betreiber-Runbook für GPUs (Entwickler) }
      url: https://github.com/btxchain/btx/blob/main/doc/btx-matmul-v4.7-gpu-operator-runbook.md
      note:
        en: >-
          Its status lines still call Epoch A a release candidate; the developers' docs index says it
          has been live on mainnet since block 185,000.
        de: >-
          Seine Statuszeilen nennen Epoch A noch einen Release-Kandidaten; laut dem
          Doku-Verzeichnis der Entwickler ist sie seit Block 185.000 im Mainnet aktiv.
    related:
      - text: { en: Signers and trusted mirrors (developers), de: Signer und Trusted Mirrors (Entwickler) }
        url: https://github.com/btxchain/btx/blob/main/doc/btx-matmul-trusted-rpc-mirrors.md
    ask:
      en: Questions about the runbook as an issue on btxchain/btx. No lane of this hub covers signers yet.
      de: Fragen zum Runbook als Issue bei btxchain/btx. Noch kein Bereich dieses Hubs deckt Signer ab.
    ask_url: https://github.com/btxchain/btx/issues
    security: true

  - id: fuzz-box
    kind: testing
    title: { en: Always-on fuzz box, de: Fuzz-Box im Dauerbetrieb }
    does:
      en: >-
        Runs BTX's more than 270 fuzz targets day and night and keeps every input that reaches new
        code, so it finds bugs that need hours of mutation. A short CI run starts from nothing every
        time.
      de: >-
        Lässt die mehr als 270 Fuzz-Targets von BTX Tag und Nacht laufen und behält jede Eingabe,
        die neuen Code erreicht; so findet sie Fehler, die Stunden an Mutation brauchen. Ein kurzer
        CI-Lauf fängt jedes Mal bei null an.
    hardware:
      en: >-
        A dedicated Linux machine or VM (Ubuntu 24.04): many CPU threads, about 2 GB of RAM per
        fuzzing process, 80 GB of free disk, no GPU. Nothing else on it: no node, wallet, miner or
        keys.
      de: >-
        Ein eigener Linux-Rechner oder eine VM (Ubuntu 24.04): viele CPU-Threads, etwa 2 GB RAM pro
        Fuzzing-Prozess, 80 GB freie Platte, keine GPU. Sonst nichts darauf: kein Node, keine
        Wallet, kein Miner, keine Schlüssel.
    guide:
      text: { en: Running a continuous BTX fuzz box, de: Eine BTX-Fuzz-Box im Dauerbetrieb }
      url: https://github.com/BTX-Community/btx-community/blob/main/dev/fuzz-box/README.md
    ask:
      en: The I-OPS lane owner, who keeps the fuzz-box guide.
      de: Die Person, die I-OPS betreut und die Fuzz-Box-Anleitung pflegt.
    ask_url: https://github.com/BTX-Community/btx-community/blob/main/dev/packs/I-OPS.md
    security: true

  - id: ci-runner
    kind: testing
    title: { en: CI runner, de: CI-Runner }
    does:
      en: >-
        Builds and tests the newest commit of a branch every night and publishes the result, so a
        break shows up within a day. The status page's operator publishes one such run as job CI-0;
        it is on the developers page.
      de: >-
        Baut und testet jede Nacht den neuesten Commit eines Branches und veröffentlicht das
        Ergebnis, damit ein Bruch binnen eines Tages auffällt. Der Betreiber der Statusseite
        veröffentlicht einen solchen Lauf als Job CI-0; er steht auf der Entwicklerseite.
    hardware:
      en: >-
        A dedicated Linux server with many threads and tens of GB of free disk. The CI-0 run of
        15 Nov took about 70 minutes on 30 threads; a coverage build tree alone takes 27 GB.
      de: >-
        Ein eigener Linux-Server mit vielen Threads und einigen zehn GB freier Platte. Der CI-0-Lauf
        vom 15. Nov. brauchte auf 30 Threads etwa 70 Minuten; ein Build-Baum mit Coverage allein
        belegt 27 GB.
    coming:
      en: >-
        Until then: the I-CI pack lists the jobs, the build-and-test page has the recipes, and
        ci/README.md in the btx tree runs a CI stage locally.
      de: >-
        Bis dahin: Das I-CI-Paket listet die Jobs, die Seite zu Build und Tests hat die Rezepte, und
        ci/README.md im btx-Baum führt eine CI-Stufe lokal aus.
    related:
      - text: { en: "I-CI pack: the fork CI jobs", de: "I-CI-Paket: die CI-Jobs auf dem Fork" }
        url: https://github.com/BTX-Community/btx-community/blob/main/dev/packs/I-CI.md
      - text: { en: Build and test recipes, de: Rezepte für Build und Tests }
        url: https://github.com/BTX-Community/btx-community/blob/main/dev/04-build-and-test.md
      - text: { en: The CI scripts in the btx tree, de: Die CI-Skripte im btx-Baum }
        url: https://github.com/btxchain/btx/blob/main/ci/README.md
    ask:
      en: >-
        The status page's operator, who runs the nightly CI-0. The I-CI lane has no owner yet:
        claim it in the lanes file.
      de: >-
        Den Betreiber der Statusseite, der den nächtlichen CI-0 fährt. Der Bereich I-CI hat noch
        niemanden: in der Datei der Bereiche übernehmen.
    ask_url: https://github.com/BTX-Community/btx-community/blob/main/dev/07-lanes.md
    security: true

  - id: sanitizers
    kind: testing
    title: { en: Sanitizer runs, de: Sanitizer-Läufe }
    does:
      en: >-
        Builds the node with AddressSanitizer and UndefinedBehaviorSanitizer, or with
        ThreadSanitizer, and runs the tests. Memory and threading bugs that pass silently in a
        normal build turn into reports.
      de: >-
        Baut den Node mit AddressSanitizer und UndefinedBehaviorSanitizer oder mit ThreadSanitizer
        und lässt die Tests laufen. Speicher- und Thread-Fehler, die in einem normalen Build still
        durchgehen, werden zu Berichten.
    hardware:
      en: >-
        A Linux machine with clang (clang 20 or newer for ThreadSanitizer), plenty of RAM and
        threads. Runs are several times slower: functional tests get --timeout-factor=4.
      de: >-
        Ein Linux-Rechner mit clang (clang 20 oder neuer für ThreadSanitizer), viel RAM und vielen
        Threads. Die Läufe sind um ein Mehrfaches langsamer: Funktionstests bekommen
        --timeout-factor=4.
    guide:
      text: { en: "Build and test, section 6: Sanitizers", de: "Build und Tests, Abschnitt 6: Sanitizer" }
      url: https://github.com/BTX-Community/btx-community/blob/main/dev/04-build-and-test.md
    ask:
      en: >-
        The I-CI lane, which holds the ASan/UBSan and TSan jobs (CI-2, CI-3). It has no owner yet:
        until someone claims it, open an issue in this repository.
      de: >-
        Den Bereich I-CI, zu dem die Jobs für ASan/UBSan und TSan gehören (CI-2, CI-3). Er hat noch
        niemanden: Bis ihn jemand übernimmt, ein Issue in diesem Repository eröffnen.
    ask_url: https://github.com/BTX-Community/btx-community/issues
    security: true

  - id: guix
    kind: testing
    title: { en: Guix rebuilder, de: Guix-Nachbau }
    does:
      en: >-
        Rebuilds a release from its tagged source in a fixed Guix environment, so independent
        builders can compare hashes and nobody has to trust a single build machine. The v0.34.16
        release notes say its Linux binaries need glibc 2.38 or newer, while these scripts build
        against glibc 2.31: they were not made with them, so today rebuilders can only compare with
        each other.
      de: >-
        Baut ein Release aus seinem getaggten Quellcode in einer festen Guix-Umgebung nach, damit
        unabhängige Nachbauer Hashes vergleichen und niemand einem einzelnen Build-Rechner trauen
        muss. Laut den Release-Notes von v0.34.16 brauchen seine Linux-Binärdateien glibc 2.38 oder
        neuer, diese Skripte bauen gegen glibc 2.31: Sie entstanden nicht mit ihnen, Nachbauer
        vergleichen sich heute nur untereinander.
    hardware:
      en: >-
        A Linux machine with Guix: 16 GB free for the Guix store plus 8 GB per platform you build.
        More cores build faster.
      de: >-
        Ein Linux-Rechner mit Guix: 16 GB frei für den Guix-Store plus 8 GB pro gebauter Plattform.
        Mehr Kerne bauen schneller.
    coming:
      en: >-
        The scripts are in the btx tree (contrib/guix). Their README is Bitcoin Core's and points at
        Bitcoin Core's signature repository; this site knows of no BTX one yet.
      de: >-
        Die Skripte liegen im btx-Baum (contrib/guix). Ihr README ist das von Bitcoin Core und
        verweist auf dessen Signatur-Repository; ein BTX-eigenes kennt diese Seite noch nicht.
    related:
      - text: { en: The Guix scripts in the btx tree, de: Die Guix-Skripte im btx-Baum }
        url: https://github.com/btxchain/btx/tree/main/contrib/guix
    ask:
      en: No lane covers reproducible builds yet; open an issue in this repository.
      de: Noch kein Bereich deckt reproduzierbare Builds ab; ein Issue in diesem Repository eröffnen.
    ask_url: https://github.com/BTX-Community/btx-community/issues
    security: true

map:
  nodes:
    - id: miners
      title: { en: Miners and pools, de: Miner und Pools }
      page: links
      anchor: cat-pools
      wide: { col: L, row: 1 }
      narrow: { col: R, row: 1 }
    - id: fullnodes
      title: { en: Full nodes, de: Full Nodes }
      code: -matmulvalidation=consensus
      role: full-node
      frame: true
      tone: chain
      wide: { col: C, row: 1 }
      narrow: { col: C, row: 1 }
    - id: swapnet
      title: { en: SwapNet peers, de: SwapNet-Peers }
      code: -swapnet=1
      url: https://github.com/btxchain/btx/blob/main/doc/swapnet/OPERATIONS.md
      wide: { col: L, row: 2 }
      narrow: { col: R, row: 2 }
    - id: relays
      title: { en: Discovery relays, de: Discovery-Relays }
      code: -matmulvalidation=relay
      url: https://github.com/btxchain/btx/blob/main/doc/btx-public-node-bootstrap.md
      wide: { col: R, row: 2 }
      narrow: { col: R, row: 3 }
    - id: mirrors
      title: { en: Trusted mirrors, de: Trusted Mirrors }
      code: -matmulvalidation=trusted
      url: https://github.com/btxchain/btx/blob/main/doc/btx-matmul-trusted-rpc-mirrors.md
      frame: true
      tone: chain
      wide: { col: C, row: 3 }
      narrow: { col: C, row: 4 }
    - id: signers
      title: { en: Attestation signers, de: Attestierungs-Signer }
      role: signer
      tone: chain
      wide: { col: R, row: 3 }
      narrow: { col: R, row: 4 }
    - id: snapshots
      title: { en: Snapshot publishers, de: Snapshot-Herausgeber }
      role: archive
      wide: { col: L, row: 4 }
      narrow: { col: R, row: 5 }
    - id: archive
      title: { en: Archive nodes, de: Archiv-Nodes }
      code: prune=0
      role: archive
      frame: true
      tone: chain
      wide: { col: C, row: 5 }
      narrow: { col: C, row: 6 }
    - id: status
      title: { en: Status page, de: Statusseite }
      url: https://network.btx-monitoring.com/
      wide: { col: R, row: 5 }
      narrow: { col: R, row: 6 }
    - id: releases
      title: { en: Releases, de: Releases }
      url: https://github.com/btxchain/btx/releases
      tone: build
      wide: { col: C, row: 6 }
      narrow: { col: C, row: 7 }
    - id: guix
      title: { en: Guix rebuilders, de: Guix-Nachbauer }
      role: guix
      tone: build
      wide: { col: L, row: 6 }
      narrow: { col: R, row: 7 }

  edges:
    - from: miners
      to: fullnodes
      both: true
      label: { en: "templates out, blocks back", de: "Vorlagen hin, Blöcke zurück" }
      text:
        en: >-
          A full node hands out block templates; miners and pools send solved blocks back
          (getblocktemplate, then a stratum job, then submitblock).
        de: >-
          Ein Full Node gibt Blockvorlagen aus; Miner und Pools schicken gelöste Blöcke zurück
          (getblocktemplate, dann ein Stratum-Job, dann submitblock).
      cites: ["btx:doc/btx-miner-pool-readiness.md:4-5"]
    - from: fullnodes
      to: archive
      both: true
      label: { en: blocks and transactions, de: Blöcke und Transaktionen }
      text:
        en: >-
          Blocks and transactions travel between peers. A node that keeps every block serves the
          whole chain; a trusted mirror still checks bodies, transactions, scripts and state
          itself, and for the MatMul work it relies on its signers.
        de: >-
          Blöcke und Transaktionen wandern zwischen den Peers. Ein Node, der jeden Block behält,
          liefert die ganze Kette; ein Trusted Mirror prüft Blockinhalte, Transaktionen, Skripte und
          Zustand weiter selbst, und bei der MatMul-Arbeit verlässt er sich auf seine Signer.
      cites:
        - "btx:src/protocol.h:504-506"
        - "btx:doc/btx-matmul-trusted-rpc-mirrors.md:22-32"
    - from: swapnet
      to: network
      both: true
      label: { en: swap offers over the same peer links, de: Tauschangebote über dieselben Peer-Verbindungen }
      text:
        en: >-
          A node started with -swapnet=1 finds other SwapNet nodes over the peer connections it
          already has: no new port, seed list or hosted service. SwapNet is off by default.
        de: >-
          Ein Node, der mit -swapnet=1 startet, findet andere SwapNet-Nodes über die
          Peer-Verbindungen, die er schon hat: kein neuer Port, keine Seed-Liste, kein gehosteter
          Dienst. SwapNet ist standardmäßig aus.
      cites:
        - "btx:doc/swapnet/OPERATIONS.md:5"
        - "btx:src/swapnet/node.cpp:96"
        - "btx:src/protocol.h:61-68"
    - from: relays
      to: network
      label: { en: peer addresses only, de: nur Peer-Adressen }
      text:
        en: >-
          A discovery relay (-matmulvalidation=relay) is the mode meant for public DNS seeds and
          addnode hosts. It only hands out peer addresses: it serves no blocks, is no authority on
          the chain and never asks for or serves signatures.
        de: >-
          Ein Discovery-Relay (-matmulvalidation=relay) ist der Modus für öffentliche DNS-Seeds und
          addnode-Hosts. Es gibt nur Peer-Adressen aus: Es liefert keine Blöcke, ist keine Autorität
          für die Kette und fragt nie nach Signaturen und liefert keine.
      cites:
        - "btx:src/init.cpp:651"
        - "btx:src/init.cpp:2134-2136"
        - "btx:doc/btx-public-node-bootstrap.md:60-62"
    - from: signers
      to: mirrors
      label: { en: signed attestations, de: signierte Attestierungen }
      text:
        en: >-
          A signer signs each block whose MatMul work it replayed (messages getmmattest and
          mmattest). On mainnet a trusted mirror by default accepts that work only with signatures
          from at least two keys it pinned itself; any peer may pass them on. A node that checks
          blocks itself never uses them in place of its own check.
        de: >-
          Ein Signer signiert jeden Block, dessen MatMul-Arbeit er nachgerechnet hat (Nachrichten
          getmmattest und mmattest). Im Mainnet akzeptiert ein Trusted Mirror diese Arbeit
          standardmäßig nur mit Signaturen von mindestens zwei selbst hinterlegten Schlüsseln; jeder
          Peer darf sie weitergeben. Ein Node, der Blöcke selbst prüft, ersetzt damit nie seine
          eigene Prüfung.
      cites:
        - "btx:src/protocol.h:320-327"
        - "btx:doc/btx-matmul-trusted-rpc-mirrors.md:34-38"
        - "btx:doc/btx-matmul-trusted-rpc-mirrors.md:94-95"
        - "btx:doc/btx-matmul-trusted-rpc-mirrors.md:131-134"
        - "btx:doc/btx-matmul-v4.7-gpu-operator-runbook.md:121-125"
    - from: snapshots
      to: network
      label: { en: a signed starting point, de: ein signierter Startpunkt }
      text:
        en: >-
          A snapshot saves a new node most of the sync: a signed copy of a node's data, or a UTXO
          snapshot at a height compiled into btxd (loadtxoutset). Check its SHA-256 and signature
          before you load it. A node holding an attested UTXO snapshot can also offer it to peers
          over the P2P network.
        de: >-
          Ein Snapshot erspart einem neuen Node den Großteil der Synchronisation: eine signierte Kopie
          der Daten eines Nodes oder ein UTXO-Snapshot auf einer in btxd einkompilierten Höhe
          (loadtxoutset). Vor dem Laden SHA-256 und Signatur prüfen. Ein Node mit einem attestierten
          UTXO-Snapshot kann ihn außerdem über das P2P-Netz an Peers anbieten.
      cites:
        - "btx:doc/btx-mining-node-snapshot-runbook.md:76-95"
        - "btx:contrib/devtools/README.md:179-182"
        - "btx:src/protocol.h:564-567"
        - "btx:src/init.cpp:765"
    - from: archive
      to: status
      label: { en: chain data from an archive node, de: Kettendaten von einem Archiv-Node }
      text:
        en: >-
          The status page measures supply, chain height and network figures from an archive
          node.
        de: >-
          Die Statusseite misst Umlauf, Blockhöhe und Netzwerte an einem Archiv-Node.
      cites: ["community:README.md:50"]
    - from: releases
      to: network
      label: { en: release archives, de: Release-Archive }
      text:
        en: >-
          Release archives are published on the releases page of btxchain/btx. For v0.34.16 there are
          two, both for Linux x86_64 (one built with CUDA 13), and a SHA256SUMS file; on other
          platforms the node is built from source.
        de: >-
          Release-Archive erscheinen auf der Release-Seite von btxchain/btx. Für v0.34.16 sind es zwei,
          beide für Linux x86_64 (eines mit CUDA 13 gebaut), dazu eine Datei SHA256SUMS; auf anderen
          Plattformen wird der Node aus dem Quellcode gebaut.
      cites:
        - "btx:doc/btx-github-release-automation.md:25-26"
        - "release:v0.34.16"
    - from: releases
      to: guix
      label: { en: tagged source to rebuild, de: getaggter Quellcode zum Nachbauen }
      text:
        en: >-
          A rebuilder builds a release's tagged source with contrib/guix, attests to the result and
          verifies other rebuilders' attestations. The v0.34.16 release notes say its Linux binaries
          need glibc 2.38 or newer and these scripts build against glibc 2.31, so their hashes cannot
          match a rebuild yet.
        de: >-
          Ein Nachbauer baut den getaggten Quellcode eines Releases mit contrib/guix, bezeugt das
          Ergebnis und prüft die Bezeugungen anderer Nachbauer. Laut den Release-Notes von v0.34.16
          brauchen seine Linux-Binärdateien glibc 2.38 oder neuer, diese Skripte bauen gegen glibc
          2.31; ihre Hashes können einem Nachbau daher noch nicht gleichen.
      cites:
        - "btx:contrib/guix/README.md:179-199"
        - "btx:contrib/guix/manifest.scm:123"
        - "btx:doc/release-notes-0.34.16.md:32-33"
        - "release:v0.34.16"
