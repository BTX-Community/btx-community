<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The logo mark of the page header: a rounded square, cyan to violet, on the page background. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7ff"/>
      <stop offset="1" stop-color="#b79cff"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#08080c"/>
  <rect x="6" y="6" width="20" height="20" rx="4.5" fill="url(#g)"/>
</svg>
